name: Audit SEAndroid v100.0.1 - 33 Changes

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'SEAndroid_v100.0.1.zip'
      - '.github/workflows/audit-v100.yml'
      - 'audit_v100_33.py'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    name: Audit 33 requested modifications

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Extract uploaded source
        shell: bash
        run: |
          set -euo pipefail
          test -f SEAndroid_v100.0.1.zip
          rm -rf _audit
          mkdir -p _audit
          unzip -q SEAndroid_v100.0.1.zip -d _audit
          ROOT="$(find _audit -type f -name gradlew -print -quit | xargs -r dirname)"
          if [ -z "$ROOT" ]; then
            echo "ERROR: gradlew not found in SEAndroid_v100.0.1.zip"
            find _audit -maxdepth 4 -type f | head -n 200
            exit 1
          fi
          echo "SOURCE_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Source root: $ROOT"

      - name: Run 33-change source audit
        run: |
          python3 audit_v100_33.py "$SOURCE_ROOT"

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: SEAndroid_v100.0.1-33-AUDIT
          path: |
            AUDIT_33.md
            AUDIT_FILES.txt
          retention-days: 30
