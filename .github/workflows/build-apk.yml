name: SEAndroid v100.0.9 Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download v100.0.7 base artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl -fL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${REPO}/actions/artifacts/10737831779/zip" -o base-artifact.zip
          mkdir -p base-artifact
          unzip -q base-artifact.zip -d base-artifact

      - name: Extract and reconstruct v100.0.9 source
        run: |
          set -euo pipefail
          SRCZIP=$(find base-artifact -type f -name 'SEAndroid_v100.0.7.zip' -print -quit)
          test -n "$SRCZIP"
          rm -rf source base7work patch.diff patch.xz
          mkdir source
          unzip -q "$SRCZIP" -d source
          ROOT=$(find source -maxdepth 5 -type f -name gradlew -print -quit | xargs -r dirname)
          test -n "$ROOT"
          mv "$ROOT" base7work
          cat v7_v9_source.diff.xz.p01.b64 v7_v9_source.diff.xz.p02.b64 v7_v9_source.diff.xz.p03.b64 > patch.xz.b64
          base64 -d patch.xz.b64 > patch.xz
          xz -t patch.xz
          xz -dc patch.xz > patch.diff
          cd base7work
          patch -p1 --forward < "$GITHUB_WORKSPACE/patch.diff"
          base64 -d "$GITHUB_WORKSPACE/fix_search_enum.diff.b64" > "$GITHUB_WORKSPACE/fix_search_enum.diff"
          patch -p1 --forward < "$GITHUB_WORKSPACE/fix_search_enum.diff"
          cd "$GITHUB_WORKSPACE"
          mv base7work SEAndroid_v100.0.9
          mkdir -p SEAndroid_v100.0.9/.github/workflows
          cp .github/workflows/build-apk.yml SEAndroid_v100.0.9/.github/workflows/build-apk.yml

      - name: Verify requested changes
        working-directory: SEAndroid_v100.0.9
        run: |
          set -euo pipefail
          grep -q 'versionCode 1000009' app/build.gradle
          grep -q 'versionName "100.0.9"' app/build.gradle
          grep -q 'GridLayoutManager(this@VodActivity, 4)' app/src/main/java/com/orbital/iptv/ui/vod/VodActivity.kt
          grep -q 'GridLayoutManager(this@SeriesActivity, 4)' app/src/main/java/com/orbital/iptv/ui/series/SeriesActivity.kt
          grep -q 'GridLayoutManager(this@HomeActivity, 3)' app/src/main/java/com/orbital/iptv/ui/home/HomeActivity.kt
          grep -q 'RECENTLY ADDED' app/src/main/java/com/orbital/iptv/ui/vod/VodActivity.kt
          grep -q 'RECENTLY ADDED' app/src/main/java/com/orbital/iptv/ui/series/SeriesActivity.kt
          grep -q 'manual_rotate_landscape' app/src/main/java/com/orbital/iptv/utils/PrefsManager.kt
          grep -q '0.5f, 1f, 2f, 3f' app/src/main/java/com/orbital/iptv/ui/player/PlayerActivity.kt
          ! grep -q '4f' app/src/main/java/com/orbital/iptv/ui/player/PlayerActivity.kt
          grep -q 'android:layout_height="64dp"' app/src/main/res/layout/layout_main_sidebar.xml
          ! grep -q 'MAIN MENU' app/src/main/res/layout/layout_main_sidebar.xml
          ! grep -q 'nav_search' app/src/main/res/layout/layout_main_sidebar.xml
          grep -q 'android:text="ROTATE"' app/src/main/res/layout/activity_settings.xml
          ! grep -q 'AUTO ROTATE' app/src/main/res/layout/activity_settings.xml
          grep -q 'android:text="1x"' app/src/main/res/layout/activity_settings.xml
          ! grep -q 'android:text="4x"' app/src/main/res/layout/activity_settings.xml
          grep -q 'tvRating.text = buildList' app/src/main/java/com/orbital/iptv/ui/vod/VodAdapter.kt
          grep -q 'getVodInfo' app/src/main/java/com/orbital/iptv/ui/vod/VodAdapter.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build APK
        working-directory: SEAndroid_v100.0.9
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Package APK and source
        run: |
          set -euo pipefail
          mkdir -p output
          APK=SEAndroid_v100.0.9/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          cp "$APK" output/SEAndroid_v100.0.9.apk
          cd SEAndroid_v100.0.9
          zip -qr "$GITHUB_WORKSPACE/output/SEAndroid_v100.0.9.zip" . -x '*/build/*' '*/.gradle/*' '*.iml' '.git/*'
          cd "$GITHUB_WORKSPACE"
          test -s output/SEAndroid_v100.0.9.apk
          test -s output/SEAndroid_v100.0.9.zip

      - name: Upload APK and source
        uses: actions/upload-artifact@v4
        with:
          name: SEAndroid_v100.0.9
          path: |
            output/SEAndroid_v100.0.9.apk
            output/SEAndroid_v100.0.9.zip
          if-no-files-found: error
          retention-days: 30