name: Build SE IPTV PLAYER V10.1.0
run-name: Build SE IPTV PLAYER V10.1.0

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager -perm -111 | head -n 1 || true)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found under $ANDROID_HOME"
            find "$ANDROID_HOME" -maxdepth 5 -type f -name sdkmanager -print || true
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME"             "platform-tools"             "platforms;android-35"             "build-tools;35.0.0"

      - name: Extract SE project
        shell: bash
        run: |
          set -e
          rm -rf _source SE-Android-v10.1.0
          mkdir -p _source

          test -f SE-v10.1.0-source.zip
          unzip -q SE-v10.1.0-source.zip -d _source

          PROJECT_ROOT="$(find _source -maxdepth 4 -type f -name gradlew -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_ROOT" ] || { [ ! -f "$PROJECT_ROOT/settings.gradle" ] && [ ! -f "$PROJECT_ROOT/settings.gradle.kts" ]; }; then
            echo "ERROR: Could not find a valid Gradle project in SE-v10.1.0-source.zip"
            find _source -maxdepth 4 -type f \( -name gradlew -o -name settings.gradle -o -name settings.gradle.kts \) -print
            exit 1
          fi

          mv "$PROJECT_ROOT" SE-Android-v10.1.0

          test -f SE-Android-v10.1.0/gradlew
          test -f SE-Android-v10.1.0/settings.gradle || test -f SE-Android-v10.1.0/settings.gradle.kts

          echo "=== Project extracted ==="
          ls -la SE-Android-v10.1.0

      - name: Fix SE Activity imports
        shell: bash
        run: |
          set -e

          SERIES="SE-Android-v10.1.0/app/src/main/java/com/orbital/iptv/ui/series/SeriesActivity.kt"
          VOD="SE-Android-v10.1.0/app/src/main/java/com/orbital/iptv/ui/vod/VodActivity.kt"

          grep -q 'import com.orbital.iptv.ui.vod.VodActivity' "$SERIES" ||             sed -i '/^import android.content.Intent$/a import com.orbital.iptv.ui.vod.VodActivity' "$SERIES"

          grep -q 'import com.orbital.iptv.ui.series.SeriesActivity' "$VOD" ||             sed -i '/^import android.content.Intent$/a import com.orbital.iptv.ui.series.SeriesActivity' "$VOD"

          echo "=== Patched Activity imports ==="
          grep -n 'Activity' "$SERIES" | head -n 12
          grep -n 'Activity' "$VOD" | head -n 12

      - name: Fix Cast Kotlin compatibility
        working-directory: SE-Android-v10.1.0
        shell: bash
        run: |
          set -e

          echo "=== Cast dependency declarations ==="
          grep -RIn --exclude-dir=.gradle --exclude-dir=build \
            -E 'play-services-cast-framework|castFramework|22\.1\.0' . || true

          # Cast Framework 22.1.0 adds a Kotlin stdlib 2.1.0 dependency.
          # This project is built with Kotlin 1.9.x, so use the immediately
          # preceding Cast SDK release, 22.0.0, which does not introduce that
          # Kotlin 2.1 metadata dependency.
          while IFS= read -r -d '' f; do
            sed -i 's/22\.1\.0/22.0.0/g' "$f"
          done < <(grep -RIlz --exclude-dir=.gradle --exclude-dir=build \
            'play-services-cast-framework' . || true)

          echo "=== Cast dependency declarations after patch ==="
          grep -RIn --exclude-dir=.gradle --exclude-dir=build \
            -E 'play-services-cast-framework|castFramework|22\.1\.0' . || true

          cat > cast-compat.init.gradle <<'EOF'
          allprojects {
              configurations.configureEach {
                  resolutionStrategy.eachDependency { details ->
                      if (details.requested.group == "com.google.android.gms" &&
                          (details.requested.name == "play-services-cast-framework" ||
                           details.requested.name == "play-services-cast") &&
                          details.requested.version == "22.1.0") {
                          details.useVersion("22.0.0")
                          details.because("Kotlin 1.9.x compatibility")
                      }
                  }
              }

              plugins.withId("org.jetbrains.kotlin.android") {
                  tasks.configureEach { task ->
                      if (task.hasProperty("kotlinOptions")) {
                          task.kotlinOptions.freeCompilerArgs += "-Xskip-metadata-version-check"
                      }
                  }
              }
          }
          EOF

          echo "=== Cast dependency graph ==="
          ./gradlew -I cast-compat.init.gradle :app:dependencyInsight \
            --dependency play-services-cast-framework \
            --configuration releaseCompileClasspath || true
          
      - name: Repair missing SE HomeActivity constant
        working-directory: SE-Android-v10.1.0
        shell: bash
        run: |
          set -e

          HOME_ACTIVITY="app/src/main/java/com/orbital/iptv/ui/home/HomeActivity.kt"
          test -f "$HOME_ACTIVITY"

          echo "=== Checking EXTRA_OPEN_SETTINGS ==="
          grep -n "EXTRA_OPEN_SETTINGS" "$HOME_ACTIVITY" || true

          # The SE navigation patches reference HomeActivity.EXTRA_OPEN_SETTINGS.
          # Define the constant in HomeActivity's companion object so all callers
          # (HomeActivity, SeriesActivity, VodActivity, MainSidebarController)
          # resolve the same Intent extra key.
          if ! grep -q 'const val EXTRA_OPEN_SETTINGS' "$HOME_ACTIVITY"; then
            python3 - "$HOME_ACTIVITY" <<'PY'
import pathlib
import re
import sys

path = pathlib.Path(sys.argv[1])
text = path.read_text(encoding="utf-8")

# Reuse an existing companion object when present.
companion = re.search(r'\bcompanion\s+object\s*\{', text)
if companion:
    pos = companion.end()
    text = text[:pos] + '\n        const val EXTRA_OPEN_SETTINGS = "open_settings"\n' + text[pos:]
else:
    # Otherwise insert a companion object immediately inside HomeActivity.
    cls = re.search(r'(class\s+HomeActivity\b[^\{]*\{)', text)
    if not cls:
        raise SystemExit("HomeActivity class declaration not found")
    pos = cls.end()
    text = text[:pos] + '\n\n    companion object {\n        const val EXTRA_OPEN_SETTINGS = "open_settings"\n    }\n' + text[pos:]

path.write_text(text, encoding="utf-8")
PY
          fi

          echo "=== EXTRA_OPEN_SETTINGS after repair ==="
          grep -n -C 3 "EXTRA_OPEN_SETTINGS" "$HOME_ACTIVITY"

      - name: Verify Java
        run: java -version

      - name: Verify Gradle
        working-directory: SE-Android-v10.1.0
        run: ./gradlew --version

      - name: Build Release APK
        working-directory: SE-Android-v10.1.0
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew -I cast-compat.init.gradle clean assembleRelease --stacktrace --no-daemon

      - name: Sign APK
        shell: bash
        run: |
          set -e

          APK="$(find SE-Android-v10.1.0/app/build/outputs/apk/release             -type f -name "*.apk" | head -n 1)"

          test -n "$APK"

          mkdir -p signing output

          echo "Generating a temporary signing key for this installable APK..."
          keytool -genkeypair             -keystore signing/se-release.keystore             -storepass changeit             -keypass changeit             -alias se-release             -keyalg RSA             -keysize 2048             -validity 10000             -dname "CN=SE IPTV PLAYER, OU=SE, O=SE, L=Unknown, ST=Unknown, C=EG"             -noprompt

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -perm -111 | sort -V | tail -n 1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign -perm -111 | sort -V | tail -n 1)"

          test -n "$APKSIGNER"
          test -n "$ZIPALIGN"

          "$ZIPALIGN" -f -p 4 "$APK" output/SE-v10.1.0-aligned.apk

          "$APKSIGNER" sign             --ks signing/se-release.keystore             --ks-pass pass:changeit             --key-pass pass:changeit             --ks-key-alias se-release             --out output/SE-v10.1.0-universal-release.apk             output/SE-v10.1.0-aligned.apk

          rm -f output/SE-v10.1.0-aligned.apk

          "$APKSIGNER" verify --verbose output/SE-v10.1.0-universal-release.apk

          echo "=== Signed APK ==="
          ls -lh output/SE-v10.1.0-universal-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SE-v10.1.0-APK
          path: output/SE-v10.1.0-universal-release.apk
          retention-days: 30
