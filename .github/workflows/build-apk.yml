name: SEAndroid v100.0.13 Build — Genç Player + PiP Fix

on:
  push:
    branches: [main]
    paths-ignore:
      - "BUILD_ARTIFACT_OUTPUT_IDS_v100.0.13_*.json"
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct v100.0.9 source
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OLD_COMMIT: d6e908f297a8fe08ca6418e89c3d7c2e9ce146f3
        run: |
          set -euo pipefail
          git show "${OLD_COMMIT}:v7_v9_source.diff.xz.p01.b64" > v9p01.b64
          git show "${OLD_COMMIT}:v7_v9_source.diff.xz.p02.b64" > v9p02.b64
          git show "${OLD_COMMIT}:v7_v9_source.diff.xz.p03.b64" > v9p03.b64
          git show "${OLD_COMMIT}:fix_search_enum.diff.b64" > fix_search_enum.diff.b64
          cat v9p01.b64 v9p02.b64 v9p03.b64 > patch.xz.b64
          base64 -d patch.xz.b64 > patch.xz
          xz -t patch.xz
          xz -dc patch.xz > patch.diff
          base64 -d fix_search_enum.diff.b64 > fix_search_enum.diff

          curl -fL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/actions/artifacts/10737831779/zip" \
            -o base-artifact.zip
          mkdir -p base-artifact source
          unzip -q base-artifact.zip -d base-artifact
          SRCZIP=$(find base-artifact -type f -name 'SEAndroid_v100.0.7.zip' -print -quit)
          test -n "${SRCZIP}"
          unzip -q "${SRCZIP}" -d source
          ROOT=$(find source -maxdepth 5 -type f -name gradlew -print -quit | xargs -r dirname)
          test -n "${ROOT}"
          mv "${ROOT}" base7work
          cd base7work
          patch -p1 --forward < "$GITHUB_WORKSPACE/patch.diff"
          patch -p1 --forward < "$GITHUB_WORKSPACE/fix_search_enum.diff"
          cd "$GITHUB_WORKSPACE"
          mv base7work source

      - name: Apply v100.0.10 source patches
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail

          curl -fL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.raw" \
            "https://raw.githubusercontent.com/${REPO}/${COMMIT}/se_v9_to_v10_source.patch.xz.b64" \
            -o "$GITHUB_WORKSPACE/se_v9_to_v10_source.patch.xz.b64"
          base64 -d "$GITHUB_WORKSPACE/se_v9_to_v10_source.patch.xz.b64" > "$GITHUB_WORKSPACE/se_v9_to_v10_source.patch.xz"
          xz -t "$GITHUB_WORKSPACE/se_v9_to_v10_source.patch.xz"
          xz -dc "$GITHUB_WORKSPACE/se_v9_to_v10_source.patch.xz" > "$GITHUB_WORKSPACE/se_v9_to_v10_source.patch"
          patch -p1 --forward < "$GITHUB_WORKSPACE/se_v9_to_v10_source.patch"

          curl -fL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.raw" \
            "https://raw.githubusercontent.com/${REPO}/${COMMIT}/fix_plex_v100.0.10.patch" \
            -o "$GITHUB_WORKSPACE/fix_plex_v100.0.10.patch"
          patch -p1 --forward < "$GITHUB_WORKSPACE/fix_plex_v100.0.10.patch"

      - name: Remove deleted UI remnants
        working-directory: source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          header_specs = [
              ("app/src/main/res/layout/activity_vod.xml", "MOVIES"),
              ("app/src/main/res/layout/activity_series.xml", "SERIES"),
              ("app/src/main/res/layout/activity_home.xml", "LIVE TV"),
          ]
          for filename, label in header_specs:
              p = Path(filename)
              s = p.read_text(encoding="utf-8")
              pattern = re.compile(
                  r'\s*<LinearLayout\b[^>]*android:layout_height="46dp"[^>]*>.*?'
                  r'android:text="' + re.escape(label) + r'".*?</LinearLayout>',
                  re.S
              )
              s, removed = pattern.subn("", s, count=1)
              if removed != 1:
                  raise SystemExit(f"Could not remove {label} title bar from {filename}")
              s = s.replace(' android:nextFocusLeft="@id/header_tv_listings"', "")
              if f'android:text="{label}"' in s:
                  raise SystemExit(f"{label} title bar still present in {filename}")
              p.write_text(s, encoding="utf-8")

          home = Path("app/src/main/java/com/orbital/iptv/ui/home/HomeActivity.kt")
          hs = home.read_text(encoding="utf-8")
          hs = re.sub(
              r'\n\s*binding\.headerTvListings\.setOnClickListener\s*\{.*?\n\s*binding\.headerTvListings\.text\s*=\s*"LIVE TV"\s*\n',
              '\n',
              hs,
              flags=re.S
          )
          hs = re.sub(r'^\s*binding\.headerTvListings\.(?:setBackgroundColor|setTextColor).*\n', '', hs, flags=re.M)
          if "headerTvListings" in hs:
              raise SystemExit("headerTvListings reference remains")
          home.write_text(hs, encoding="utf-8")

          for filename, field in [
              ("app/src/main/java/com/orbital/iptv/ui/vod/VodActivity.kt", "tvMovieCount"),
              ("app/src/main/java/com/orbital/iptv/ui/series/SeriesActivity.kt", "tvShowCount"),
          ]:
              p = Path(filename)
              s = p.read_text(encoding="utf-8")
              s = re.sub(r'\s*binding\.' + re.escape(field) + r'\.text\s*=\s*[^;\n]*(?:;|(?=\n)|$)', '', s)
              s = re.sub(r'\s*binding\.' + re.escape(field) + r'\.text\s*=\s*\$\{[^}]*\}\s*(?:TITLES|SHOWS)\s*', '', s)
              if f"binding.{field}" in s:
                  raise SystemExit(f"{field} binding reference remains")
              p.write_text(s, encoding="utf-8")

          for path in [
              "app/src/main/java/com/orbital/iptv/ui/search/GlobalSearchActivity.kt",
              "app/src/main/res/layout/activity_global_search.xml",
              "app/src/main/res/layout/item_global_search.xml",
          ]:
              Path(path).unlink(missing_ok=True)
          PY

      - name: Apply v100.0.11 changes
        working-directory: source
        run: |
          set -euo pipefail
          base64 -d "$GITHUB_WORKSPACE/se_v100.10_to_v100.11.patch.xz.b64" > "$GITHUB_WORKSPACE/se_v100.10_to_v100.11.patch.xz"
          xz -t "$GITHUB_WORKSPACE/se_v100.10_to_v100.11.patch.xz"
          xz -dc "$GITHUB_WORKSPACE/se_v100.10_to_v100.11.patch.xz" > "$GITHUB_WORKSPACE/se_v100.10_to_v100.11.patch"
          patch -p1 --forward < "$GITHUB_WORKSPACE/se_v100.10_to_v100.11.patch"

      - name: Apply v100.0.12 changes
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          curl -fL             -H "Authorization: Bearer ${GH_TOKEN}"             -H "Accept: application/vnd.github.raw"             "https://raw.githubusercontent.com/${REPO}/${COMMIT}/se_v100.11_to_v100.12.patch.xz.b64"             -o "$GITHUB_WORKSPACE/se_v100.11_to_v100.12.patch.xz.b64"
          base64 -d "$GITHUB_WORKSPACE/se_v100.11_to_v100.12.patch.xz.b64" > "$GITHUB_WORKSPACE/se_v100.11_to_v100.12.patch.xz"
          xz -t "$GITHUB_WORKSPACE/se_v100.11_to_v100.12.patch.xz"
          xz -dc "$GITHUB_WORKSPACE/se_v100.11_to_v100.12.patch.xz" > "$GITHUB_WORKSPACE/se_v100.11_to_v100.12.patch"
          patch -p1 --forward < "$GITHUB_WORKSPACE/se_v100.11_to_v100.12.patch"

      - name: Apply v100.0.13 changes
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          curl -fL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.raw" \
            "https://raw.githubusercontent.com/${REPO}/${COMMIT}/se_v100.12_to_v100.13.patch.xz.b64" \
            -o "$GITHUB_WORKSPACE/se_v100.12_to_v100.13.patch.xz.b64"
          base64 -d "$GITHUB_WORKSPACE/se_v100.12_to_v100.13.patch.xz.b64" > "$GITHUB_WORKSPACE/se_v100.12_to_v100.13.patch.xz"
          xz -t "$GITHUB_WORKSPACE/se_v100.12_to_v100.13.patch.xz"
          xz -dc "$GITHUB_WORKSPACE/se_v100.12_to_v100.13.patch.xz" > "$GITHUB_WORKSPACE/se_v100.12_to_v100.13.patch"
          patch -p1 --forward < "$GITHUB_WORKSPACE/se_v100.12_to_v100.13.patch"
      - name: Verify requested changes
        working-directory: source
        run: |
          set -euo pipefail
          grep -q 'versionCode 1000013' app/build.gradle
          grep -q 'versionName "100.0.13"' app/build.gradle
          grep -q 'SEAndroid_v100.0.13' settings.gradle
          grep -q 'SCREEN_ORIENTATION_SENSOR_LANDSCAPE' app/src/main/java/com/orbital/iptv/OrbitalApp.kt
          grep -q 'GENC_MEDIA3' app/src/main/java/com/orbital/iptv/utils/PrefsManager.kt
          grep -q "media3-session:1.9.0" app/build.gradle
          test -f app/src/main/res/layout/layout_genc_player_overlay.xml
          grep -q 'genc_player_view' app/src/main/res/layout/activity_player.xml
          grep -q 'genc_player_overlay_include' app/src/main/res/layout/activity_player.xml
          grep -q 'MediaSession' app/src/main/java/com/orbital/iptv/ui/player/PlayerActivity.kt
          grep -q 'onUserLeaveHint' app/src/main/java/com/orbital/iptv/ui/player/PlayerActivity.kt
          grep -q 'onUserLeaveHint' app/src/main/java/com/orbital/iptv/ui/tv/TvModeActivity.kt
          grep -q 'android:layout_margin="6dp"' app/src/main/res/layout/item_live_channel.xml
          grep -q 'binding.miniPlayer.player = miniPlayer' app/src/main/java/com/orbital/iptv/ui/home/HomeActivity.kt
          grep -q 'rb_player_genc' app/src/main/res/layout/activity_settings.xml
          grep -q 'GencMediaPlayer' app/src/main/java/com/orbital/iptv/ui/player/PlayerActivity.kt

          if grep -R -n -E 'SCREEN_ORIENTATION_REVERSE_LANDSCAPE|SCREEN_ORIENTATION_LANDSCAPE|manual_rotate_landscape|isManualRotateEnabled|setManualRotateEnabled|switch_rotate|switchRotate' app/src/main/java app/src/main/res; then
            echo "Old manual/fixed rotation code remains"
            exit 1
          fi

          if grep -R -n 'android:screenOrientation="landscape"' app/src/main/AndroidManifest.xml; then
            echo "Landscape is still hard-coded in the Manifest"
            exit 1
          fi

          if grep -R -n 'RECENTLY ADDED' app/src/main/res/layout app/src/main/java/com/orbital/iptv/ui/vod app/src/main/java/com/orbital/iptv/ui/series; then
            echo "RECENTLY ADDED remains in Movies/Series"
            exit 1
          fi

          grep -qi 'LAST ADDED' app/src/main/java/com/orbital/iptv/ui/series/SeriesActivity.kt
          grep -q 'showingSearch' app/src/main/java/com/orbital/iptv/ui/vod/VodActivity.kt
          grep -q 'showingSearch' app/src/main/java/com/orbital/iptv/ui/series/SeriesActivity.kt
          grep -q 'SEARCH' app/src/main/java/com/orbital/iptv/ui/home/HomeActivity.kt
          grep -q 'selectAllChannels' app/src/main/java/com/orbital/iptv/ui/home/HomeViewModel.kt
          grep -q 'selectContinueChannels' app/src/main/java/com/orbital/iptv/ui/home/HomeViewModel.kt
          grep -q 'GridLayoutManager(this@HomeActivity, 2)' app/src/main/java/com/orbital/iptv/ui/home/HomeActivity.kt
          grep -q 'android:layout_gravity="top|end"' app/src/main/res/layout/layout_main_sidebar.xml

          if grep -R -n -E 'MAIN MENU|AUTO ROTATE' app/src/main/res/layout; then
            echo "Old menu labels remain"
            exit 1
          fi
          if grep -R -n -E 'etSearch|et_search|et_live_search|nav_search|btnGlobalSearch|headerTvListings|tvMovieCount|tvShowCount' app/src/main; then
            echo "Deleted UI/search bindings still referenced"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build APK
        id: build_apk
        continue-on-error: true
        working-directory: source
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build-output.log"
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit "${status}"

      - name: Upload build diagnostic log
        if: steps.build_apk.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: SEAndroid_v100.0.13-build-log
          path: build-output.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail when Gradle build fails
        if: steps.build_apk.outputs.status != '0'
        run: exit 1

      - name: Package APK and source
        id: package_artifact
        continue-on-error: true
        run: |
          set -o pipefail
          {
            set -x
            rm -rf output source-for-zip
            mkdir -p output source-for-zip
            ls -lah source/app/build/outputs/apk/debug/
            test -s source/app/build/outputs/apk/debug/app-debug.apk
            cp source/app/build/outputs/apk/debug/app-debug.apk output/SEAndroid_v100.0.13.apk
            cp -a source/. source-for-zip/
            rm -rf source-for-zip/.gradle source-for-zip/.git source-for-zip/.idea source-for-zip/app/build source-for-zip/.kotlin source-for-zip/.github
            find source-for-zip -maxdepth 2 -type f | head -80
            (cd source-for-zip && zip -r "$GITHUB_WORKSPACE/output/SEAndroid_v100.0.13.zip" .)
            ls -lah output
            file output/SEAndroid_v100.0.13.apk output/SEAndroid_v100.0.13.zip
            test -s output/SEAndroid_v100.0.13.apk
            test -s output/SEAndroid_v100.0.13.zip
          } 2>&1 | tee "$GITHUB_WORKSPACE/package-output.log"
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit "${status}"

      - name: Upload packaging diagnostic log
        if: steps.package_artifact.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: SEAndroid_v100.0.13-package-log
          path: package-output.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail when packaging fails
        if: steps.package_artifact.outputs.status != '0'
        run: exit 1

      - name: Upload APK
        id: upload_apk
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: SEAndroid_v100.0.13-apk
          path: output/SEAndroid_v100.0.13.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload source
        id: upload_source
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: SEAndroid_v100.0.13-source
          path: output/SEAndroid_v100.0.13.zip
          if-no-files-found: error
          retention-days: 30

      - name: Capture artifact IDs from GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, pathlib
          repo=os.environ["REPO"]; run_id=os.environ["RUN_ID"]
          raw=subprocess.check_output([
              "gh","api",
              f"repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100"
          ], text=True)
          data=json.loads(raw)
          wanted={"SEAndroid_v100.0.13-apk":None,"SEAndroid_v100.0.13-source":None}
          for a in data.get("artifacts",[]):
              if a.get("name") in wanted:
                  wanted[a["name"]]=a.get("id")
          if not wanted["SEAndroid_v100.0.13-apk"] or not wanted["SEAndroid_v100.0.13-source"]:
              raise SystemExit("Could not find both uploaded artifact IDs")
          out={
              "run_id":int(run_id),
              "apk_artifact_id":int(wanted["SEAndroid_v100.0.13-apk"]),
              "source_artifact_id":int(wanted["SEAndroid_v100.0.13-source"])
          }
          p=pathlib.Path(f"BUILD_ARTIFACT_OUTPUT_IDS_v100.0.13_{run_id}.json")
          p.write_text(json.dumps(out)+"\n",encoding="utf-8")
          print(json.dumps(out))
          PY

      - name: Publish artifact IDs to repository
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          FILE="BUILD_ARTIFACT_OUTPUT_IDS_v100.0.13_${RUN_ID}.json"
          CONTENT=$(base64 -w0 "$FILE")
          gh api --method PUT "repos/${REPO}/contents/${FILE}"             -f message="Record v100.0.13 artifact IDs for run ${RUN_ID}"             -f content="${CONTENT}"             -f branch=main
