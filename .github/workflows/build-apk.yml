name: SEAndroid v100.0.10 Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct v100.0.9 source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          OLD_COMMIT: d6e908f297a8fe08ca6418e89c3d7c2e9ce146f3
        run: |
          set -euo pipefail
          git show "${OLD_COMMIT}:v7_v9_source.diff.xz.p01.b64" > v9p01.b64
          git show "${OLD_COMMIT}:v7_v9_source.diff.xz.p02.b64" > v9p02.b64
          git show "${OLD_COMMIT}:v7_v9_source.diff.xz.p03.b64" > v9p03.b64
          git show "${OLD_COMMIT}:fix_search_enum.diff.b64" > fix_search_enum.diff.b64
          cat v9p01.b64 v9p02.b64 v9p03.b64 > patch.xz.b64
          base64 -d patch.xz.b64 > patch.xz
          xz -t patch.xz
          xz -dc patch.xz > patch.diff
          base64 -d fix_search_enum.diff.b64 > fix_search_enum.diff

          curl -fL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/actions/artifacts/10737831779/zip" \
            -o base-artifact.zip
          mkdir -p base-artifact source
          unzip -q base-artifact.zip -d base-artifact
          SRCZIP=$(find base-artifact -type f -name 'SEAndroid_v100.0.7.zip' -print -quit)
          test -n "${SRCZIP}"
          unzip -q "${SRCZIP}" -d source
          ROOT=$(find source -maxdepth 5 -type f -name gradlew -print -quit | xargs -r dirname)
          test -n "${ROOT}"
          mv "${ROOT}" base7work
          cd base7work
          patch -p1 --forward < "$GITHUB_WORKSPACE/patch.diff"
          patch -p1 --forward < "$GITHUB_WORKSPACE/fix_search_enum.diff"
          cd "$GITHUB_WORKSPACE"
          mv base7work source

      - name: Apply SE v100.0.10 source changes
        working-directory: source
        run: |
          set -euo pipefail
          curl -fL \
            "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/se_v9_to_v10_source.patch.xz.b64" \
            -o "$GITHUB_WORKSPACE/se_v9_to_v10_source.patch.xz.b64"
          base64 -d "$GITHUB_WORKSPACE/se_v9_to_v10_source.patch.xz.b64" > "$GITHUB_WORKSPACE/se_v9_to_v10_source.patch.xz"
          xz -t "$GITHUB_WORKSPACE/se_v9_to_v10_source.patch.xz"
          xz -dc "$GITHUB_WORKSPACE/se_v9_to_v10_source.patch.xz" > "$GITHUB_WORKSPACE/se_v9_to_v10_source.patch"
          patch -p1 --forward < "$GITHUB_WORKSPACE/se_v9_to_v10_source.patch"
          curl -fL \
            "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/fix_plex_v100.0.10.patch" \
            -o "$GITHUB_WORKSPACE/fix_plex_v100.0.10.patch"
          patch -p1 --forward < "$GITHUB_WORKSPACE/fix_plex_v100.0.10.patch"
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("app/src/main/java/com/orbital/iptv/data/plex/PlexRepository.kt")
          s = p.read_text(encoding="utf-8")
          marker = "    // ── Playback reporting"
          start = s.find("    suspend fun getChildren(")
          end = s.find(marker, start)
          if start < 0 or end < 0:
              raise SystemExit("PlexRepository getChildren/playback block not found")
          block = s[start:end]
          fixed, removed = re.subn(r"(\n    \}\n)(?:[ \t]*\}\n)+(?=\s*$)", r"\1", block)
          if removed:
              s = s[:start] + fixed + s[end:]
              p.write_text(s, encoding="utf-8")
          print(f"PlexRepository extra-brace groups removed: {removed}")
          check = p.read_text(encoding="utf-8")
          start = check.find("    suspend fun getChildren(")
          end = check.find(marker, start)
          between = check[start:end]
          if re.search(r"\n    \}\n(?:[ \t]*\}\n)+\s*$", between):
              raise SystemExit("PlexRepository still has extra top-level braces")
          PY
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          # Remove the old title bars directly under the main sidebar.
          header_specs = [
              (
                  "app/src/main/res/layout/activity_vod.xml",
                  '<LinearLayout android:layout_width="match_parent" android:layout_height="46dp" android:orientation="horizontal" android:gravity="center_vertical" android:background="@color/se_panel_alt"><TextView android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1" android:gravity="start|center_vertical" android:paddingStart="12dp" android:text="MOVIES" android:textColor="@color/sky_white" android:textSize="13sp" android:textStyle="bold"/><TextView android:id="@+id/tv_movie_count" android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginEnd="8dp" android:text="0 TITLES" android:textColor="@color/sky_cyan" android:textSize="9sp" android:textStyle="bold"/></LinearLayout>'
              ),
              (
                  "app/src/main/res/layout/activity_series.xml",
                  '<LinearLayout android:layout_width="match_parent" android:layout_height="46dp" android:orientation="horizontal" android:gravity="center_vertical" android:background="@color/se_panel_alt"><TextView android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1" android:gravity="start|center_vertical" android:paddingStart="12dp" android:text="SERIES" android:textColor="@color/sky_white" android:textSize="13sp" android:textStyle="bold"/><TextView android:id="@+id/tv_show_count" android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginEnd="8dp" android:text="0 SHOWS" android:textColor="@color/sky_cyan" android:textSize="9sp" android:textStyle="bold"/></LinearLayout>'
              ),
              (
                  "app/src/main/res/layout/activity_home.xml",
                  '<LinearLayout android:layout_width="match_parent" android:layout_height="46dp" android:orientation="horizontal" android:gravity="center_vertical" android:background="@color/se_panel_alt"><TextView android:id="@+id/header_tv_listings" android:layout_width="match_parent" android:layout_height="match_parent" android:gravity="start|center_vertical" android:paddingStart="12dp" android:text="LIVE TV" android:textColor="@color/sky_white" android:textSize="13sp" android:textStyle="bold" android:focusable="true" android:clickable="true" android:nextFocusRight="@id/rv_live_channels" /></LinearLayout>'
              ),
          ]
          for filename, old in header_specs:
              p = Path(filename)
              s = p.read_text(encoding="utf-8")
              if old in s:
                  s = s.replace(old, "", 1)
                  p.write_text(s, encoding="utf-8")
                  print(f"Removed title bar from {filename}")
              else:
                  print(f"Title bar already absent in {filename}")
              check = p.read_text(encoding="utf-8")
              label = {"activity_vod.xml":"MOVIES", "activity_series.xml":"SERIES", "activity_home.xml":"LIVE TV"}[Path(filename).name]
              if f'android:text="{label}"' in check:
                  raise SystemExit(f"Old title label still present in {filename}")
          rec = Path("app/src/main/java/com/orbital/iptv/recording/RecordingsActivity.kt")
          rs = rec.read_text(encoding="utf-8")
          required = [
              "import java.text.SimpleDateFormat",
              "import java.util.Date",
              "import java.util.Locale",
          ]
          anchor = "import java.io.File"
          for imp in required:
              if imp not in rs:
                  rs = rs.replace(anchor, anchor + "\n" + imp, 1)
                  anchor = imp
          rec.write_text(rs, encoding="utf-8")

          ser = Path("app/src/main/java/com/orbital/iptv/ui/series/SeriesActivity.kt")
          ss = ser.read_text(encoding="utf-8")
          if "private fun buildCategoryMenu(" not in ss:
              marker = "    private fun recentSortKey("
              fn = dedent(r'''
                  private fun buildCategoryMenu(categories: List<SeriesCategory>, selected: SeriesCategory?) {
                      val container = binding.catContainer
                      container.removeAllViews()
                      val p = ThemeManager.palette()
                      val density = resources.displayMetrics.density
                      val rowH = (46 * density).toInt()
                      val pad = (16 * density).toInt()
                      val marginPx = (p.itemMarginDp * density).toInt()
                      val allFavs = FavouritesManager.getAll(this)
                      val favItems = allFavs.filter {
                          it.type == FavType.SERIES ||
                              (it.type == FavType.EPISODE && !it.hasResume && !it.isUpNext && it.seriesId >= 0)
                      }
                      val continueItems = allFavs.filter {
                          it.type == FavType.EPISODE && (it.hasResume || it.isUpNext)
                      }

                      fun addRow(label: String, selectedRow: Boolean, onClick: () -> Unit) {
                          val tv = TextView(this).apply {
                              val lp = LinearLayout.LayoutParams(
                                  LinearLayout.LayoutParams.MATCH_PARENT, rowH
                              )
                              if (marginPx > 0) lp.setMargins(marginPx, marginPx / 2, marginPx, marginPx / 2)
                              layoutParams = lp
                              gravity = Gravity.CENTER_VERTICAL
                              setPadding(pad, 0, 0, 0)
                              text = label
                              textSize = 13f
                              typeface = Typeface.create("sans-serif-condensed", Typeface.NORMAL)
                              isClickable = true
                              isFocusable = true
                              background = ThemeManager.roundedBg(
                                  if (selectedRow) p.highlight else p.bgMid, density
                              )
                              setTextColor(
                                  if (selectedRow) 0xFF000000.toInt() else 0xFFFFFFFF.toInt()
                              )
                              setOnFocusChangeListener { v, hasFocus ->
                                  if (!selectedRow) {
                                      v.background = ThemeManager.focusRowDrawable(density, p.bgMid, hasFocus)
                                  }
                              }
                              setOnClickListener { onClick() }
                          }
                          container.addView(tv)
                      }

                      addRow("RECENTLY ADDED", showingRecentlyAdded) {
                          showingRecentlyAdded = true
                          showingFavourites = false
                          showingContinue = false
                          val sorted = allShows.sortedByDescending {
                              recentSortKey(it.added ?: it.lastModified)
                          }
                          adapter.submitList(sorted)
                          binding.tvShowCount.text = "${sorted.size} SHOWS"
                          buildCategoryMenu(categories, selected)
                      }

                      if (favItems.isNotEmpty()) {
                          addRow("★ FAVOURITES", showingFavourites) {
                              showingRecentlyAdded = false
                              showingContinue = false
                              showingFavourites = true
                              showFavouritesSeries()
                              buildCategoryMenu(categories, selected)
                          }
                      }

                      if (continueItems.isNotEmpty()) {
                          addRow("▶ CONTINUE WATCHING", showingContinue) {
                              showingRecentlyAdded = false
                              showingFavourites = false
                              showingContinue = true
                              showContinueWatching()
                              buildCategoryMenu(categories, selected)
                          }
                      }

                      val offset = 1 +
                          if (favItems.isNotEmpty()) 1 else 0 +
                          if (continueItems.isNotEmpty()) 1 else 0
                      categories
                          .filter { !it.categoryName.equals("SERIES", ignoreCase = true) }
                          .forEachIndexed { index, cat ->
                              val isSelected =
                                  !showingContinue && !showingFavourites && !showingRecentlyAdded &&
                                      cat.categoryId == selected?.categoryId
                              val normalBg = if ((index + offset) % 2 == 0) p.bgMid else p.bgPrimary
                              val profile = PrefsManager.getActiveProfile(this@SeriesActivity)
                              val favNow = profile?.let {
                                  FavouritesManager.containsCategory(
                                      this@SeriesActivity, "SERIES", it.serverUrl, cat.categoryId
                                  )
                              } == true
                              val label = cat.categoryName + if (favNow) "   ♥" else "   ♡"
                              addRow(label, isSelected) {
                                  showingContinue = false
                                  showingFavourites = false
                                  showingRecentlyAdded = false
                                  viewModel.selectCategory(cat)
                              }
                              container.getChildAt(container.childCount - 1)?.background =
                                  if (isSelected) ThemeManager.roundedBg(p.highlight, density)
                                  else ThemeManager.roundedBg(normalBg, density)
                          }
                  }

              ''')
              if marker not in ss:
                  raise SystemExit("SeriesActivity recentSortKey marker not found")
              ss = ss.replace(marker, fn + marker, 1)
              ser.write_text(ss, encoding="utf-8")
          PY
          sed -n '330,350p' app/src/main/java/com/orbital/iptv/data/plex/PlexRepository.kt
          grep -q 'versionName "100.0.10"' app/build.gradle
          grep -q 'versionCode 1000010' app/build.gradle
          test ! -e app/src/main/java/com/orbital/iptv/ui/search/GlobalSearchActivity.kt
          test ! -e app/src/main/res/layout/activity_global_search.xml
          test ! -e app/src/main/res/layout/item_global_search.xml
          if grep -R -n -E 'etSearch|et_search|et_live_search|nav_search|btnGlobalSearch' app/src/main; then
            echo "Search UI references remain"
            exit 1
          fi
          if grep -R -n 'AUTO ROTATE' app/src/main/res/layout; then
            echo "Old AUTO ROTATE label remains"
            exit 1
          fi
          if grep -R -n 'MAIN MENU' app/src/main/res/layout; then
            echo "Old MAIN MENU label remains"
            exit 1
          fi
          grep -R -n 'SCREEN_ORIENTATION_REVERSE_LANDSCAPE' app/src/main/java/com/orbital/iptv/OrbitalApp.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build APK
        working-directory: source
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Package APK and source
        run: |
          set -euo pipefail
          rm -rf output source-for-zip
          mkdir -p output source-for-zip
          cp -a source/. source-for-zip/
          rm -rf source-for-zip/.gradle source-for-zip/.git source-for-zip/.idea source-for-zip/app/build source-for-zip/.kotlin source-for-zip/.github
          cp source/app/build/outputs/apk/debug/app-debug.apk output/SEAndroid_v100.0.10.apk
          cd source-for-zip
          zip -qr "$GITHUB_WORKSPACE/output/SEAndroid_v100.0.10.zip" .
          cd "$GITHUB_WORKSPACE"
          test -s output/SEAndroid_v100.0.10.apk
          test -s output/SEAndroid_v100.0.10.zip

      - name: Upload APK and source
        uses: actions/upload-artifact@v4
        with:
          name: SEAndroid_v100.0.10
          path: |
            output/SEAndroid_v100.0.10.apk
            output/SEAndroid_v100.0.10.zip
          if-no-files-found: error
          retention-days: 30
