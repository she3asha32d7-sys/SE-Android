name: Build SE IPTV PLAYER V10.1.0
run-name: Build SE IPTV PLAYER V10.1.0

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - SE-v10.1.0-source.zip

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e
          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager -perm -111 | head -n 1 || true)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Restore final modified SE source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          rm -rf _artifact _source SE-Android-v10.1.0
          mkdir -p _artifact _source

          if [ -f SE-v10.1.0-source.zip ]; then
            echo "Using repository source ZIP."
            cp SE-v10.1.0-source.zip _source/source.zip
          else
            echo "Repository source ZIP is not yet finalized; downloading the verified modified source artifact from Run 26."
            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${{ github.repository }}/actions/artifacts/10645184991/zip" > _artifact/artifact.zip
            unzip -q _artifact/artifact.zip -d _artifact/unpacked
            find _artifact/unpacked -type f -name '*.zip' -print -quit > _artifact/nested_zip_path.txt
            NESTED="$(cat _artifact/nested_zip_path.txt)"
            test -n "$NESTED"
            cp "$NESTED" _source/source.zip
          fi

          unzip -q _source/source.zip -d _source/project

          PROJECT_ROOT="$(find _source/project -maxdepth 5 -type f -name gradlew -print -quit | xargs -r dirname)"
          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERROR: gradlew was not found in the source ZIP"
            find _source/project -maxdepth 5 -type f -name gradlew -print || true
            exit 1
          fi

          if [ ! -f "$PROJECT_ROOT/settings.gradle" ] && [ ! -f "$PROJECT_ROOT/settings.gradle.kts" ]; then
            echo "ERROR: invalid Gradle project"
            exit 1
          fi

          mv "$PROJECT_ROOT" SE-Android-v10.1.0
          test -f SE-Android-v10.1.0/gradlew
          test -f SE-Android-v10.1.0/settings.gradle || test -f SE-Android-v10.1.0/settings.gradle.kts

          echo "=== Restored SE V10.1.0 source ==="
          grep -RIn --include='*.gradle' --include='*.kts' 'applicationId' SE-Android-v10.1.0/app | head -n 3 || true

      - name: Fix Cast Kotlin compatibility
        working-directory: SE-Android-v10.1.0
        shell: bash
        run: |
          set -e
          while IFS= read -r -d '' f; do
            sed -i 's/22\.1\.0/22.0.0/g' "$f"
          done < <(grep -RIlz --exclude-dir=.gradle --exclude-dir=build 'play-services-cast-framework' . || true)

          cat > cast-compat.init.gradle <<'EOF'
          allprojects {
              configurations.configureEach {
                  resolutionStrategy.eachDependency { details ->
                      if (details.requested.group == "com.google.android.gms" &&
                          (details.requested.name == "play-services-cast-framework" ||
                           details.requested.name == "play-services-cast") &&
                          details.requested.version == "22.1.0") {
                          details.useVersion("22.0.0")
                          details.because("Kotlin 1.9.x compatibility")
                      }
                  }
              }
              plugins.withId("org.jetbrains.kotlin.android") {
                  tasks.configureEach { task ->
                      if (task.hasProperty("kotlinOptions")) {
                          task.kotlinOptions.freeCompilerArgs += "-Xskip-metadata-version-check"
                      }
                  }
              }
          }
          EOF

      - name: Repair Activity imports
        working-directory: SE-Android-v10.1.0
        shell: bash
        run: |
          set -e
          SERIES="app/src/main/java/com/orbital/iptv/ui/series/SeriesActivity.kt"
          VOD="app/src/main/java/com/orbital/iptv/ui/vod/VodActivity.kt"
          test -f "$SERIES"
          test -f "$VOD"
          grep -q 'import com.orbital.iptv.ui.vod.VodActivity' "$SERIES" || sed -i '/^import android.content.Intent$/a import com.orbital.iptv.ui.vod.VodActivity' "$SERIES"
          grep -q 'import com.orbital.iptv.ui.series.SeriesActivity' "$VOD" || sed -i '/^import android.content.Intent$/a import com.orbital.iptv.ui.series.SeriesActivity' "$VOD"

      - name: Repair HomeActivity constant
        working-directory: SE-Android-v10.1.0
        shell: bash
        run: |
          set -e
          HOME_ACTIVITY="app/src/main/java/com/orbital/iptv/ui/home/HomeActivity.kt"
          if ! grep -q 'const val EXTRA_OPEN_SETTINGS' "$HOME_ACTIVITY"; then
            sed -i '/^class HomeActivity[^\{]*{/a\
    companion object {
        const val EXTRA_OPEN_SETTINGS = "open_settings"
    }
' "$HOME_ACTIVITY"
          fi

      - name: Verify Java and Gradle
        working-directory: SE-Android-v10.1.0
        shell: bash
        run: |
          set -e
          java -version
          ./gradlew --version

      - name: Build Release APK
        working-directory: SE-Android-v10.1.0
        shell: bash
        run: |
          set -e
          chmod +x gradlew
          ./gradlew -I cast-compat.init.gradle clean assembleRelease --stacktrace --no-daemon

      - name: Package final source ZIP
        shell: bash
        run: |
          set -e
          rm -rf /tmp/se-final-source
          mkdir -p /tmp/se-final-source
          zip -qr /tmp/se-final-source/SE-v10.1.0-source.zip SE-Android-v10.1.0 \
            -x 'SE-Android-v10.1.0/.gradle/*' \
               'SE-Android-v10.1.0/**/build/*' \
               'SE-Android-v10.1.0/.idea/*' \
               'SE-Android-v10.1.0/signing/*'
          cp /tmp/se-final-source/SE-v10.1.0-source.zip ./SE-v10.1.0-source.zip
          ls -lh ./SE-v10.1.0-source.zip

      - name: Commit finalized source ZIP
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SE-v10.1.0-source.zip
          git diff --cached --quiet && exit 0
          git commit -m "Finalize SE V10.1.0 source ZIP"
          git push

      - name: Sign APK
        shell: bash
        run: |
          set -e
          APK="$(find SE-Android-v10.1.0/app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          test -n "$APK"

          mkdir -p signing output
          keytool -genkeypair \
            -keystore signing/se-release.keystore \
            -storepass changeit \
            -keypass changeit \
            -alias se-release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=SE IPTV PLAYER, OU=SE, O=SE, L=Unknown, ST=Unknown, C=EG" \
            -noprompt

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -perm -111 | sort -V | tail -n 1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign -perm -111 | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          test -n "$ZIPALIGN"

          "$ZIPALIGN" -f -p 4 "$APK" output/SE-v10.1.0-aligned.apk
          "$APKSIGNER" sign \
            --ks signing/se-release.keystore \
            --ks-pass pass:changeit \
            --key-pass pass:changeit \
            --ks-key-alias se-release \
            --out output/SE-v10.1.0-universal-release-signed.apk \
            output/SE-v10.1.0-aligned.apk

          rm -f output/SE-v10.1.0-aligned.apk
          "$APKSIGNER" verify --verbose output/SE-v10.1.0-universal-release-signed.apk
          ls -lh output/SE-v10.1.0-universal-release-signed.apk

      - name: Upload final Source Code
        uses: actions/upload-artifact@v4
        with:
          name: SE-v10.1.0-SOURCE
          path: SE-v10.1.0-source.zip
          retention-days: 30

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: SE-v10.1.0-APK
          path: output/SE-v10.1.0-universal-release-signed.apk
          retention-days: 30
