name: SEAndroid v100.0.10 Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct v100.0.9 source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          OLD_COMMIT: d6e908f297a8fe08ca6418e89c3d7c2e9ce146f3
        run: |
          set -euo pipefail
          git show "${OLD_COMMIT}:v7_v9_source.diff.xz.p01.b64" > v9p01.b64
          git show "${OLD_COMMIT}:v7_v9_source.diff.xz.p02.b64" > v9p02.b64
          git show "${OLD_COMMIT}:v7_v9_source.diff.xz.p03.b64" > v9p03.b64
          git show "${OLD_COMMIT}:fix_search_enum.diff.b64" > fix_search_enum.diff.b64
          cat v9p01.b64 v9p02.b64 v9p03.b64 > patch.xz.b64
          base64 -d patch.xz.b64 > patch.xz
          xz -t patch.xz
          xz -dc patch.xz > patch.diff
          base64 -d fix_search_enum.diff.b64 > fix_search_enum.diff

          curl -fL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/actions/artifacts/10737831779/zip" \
            -o base-artifact.zip
          mkdir -p base-artifact source
          unzip -q base-artifact.zip -d base-artifact
          SRCZIP=$(find base-artifact -type f -name 'SEAndroid_v100.0.7.zip' -print -quit)
          test -n "${SRCZIP}"
          unzip -q "${SRCZIP}" -d source
          ROOT=$(find source -maxdepth 5 -type f -name gradlew -print -quit | xargs -r dirname)
          test -n "${ROOT}"
          mv "${ROOT}" base7work
          cd base7work
          patch -p1 --forward < "$GITHUB_WORKSPACE/patch.diff"
          patch -p1 --forward < "$GITHUB_WORKSPACE/fix_search_enum.diff"
          cd "$GITHUB_WORKSPACE"
          mv base7work source

      - name: Apply SE v100.0.10 source changes
        working-directory: source
        run: |
          set -euo pipefail
          curl -fL \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/contents/se_v9_to_v10_source.patch.xz.b64?ref=${{ github.sha }}" \
            -o "$GITHUB_WORKSPACE/se_v9_to_v10_source.patch.xz.b64"
          base64 -d "$GITHUB_WORKSPACE/se_v9_to_v10_source.patch.xz.b64" > "$GITHUB_WORKSPACE/se_v9_to_v10_source.patch.xz"
          xz -t "$GITHUB_WORKSPACE/se_v9_to_v10_source.patch.xz"
          xz -dc "$GITHUB_WORKSPACE/se_v9_to_v10_source.patch.xz" > "$GITHUB_WORKSPACE/se_v9_to_v10_source.patch"
          patch -p1 --forward < "$GITHUB_WORKSPACE/se_v9_to_v10_source.patch"
          grep -q 'versionName "100.0.10"' app/build.gradle
          grep -q 'versionCode 1000010' app/build.gradle
          test ! -e app/src/main/java/com/orbital/iptv/ui/search/GlobalSearchActivity.kt
          test ! -e app/src/main/res/layout/activity_global_search.xml
          test ! -e app/src/main/res/layout/item_global_search.xml
          ! grep -R -n -E 'etSearch|et_search|et_live_search|nav_search|btnGlobalSearch' app/src/main || true
          ! grep -R -n 'AUTO ROTATE' app/src/main/res/layout || true
          ! grep -R -n 'MAIN MENU' app/src/main/res/layout || true
          grep -R -n 'SCREEN_ORIENTATION_REVERSE_LANDSCAPE' app/src/main/java/com/orbital/iptv/OrbitalApp.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build APK
        working-directory: source
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Package APK and source
        run: |
          set -euo pipefail
          rm -rf output source-for-zip
          mkdir -p output source-for-zip
          cp -a source/. source-for-zip/
          rm -rf source-for-zip/.gradle source-for-zip/.git source-for-zip/.idea source-for-zip/app/build source-for-zip/.kotlin source-for-zip/.github
          cp source/app/build/outputs/apk/debug/app-debug.apk output/SEAndroid_v100.0.10.apk
          cd source-for-zip
          zip -qr "$GITHUB_WORKSPACE/output/SEAndroid_v100.0.10.zip" .
          cd "$GITHUB_WORKSPACE"
          test -s output/SEAndroid_v100.0.10.apk
          test -s output/SEAndroid_v100.0.10.zip

      - name: Upload APK and source
        uses: actions/upload-artifact@v4
        with:
          name: SEAndroid_v100.0.10
          path: |
            output/SEAndroid_v100.0.10.apk
            output/SEAndroid_v100.0.10.zip
          if-no-files-found: error
          retention-days: 30
