name: SEAndroid v100.0.11 Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct v100.0.9 source
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OLD_COMMIT: d6e908f297a8fe08ca6418e89c3d7c2e9ce146f3
        run: |
          set -euo pipefail
          git show "${OLD_COMMIT}:v7_v9_source.diff.xz.p01.b64" > v9p01.b64
          git show "${OLD_COMMIT}:v7_v9_source.diff.xz.p02.b64" > v9p02.b64
          git show "${OLD_COMMIT}:v7_v9_source.diff.xz.p03.b64" > v9p03.b64
          git show "${OLD_COMMIT}:fix_search_enum.diff.b64" > fix_search_enum.diff.b64
          cat v9p01.b64 v9p02.b64 v9p03.b64 > patch.xz.b64
          base64 -d patch.xz.b64 > patch.xz
          xz -t patch.xz
          xz -dc patch.xz > patch.diff
          base64 -d fix_search_enum.diff.b64 > fix_search_enum.diff

          curl -fL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/actions/artifacts/10737831779/zip" \
            -o base-artifact.zip
          mkdir -p base-artifact source
          unzip -q base-artifact.zip -d base-artifact
          SRCZIP=$(find base-artifact -type f -name 'SEAndroid_v100.0.7.zip' -print -quit)
          test -n "${SRCZIP}"
          unzip -q "${SRCZIP}" -d source
          ROOT=$(find source -maxdepth 5 -type f -name gradlew -print -quit | xargs -r dirname)
          test -n "${ROOT}"
          mv "${ROOT}" base7work
          cd base7work
          patch -p1 --forward < "$GITHUB_WORKSPACE/patch.diff"
          patch -p1 --forward < "$GITHUB_WORKSPACE/fix_search_enum.diff"
          cd "$GITHUB_WORKSPACE"
          mv base7work source

      - name: Apply v100.0.10 source patches
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail

          curl -fL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.raw" \
            "https://raw.githubusercontent.com/${REPO}/${COMMIT}/se_v9_to_v10_source.patch.xz.b64" \
            -o "$GITHUB_WORKSPACE/se_v9_to_v10_source.patch.xz.b64"
          base64 -d "$GITHUB_WORKSPACE/se_v9_to_v10_source.patch.xz.b64" > "$GITHUB_WORKSPACE/se_v9_to_v10_source.patch.xz"
          xz -t "$GITHUB_WORKSPACE/se_v9_to_v10_source.patch.xz"
          xz -dc "$GITHUB_WORKSPACE/se_v9_to_v10_source.patch.xz" > "$GITHUB_WORKSPACE/se_v9_to_v10_source.patch"
          patch -p1 --forward < "$GITHUB_WORKSPACE/se_v9_to_v10_source.patch"

          curl -fL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.raw" \
            "https://raw.githubusercontent.com/${REPO}/${COMMIT}/fix_plex_v100.0.10.patch" \
            -o "$GITHUB_WORKSPACE/fix_plex_v100.0.10.patch"
          patch -p1 --forward < "$GITHUB_WORKSPACE/fix_plex_v100.0.10.patch"

      - name: Remove deleted UI remnants
        working-directory: source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          header_specs = [
              ("app/src/main/res/layout/activity_vod.xml", "MOVIES"),
              ("app/src/main/res/layout/activity_series.xml", "SERIES"),
              ("app/src/main/res/layout/activity_home.xml", "LIVE TV"),
          ]
          for filename, label in header_specs:
              p = Path(filename)
              s = p.read_text(encoding="utf-8")
              pattern = re.compile(
                  r'\s*<LinearLayout\b[^>]*android:layout_height="46dp"[^>]*>.*?'
                  r'android:text="' + re.escape(label) + r'".*?</LinearLayout>',
                  re.S
              )
              s, removed = pattern.subn("", s, count=1)
              if removed != 1:
                  raise SystemExit(f"Could not remove {label} title bar from {filename}")
              s = s.replace(' android:nextFocusLeft="@id/header_tv_listings"', "")
              if f'android:text="{label}"' in s:
                  raise SystemExit(f"{label} title bar still present in {filename}")
              p.write_text(s, encoding="utf-8")

          home = Path("app/src/main/java/com/orbital/iptv/ui/home/HomeActivity.kt")
          hs = home.read_text(encoding="utf-8")
          hs = re.sub(
              r'\n\s*binding\.headerTvListings\.setOnClickListener\s*\{.*?\n\s*binding\.headerTvListings\.text\s*=\s*"LIVE TV"\s*\n',
              '\n',
              hs,
              flags=re.S
          )
          hs = re.sub(r'^\s*binding\.headerTvListings\.(?:setBackgroundColor|setTextColor).*\n', '', hs, flags=re.M)
          if "headerTvListings" in hs:
              raise SystemExit("headerTvListings reference remains")
          home.write_text(hs, encoding="utf-8")

          for filename, field in [
              ("app/src/main/java/com/orbital/iptv/ui/vod/VodActivity.kt", "tvMovieCount"),
              ("app/src/main/java/com/orbital/iptv/ui/series/SeriesActivity.kt", "tvShowCount"),
          ]:
              p = Path(filename)
              s = p.read_text(encoding="utf-8")
              s = re.sub(r'\s*binding\.' + re.escape(field) + r'\.text\s*=\s*[^;\n]*(?:;|(?=\n)|$)', '', s)
              s = re.sub(r'\s*binding\.' + re.escape(field) + r'\.text\s*=\s*\$\{[^}]*\}\s*(?:TITLES|SHOWS)\s*', '', s)
              if f"binding.{field}" in s:
                  raise SystemExit(f"{field} binding reference remains")
              p.write_text(s, encoding="utf-8")

          for path in [
              "app/src/main/java/com/orbital/iptv/ui/search/GlobalSearchActivity.kt",
              "app/src/main/res/layout/activity_global_search.xml",
              "app/src/main/res/layout/item_global_search.xml",
          ]:
              Path(path).unlink(missing_ok=True)
          PY

      - name: Apply v100.0.11 changes
        working-directory: source
        run: |
          set -euo pipefail
          base64 -d "$GITHUB_WORKSPACE/se_v100.10_to_v100.11.patch.xz.b64" > "$GITHUB_WORKSPACE/se_v100.10_to_v100.11.patch.xz"
          xz -t "$GITHUB_WORKSPACE/se_v100.10_to_v100.11.patch.xz"
          xz -dc "$GITHUB_WORKSPACE/se_v100.10_to_v100.11.patch.xz" > "$GITHUB_WORKSPACE/se_v100.10_to_v100.11.patch"
          patch -p1 --forward < "$GITHUB_WORKSPACE/se_v100.10_to_v100.11.patch"

      - name: Verify requested changes
        working-directory: source
        run: |
          set -euo pipefail
          grep -q 'versionCode 1000011' app/build.gradle
          grep -q 'versionName "100.0.11"' app/build.gradle
          grep -q 'SEAndroid_v100.0.11' settings.gradle
          grep -q 'SCREEN_ORIENTATION_REVERSE_LANDSCAPE' app/src/main/java/com/orbital/iptv/OrbitalApp.kt

          if grep -R -n 'android:screenOrientation="landscape"' app/src/main/AndroidManifest.xml; then
            echo "Landscape is still hard-coded in the Manifest"
            exit 1
          fi

          if grep -R -n 'RECENTLY ADDED' app/src/main/res/layout app/src/main/java/com/orbital/iptv/ui/vod app/src/main/java/com/orbital/iptv/ui/series; then
            echo "RECENTLY ADDED remains in Movies/Series"
            exit 1
          fi

          grep -q 'Last Added' app/src/main/java/com/orbital/iptv/ui/series/SeriesActivity.kt
          grep -q 'showingSearch' app/src/main/java/com/orbital/iptv/ui/vod/VodActivity.kt
          grep -q 'showingSearch' app/src/main/java/com/orbital/iptv/ui/series/SeriesActivity.kt
          grep -q 'SEARCH' app/src/main/java/com/orbital/iptv/ui/home/HomeActivity.kt
          grep -q 'selectAllChannels' app/src/main/java/com/orbital/iptv/ui/home/HomeViewModel.kt
          grep -q 'selectContinueChannels' app/src/main/java/com/orbital/iptv/ui/home/HomeViewModel.kt
          grep -q 'spanCount = 2' app/src/main/java/com/orbital/iptv/ui/home/HomeActivity.kt
          grep -q 'android:layout_gravity="top|end"' app/src/main/res/layout/layout_main_sidebar.xml

          if grep -R -n -E 'MAIN MENU|AUTO ROTATE' app/src/main/res/layout; then
            echo "Old menu labels remain"
            exit 1
          fi
          if grep -R -n -E 'etSearch|et_search|et_live_search|nav_search|btnGlobalSearch|headerTvListings|tvMovieCount|tvShowCount' app/src/main; then
            echo "Deleted UI/search bindings still referenced"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build APK
        working-directory: source
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Package APK and source
        run: |
          set -euo pipefail
          rm -rf output source-for-zip
          mkdir -p output source-for-zip
          cp source/app/build/outputs/apk/debug/app-debug.apk output/SEAndroid_v100.0.11.apk
          cp -a source/. source-for-zip/
          rm -rf source-for-zip/.gradle source-for-zip/.git source-for-zip/.idea source-for-zip/app/build source-for-zip/.kotlin source-for-zip/.github
          cd source-for-zip
          zip -qr "$GITHUB_WORKSPACE/output/SEAndroid_v100.0.11.zip" .
          cd "$GITHUB_WORKSPACE"
          unzip -t output/SEAndroid_v100.0.11.apk >/dev/null
          unzip -t output/SEAndroid_v100.0.11.zip >/dev/null
          test -s output/SEAndroid_v100.0.11.apk
          test -s output/SEAndroid_v100.0.11.zip

      - name: Upload APK and source
        uses: actions/upload-artifact@v4
        with:
          name: SEAndroid_v100.0.11
          path: |
            output/SEAndroid_v100.0.11.apk
            output/SEAndroid_v100.0.11.zip
          if-no-files-found: error
          retention-days: 30
