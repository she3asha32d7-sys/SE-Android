name: Final SEAndroid v100.0.24 Build
# Build V100.0.24 from the exact verified V100.0.23 source artifact.

on:
  push:
    branches:
      - v100.0.24
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Restore exact V100.0.23 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p /tmp/v23 /tmp/base
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10899928546/zip" -o /tmp/v23.zip
          unzip -q /tmp/v23.zip -d /tmp/v23
          SRC=$(find /tmp/v23 -type f -name 'SEAndroid_v100.0.23-source.zip' | head -1)
          test -n "$SRC"
          unzip -q "$SRC" -d /tmp/base
          rsync -a /tmp/base/ ./
          chmod +x gradlew
          test -f app/src/main/java/com/orbital/iptv/utils/SEKeyboardController.kt

      - name: Apply SE Keyboard v24
        run: python3 scripts/apply_keyboard_v24.py

      - name: Prepare 24
        run: |
          set -e
          perl -0pi -e 's/versionCode\s+\d+/versionCode 1000024/' app/build.gradle
          perl -0pi -e 's/versionName\s+"[^"]+"/versionName "100.0.24"/' app/build.gradle
          printf '%s\n' 'rootProject.name = "SEAndroid_v100.0.24"' "include ':app'" > settings.gradle
          sed -E -i 's/V100\.0\.[0-9]+/V100.0.24/g' app/src/main/res/layout/activity_settings.xml 2>/dev/null || true
          rm -f app/src/main/res/drawable/se_logo_full.png app/src/main/res/drawable/se_launcher.png app/src/main/res/drawable/se_launcher_foreground.xml
          cp build_payload/app_logo.webp app/src/main/res/drawable/app_logo.webp
          cp build_payload/xtream_logo.webp app/src/main/res/drawable/xtream_logo.webp

          grep -q 'enum class ShiftMode' app/src/main/java/com/orbital/iptv/utils/SEKeyboardController.kt
          grep -q 'ONE_SHOT' app/src/main/java/com/orbital/iptv/utils/SEKeyboardController.kt
          grep -q 'CAPS_LOCK' app/src/main/java/com/orbital/iptv/utils/SEKeyboardController.kt
          grep -q 'العربية' app/src/main/java/com/orbital/iptv/utils/SEKeyboardController.kt
          grep -q 'ThemePreset' app/src/main/java/com/orbital/iptv/utils/SEKeyboardController.kt
          grep -q 'showLanguageSettings' app/src/main/java/com/orbital/iptv/utils/SEKeyboardController.kt
          grep -q 'HapticFeedbackConstants.KEYBOARD_TAP' app/src/main/java/com/orbital/iptv/utils/SEKeyboardController.kt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble
        run: ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Package
        run: |
          set -e
          mkdir -p out source
          cp app/build/outputs/apk/debug/app-debug.apk out/SEAndroid_v100.0.24.apk
          rsync -a --exclude='.git' --exclude='.gradle' --exclude='.idea' --exclude='app/build' --exclude='out' --exclude='source' --exclude='build_payload' --exclude='scripts/keyboard_v24_payload_*.b64' --exclude='BUILD_V100_0_24_TRIGGER.txt' ./ source/
          (cd source && zip -qr ../out/SEAndroid_v100.0.24-source.zip .)

      - uses: actions/upload-artifact@v4
        with:
          name: SEAndroid_v100.0.24-apk
          path: out/SEAndroid_v100.0.24.apk
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: SEAndroid_v100.0.24-source
          path: out/SEAndroid_v100.0.24-source.zip
          retention-days: 30
