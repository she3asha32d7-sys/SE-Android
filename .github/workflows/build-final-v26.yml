name: Build exact V100.0.51 source

on:
  push:
    branches:
      - v100.0.26
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Download exact source artifact
        run: |
          set -e
          curl -fL 'https://sdmntpritalynorth.oaiusercontent.com/files/00000000-0048-8246-bf94-3956bf0e2a08/raw?se=2026-09-26T17%3A19%3A49Z&sp=r&sv=2026-02-06&sr=b&scid=3b22a3e1-b834-5d73-b05c-1b79e1638358&skoid=e5f84a89-964a-4fd3-92c2-c2cb3a12ea16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-26T07%3A09%3A56Z&ske=2026-09-27T07%3A09%3A56Z&sks=b&skv=2026-02-06&sig=rpbxD1PYHNbGzS4UaIUiXZIWgWzM6Ue9TSz8J3jGfGI%3D' -o /tmp/source.zip
          rm -rf src
          mkdir src
          unzip -q /tmp/source.zip -d src
          test -f src/gradlew
          chmod +x src/gradlew
          grep -q 'versionCode 1000026' src/app/build.gradle
          grep -q 'versionName "100.0.26"' src/app/build.gradle
          test ! -f src/app/src/main/java/com/orbital/iptv/utils/SEKeyboardController.kt
      - name: Assemble APK
        working-directory: src
        run: ./gradlew clean assembleDebug --no-daemon --stacktrace
      - name: Package outputs
        run: |
          set -e
          mkdir -p out source
          cp src/app/build/outputs/apk/debug/app-debug.apk out/SE-Android-V100.0.26.apk
          rsync -a --exclude='.git' --exclude='.gradle' --exclude='.idea' --exclude='app/build' --exclude='out' src/ source/
          (cd source && zip -qr ../out/SE-Android-V100.0.51-source.zip .)
          unzip -t out/SE-Android-V100.0.51-source.zip >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: SE-Android-V100.0.26-apk-final
          path: out/SE-Android-V100.0.26.apk
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: SE-Android-V100.0.51-source-final
          path: out/SE-Android-V100.0.51-source.zip
          retention-days: 7
