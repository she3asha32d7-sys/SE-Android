name: Build SE Android V100.0.141

on:
  workflow_dispatch:
  push:
    branches:
      - v100.0.140-cast-control-build

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Increment version to 100.0.141
        shell: bash
        run: |
          find . -type f \\( -name '*.gradle' -o -name '*.gradle.kts' -o -name '*.kt' -o -name '*.xml' -o -name '*.txt' -o -name 'settings.gradle' \\) -print0 |
            xargs -0 -r sed -i \\
              -e 's/100\\.0\\.140/100.0.141/g' \\
              -e 's/1000140/1000141/g'

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        shell: bash
        run: |
          APK=$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" "SE-Android-v100.0.141-debug.apk"

      - name: Package source
        shell: bash
        run: |
          rm -rf source-package
          mkdir source-package
          rsync -a --exclude='.git' --exclude='build/' --exclude='.gradle/' ./ source-package/
          cd source-package
          zip -qr "../SE-Android-v100.0.141-source.zip" .

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SE-Android-v100.0.141-debug
          path: SE-Android-v100.0.141-debug.apk
          if-no-files-found: error

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: SE-Android-v100.0.141-source
          path: SE-Android-v100.0.141-source.zip
          if-no-files-found: error
