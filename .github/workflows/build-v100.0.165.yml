name: SEAndroid V100.0.165 GitHub Build

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  contents: read
  actions: read

jobs:
  build:
    if: startsWith(github.head_ref, 'v100.0.165-build')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout pull request payload
        uses: actions/checkout@v4

      - name: Download verified V164 source artifact
        uses: actions/download-artifact@v4
        with:
          name: SEAndroid-v100.0.164-FINAL
          path: /tmp/base-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38559528156

      - name: Reconstruct V165 source from the verified V164 baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/src
          SRCZIP=$(find /tmp/base-artifact -type f -name 'SE-Android-v100.0.164-source.zip' -print -quit)
          test -n "$SRCZIP"
          unzip -q "$SRCZIP" -d /tmp/src
          ROOT=$(find /tmp/src -type f -name settings.gradle -print -quit | xargs -r dirname)
          test -n "$ROOT"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          base64 -d build_payload/v164_to_v165.patch.gz.b64 > /tmp/v164_to_v165.patch.gz
          gzip -t /tmp/v164_to_v165.patch.gz
          gzip -dc /tmp/v164_to_v165.patch.gz > /tmp/v164_to_v165.patch
          cd "$ROOT"
          patch -p1 --forward --batch < /tmp/v164_to_v165.patch
          cat > SE_BUILD_MANIFEST.txt <<'EOF'
          SE IPTV PLAYER — V100.0.165
          Base source: verified SE-Android-v100.0.164-source.zip
          Changes: active Speed Playing HUD; silent seeks and tap-to-hide player overlay; bulk series episode downloads; Continue Watching favourite state fix.
          Build outputs: SE-Android-v100.0.165-debug.apk and SE-Android-v100.0.165-source.zip
          EOF

      - name: Verify requested V165 source changes
        working-directory: ${{ env.ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode 1000165' app/build.gradle
          grep -q 'versionName "100.0.165"' app/build.gradle
          grep -q 'tv_speed_playing_hud' app/src/main/res/layout/activity_player.xml
          grep -q 'binding.tvSpeedPlayingHud' app/src/main/java/com/orbital/iptv/ui/player/PlayerActivity.kt
          grep -q 'seekSilentlyBy' app/src/main/java/com/orbital/iptv/ui/player/PlayerActivity.kt
          grep -q 'hidePlayerControlsForBackgroundTap' app/src/main/java/com/orbital/iptv/ui/player/PlayerActivity.kt
          grep -q 'allSeriesEpisodesForDownload' app/src/main/java/com/orbital/iptv/ui/series/SeriesDetailActivity.kt
          grep -q 'DownloadStore.start(this, url, title)' app/src/main/java/com/orbital/iptv/ui/series/SeriesDetailActivity.kt
          grep -q 'isManuallyFavorited' app/src/main/java/com/orbital/iptv/ui/home/HomeActivity.kt
          grep -q 'manualFavorite' app/src/main/java/com/orbital/iptv/utils/FavouritesManager.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        working-directory: ${{ env.ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Verify and package APK plus source
        working-directory: ${{ env.ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          rm -rf out source-export
          mkdir -p out source-export
          cp "$APK" out/SE-Android-v100.0.165-debug.apk
          rsync -a ./ source-export/ --exclude='.git' --exclude='.gradle' --exclude='.idea' --exclude='app/build' --exclude='out' --exclude='source-export' --exclude='build_payload' --exclude='.github'
          (cd source-export && zip -qr ../out/SE-Android-v100.0.165-source.zip .)
          unzip -t out/SE-Android-v100.0.165-source.zip >/dev/null
          sha256sum out/SE-Android-v100.0.165-debug.apk out/SE-Android-v100.0.165-source.zip
          ls -lh out/*

      - name: Upload V165 deliverables
        uses: actions/upload-artifact@v4
        with:
          name: SEAndroid-v100.0.165-FINAL
          path: |
            ${{ env.ROOT }}/out/SE-Android-v100.0.165-debug.apk
            ${{ env.ROOT }}/out/SE-Android-v100.0.165-source.zip
          if-no-files-found: error
          retention-days: 30
