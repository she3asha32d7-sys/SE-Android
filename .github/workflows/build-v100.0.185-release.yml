name: SEAndroid V100.0.185 CastLab UPnP 716 Fix Release Build

on:
  push:
    branches:
      - v100.0.185-build
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: seandroid-v185-castlab-716-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout V185 integration patch
        uses: actions/checkout@v4

      - name: Download verified V184 source artifact
        uses: actions/download-artifact@v4
        with:
          name: SEAndroid-v100.0.184-RELEASE-FINAL
          path: /tmp/base-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 40108596936

      - name: Reconstruct V185 source from V184
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/src
          SRCZIP=$(find /tmp/base-artifact -type f -name 'SE-Android-v100.0.184-source.zip' -print -quit)
          test -n "$SRCZIP"
          unzip -q "$SRCZIP" -d /tmp/src
          ROOT=$(find /tmp/src -type f -name settings.gradle -print -quit | xargs -r dirname)
          test -n "$ROOT"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          python3 "$GITHUB_WORKSPACE/.github/integrations/v185/apply_v185.py" "$ROOT"

      - name: Validate V185 CastLab route and release source
        working-directory: ${{ env.ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode 1000185' app/build.gradle
          grep -q 'versionName "100.0.185"' app/build.gradle
          grep -q 'rootProject.name = "SEAndroid_v100.0.185"' settings.gradle
          grep -q 'signingConfig signingConfigs.release' app/build.gradle
          grep -q 'SE_RELEASE_KEYSTORE_PATH' app/build.gradle
          grep -q 'debuggable false' app/build.gradle
          test -s THIRD_PARTY_NOTICES.md
          test -s THIRD_PARTY_LICENSES/VEGA-APACHE-2.0.txt
          test -s third_party_sources/CastLab/LICENSE
          test -s third_party_sources/Vega/LICENSE
          test -s third_party_sources/NekoVideo/LICENSE
          test -s third_party_sources/YAACC/LICENSE.txt
          PLAYER=app/src/main/java/com/orbital/iptv/ui/player/PlayerActivity.kt
          SERVER=app/src/main/java/com/orbital/iptv/utils/originaldlna/CastLabMediaServer.kt
          ENGINE=app/src/main/java/com/orbital/iptv/utils/originaldlna/CastLabDlnaEngine.kt
          grep -Fq 'OriginalDlnaEngine.CASTLAB -> CastLabDlnaEngine.discover(this@PlayerActivity)' "$PLAYER"
          grep -Fq 'val castUri = if (engine == OriginalDlnaEngine.CASTLAB) {' "$PLAYER"
          grep -Fq 'OriginalDlnaEngine.CASTLAB -> CastLabDlnaEngine.cast(device, castUri, channelName, isLive)' "$PLAYER"
          ! grep -Fq 'OriginalDlnaEngine.CASTLAB -> if (isLocalFile)' "$PLAYER"
          grep -Fq 'return@withContext prepareNetworkProxy(app, source, titleHint, isLive)' "$SERVER"
          grep -Fq 'CastLabMediaServer.isProxyServing(mediaUrl)' "$ENGINE"
          grep -Fq 'TdmCompatibleDlnaManager.discover(app)' "$ENGINE"
          grep -Fq 'verifyServerUrl(mediaUrl, target.length())' "$SERVER"
          test -s CASTLAB_V100_0_185_UPNP_716_FIX_AUDIT.md
          test -s RELEASE_SIGNING_CERT_SHA256.txt
          echo "V185 source and CastLab routing checks passed."

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare protected Release Keystore
        shell: bash
        env:
          SE_RELEASE_KEYSTORE_BASE64: ${{ secrets.SE_RELEASE_KEYSTORE_BASE64 }}
          SE_RELEASE_STORE_PASSWORD: ${{ secrets.SE_RELEASE_STORE_PASSWORD }}
          SE_RELEASE_KEY_ALIAS: ${{ secrets.SE_RELEASE_KEY_ALIAS }}
          SE_RELEASE_KEY_PASSWORD: ${{ secrets.SE_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SE_RELEASE_KEYSTORE_BASE64" || { echo "Missing Actions secret: SE_RELEASE_KEYSTORE_BASE64"; exit 1; }
          test -n "$SE_RELEASE_STORE_PASSWORD" || { echo "Missing Actions secret: SE_RELEASE_STORE_PASSWORD"; exit 1; }
          test -n "$SE_RELEASE_KEY_ALIAS" || { echo "Missing Actions secret: SE_RELEASE_KEY_ALIAS"; exit 1; }
          test -n "$SE_RELEASE_KEY_PASSWORD" || { echo "Missing Actions secret: SE_RELEASE_KEY_PASSWORD"; exit 1; }
          KEYFILE="$RUNNER_TEMP/se-iptv-release.jks"
          printf '%s' "$SE_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYFILE"
          chmod 600 "$KEYFILE"
          keytool -list -keystore "$KEYFILE" -storepass "$SE_RELEASE_STORE_PASSWORD" -alias "$SE_RELEASE_KEY_ALIAS" >/dev/null
          echo "SE_RELEASE_KEYSTORE_PATH=$KEYFILE" >> "$GITHUB_ENV"
          echo "Protected Release keystore loaded and alias verified."

      - name: Build signed Release APK
        working-directory: ${{ env.ROOT }}
        shell: bash
        env:
          SE_RELEASE_STORE_PASSWORD: ${{ secrets.SE_RELEASE_STORE_PASSWORD }}
          SE_RELEASE_KEY_ALIAS: ${{ secrets.SE_RELEASE_KEY_ALIAS }}
          SE_RELEASE_KEY_PASSWORD: ${{ secrets.SE_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SE_RELEASE_KEYSTORE_PATH"
          chmod +x gradlew
          ./gradlew clean assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature and release certificate fingerprint
        working-directory: ${{ env.ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER=$(find "$SDK/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)
          test -x "$APKSIGNER"
          mkdir -p out
          "$APKSIGNER" verify --verbose --print-certs "$APK" > out/apksigner-verify.txt
          ACTUAL=$(grep -Eio 'certificate SHA-256 digest:[[:space:]]*[0-9a-f:]+' out/apksigner-verify.txt | sed -E 's/.*digest:[[:space:]]*//' | tr -d ':' | tr '[:upper:]' '[:lower:]' | head -n 1 || true)
          EXPECTED=$(tr -d '[:space:]' < RELEASE_SIGNING_CERT_SHA256.txt)
          test -n "$ACTUAL"
          test "$ACTUAL" = "$EXPECTED" || { echo "Release certificate fingerprint mismatch"; exit 1; }
          unzip -t "$APK" >/dev/null
          echo "APK signature and expected certificate fingerprint verified."

      - name: Package V185 Release APK and source ZIP
        working-directory: ${{ env.ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          mkdir -p out source-export
          cp "$APK" out/SE-Android-v100.0.185-release.apk
          rsync -a ./ source-export/ \
            --exclude='.git' --exclude='.gradle' --exclude='.kotlin' --exclude='.idea' \
            --exclude='app/build' --exclude='out' --exclude='source-export' \
            --exclude='build_payload' --exclude='.github' \
            --exclude='*.jks' --exclude='*.keystore' --exclude='*.p12' --exclude='*.pfx' \
            --exclude='SE_RELEASE_KEYSTORE_BASE64.txt' --exclude='release-signing.properties'
          (cd source-export && zip -qr ../out/SE-Android-v100.0.185-source.zip .)
          unzip -t out/SE-Android-v100.0.185-source.zip >/dev/null
          sha256sum out/SE-Android-v100.0.185-release.apk out/SE-Android-v100.0.185-source.zip
          ls -lh out/*

      - name: Clean signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/se-iptv-release.jks"

      - name: Upload V185 APK and source deliverables
        uses: actions/upload-artifact@v4
        with:
          name: SEAndroid-v100.0.185-RELEASE-FINAL
          path: |
            ${{ env.ROOT }}/out/SE-Android-v100.0.185-release.apk
            ${{ env.ROOT }}/out/SE-Android-v100.0.185-source.zip
          if-no-files-found: error
          retention-days: 30
