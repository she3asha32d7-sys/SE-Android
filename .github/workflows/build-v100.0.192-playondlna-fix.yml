name: SEAndroid V100.0.192 PlayOnDlna Samsung Fix Release Build

on:
  push:
    branches:
      - v100.0.192-playondlna-fix
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: seandroid-v192-playondlna-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout V192 PlayOnDlna compatibility patch
        uses: actions/checkout@v4

      - name: Download successful V191 source artifact
        uses: actions/download-artifact@v4
        with:
          name: SEAndroid-v100.0.191-RELEASE-FINAL
          path: /tmp/base-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 40132910652

      - name: Apply V192 PlayOnDlna compatibility fixes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/src
          SRCZIP=$(find /tmp/base-artifact -type f -name 'SE-Android-v100.0.191-source.zip' -print -quit)
          test -n "$SRCZIP"
          unzip -q "$SRCZIP" -d /tmp/src
          ROOT=$(find /tmp/src -type f -name settings.gradle -print -quit | xargs -r dirname)
          test -n "$ROOT"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          python3 "$GITHUB_WORKSPACE/.github/integrations/v192/apply_v192.py" "$ROOT"

      - name: Validate PlayOnDlna Samsung compatibility and preserve other CAST options
        working-directory: ${{ env.ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode 1000192' app/build.gradle
          grep -q 'versionName "100.0.192"' app/build.gradle
          grep -q 'rootProject.name = "SEAndroid_v100.0.192"' settings.gradle
          PLAYER=app/src/main/java/com/orbital/iptv/ui/player/PlayerActivity.kt
          ENGINE=app/src/main/java/com/orbital/iptv/utils/originaldlna/playondlna/PlayOnDlnaEngine.kt
          grep -Fq '"DLNA 8 (PlayOnDlna)"' "$PLAYER"
          grep -Fq 'OriginalDlnaEngine.PLAYONDLNA -> PlayOnDlnaEngine.discover(this@PlayerActivity)' "$PLAYER"
          grep -Fq 'OriginalDlnaEngine.PLAYONDLNA -> PlayOnDlnaEngine.cast(device, castUri, channelName, isLive)' "$PLAYER"
          grep -Fq 'val castUri = if (isLocalFile || engine == OriginalDlnaEngine.CASTLAB) {' "$PLAYER"
          ! grep -Fq 'engine == OriginalDlnaEngine.PLAYONDLNA) {' "$PLAYER"
          grep -Fq 'upnp:rootdevice' "$ENGINE"
          grep -Fq 'MX: 5' "$ENGINE"
          grep -Fq 'MulticastSocket(null)' "$ENGINE"
          grep -Fq 'SetAVTransportURI' "$ENGINE"
          grep -Fq 'GetTransportInfo' "$ENGINE"
          grep -Fq 'GencMediaPlayer.swapLiveFormat(mediaUrl, "ts")' "$ENGINE"
          grep -Fq 'GencMediaPlayer.swapLiveFormat(mediaUrl, "m3u8")' "$ENGINE"
          grep -Fq 'awaitReceiverBytes' "$ENGINE"
          grep -Fq 'CastDisconnectManager.registerDlna(engine.label + " — " + device.name, device.controlUrl, device.serviceType)' "$PLAYER"
          grep -Fq '.setNegativeButton("DISCONNECT", null)' "$PLAYER"
          grep -Fq '.setPositiveButton("CANCEL", null)' "$PLAYER"
          grep -Fq 'window.decorView.layoutDirection = View.LAYOUT_DIRECTION_LTR' "$PLAYER"
          grep -Fq 'binding.btnCastBottomRoute.setOnClickListener { showCastChooser() }' "$PLAYER"
          grep -Fq 'binding.btnCastBottom.setOnClickListener { showCastChooser() }' "$PLAYER"
          grep -Fq 'b.btnGencCast.setOnClickListener { showCastChooser() }' "$PLAYER"
          grep -Fq 'DLNA 3 (CastLab)' "$PLAYER"
          grep -Fq 'DLNA 4 (Vega)' "$PLAYER"
          grep -Fq 'DLNA 5 (NekoVideo)' "$PLAYER"
          grep -Fq 'DLNA 6 (YAACC)' "$PLAYER"
          grep -Fq 'DLNA 7 (FongMi)' "$PLAYER"
          grep -q 'PlayOnDlna' THIRD_PARTY_NOTICES.md
          test -s PLAYONDlNA_CAST_V100_0_192_AUDIT.md
          test -s THIRD_PARTY_LICENSES/PLAYONDlNA-GPL-3.0.txt
          test -s RELEASE_SIGNING_CERT_SHA256.txt
          grep -q 'signingConfig signingConfigs.release' app/build.gradle
          grep -q 'SE_RELEASE_KEYSTORE_PATH' app/build.gradle
          grep -q 'debuggable false' app/build.gradle
          echo "V192 PlayOnDlna compatibility static invariants passed."

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare protected Release Keystore
        shell: bash
        env:
          SE_RELEASE_KEYSTORE_BASE64: ${{ secrets.SE_RELEASE_KEYSTORE_BASE64 }}
          SE_RELEASE_STORE_PASSWORD: ${{ secrets.SE_RELEASE_STORE_PASSWORD }}
          SE_RELEASE_KEY_ALIAS: ${{ secrets.SE_RELEASE_KEY_ALIAS }}
          SE_RELEASE_KEY_PASSWORD: ${{ secrets.SE_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SE_RELEASE_KEYSTORE_BASE64" || { echo "Missing Actions secret: SE_RELEASE_KEYSTORE_BASE64"; exit 1; }
          test -n "$SE_RELEASE_STORE_PASSWORD" || { echo "Missing Actions secret: SE_RELEASE_STORE_PASSWORD"; exit 1; }
          test -n "$SE_RELEASE_KEY_ALIAS" || { echo "Missing Actions secret: SE_RELEASE_KEY_ALIAS"; exit 1; }
          test -n "$SE_RELEASE_KEY_PASSWORD" || { echo "Missing Actions secret: SE_RELEASE_KEY_PASSWORD"; exit 1; }
          KEYFILE="$RUNNER_TEMP/se-iptv-release.jks"
          printf '%s' "$SE_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYFILE"
          chmod 600 "$KEYFILE"
          keytool -list -keystore "$KEYFILE" -storepass "$SE_RELEASE_STORE_PASSWORD" -alias "$SE_RELEASE_KEY_ALIAS" >/dev/null
          echo "SE_RELEASE_KEYSTORE_PATH=$KEYFILE" >> "$GITHUB_ENV"
          echo "Protected release keystore loaded and alias verified."

      - name: Build signed Release APK
        working-directory: ${{ env.ROOT }}
        shell: bash
        env:
          SE_RELEASE_STORE_PASSWORD: ${{ secrets.SE_RELEASE_STORE_PASSWORD }}
          SE_RELEASE_KEY_ALIAS: ${{ secrets.SE_RELEASE_KEY_ALIAS }}
          SE_RELEASE_KEY_PASSWORD: ${{ secrets.SE_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SE_RELEASE_KEYSTORE_PATH"
          chmod +x gradlew
          ./gradlew clean assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature and release certificate fingerprint
        working-directory: ${{ env.ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          SDK=$(printenv ANDROID_HOME || printenv ANDROID_SDK_ROOT || echo /usr/local/lib/android/sdk)
          APKSIGNER=$(find "$SDK/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)
          test -x "$APKSIGNER"
          mkdir -p out
          "$APKSIGNER" verify --verbose --print-certs "$APK" > out/apksigner-verify.txt
          ACTUAL=$(grep -Eio 'certificate SHA-256 digest:[[:space:]]*[0-9a-f:]+' out/apksigner-verify.txt | sed -E 's/.*digest:[[:space:]]*//' | tr -d ':' | tr '[:upper:]' '[:lower:]' | head -n 1 || true)
          EXPECTED=$(tr -d '[:space:]' < RELEASE_SIGNING_CERT_SHA256.txt)
          test -n "$ACTUAL"
          test "$ACTUAL" = "$EXPECTED" || { echo "Release certificate fingerprint mismatch"; exit 1; }
          unzip -t "$APK" >/dev/null
          echo "APK signature and expected release certificate fingerprint verified."

      - name: Package V192 APK and source ZIP
        working-directory: ${{ env.ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          mkdir -p out source-export
          cp "$APK" out/SE-Android-v100.0.192-release.apk
          rsync -a ./ source-export/ \
            --exclude='.git' --exclude='.gradle' --exclude='.kotlin' --exclude='.idea' \
            --exclude='app/build' --exclude='out' --exclude='source-export' \
            --exclude='build_payload' --exclude='.github' \
            --exclude='*.jks' --exclude='*.keystore' --exclude='*.p12' --exclude='*.pfx' \
            --exclude='SE_RELEASE_KEYSTORE_BASE64.txt' --exclude='release-signing.properties'
          (cd source-export && zip -qr ../out/SE-Android-v100.0.192-source.zip .)
          unzip -t out/SE-Android-v100.0.192-source.zip >/dev/null
          sha256sum out/SE-Android-v100.0.192-release.apk out/SE-Android-v100.0.192-source.zip
          ls -lh out/*

      - name: Clean signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/se-iptv-release.jks"

      - name: Upload V192 APK and source deliverables
        uses: actions/upload-artifact@v4
        with:
          name: SEAndroid-v100.0.192-RELEASE-FINAL
          path: |
            ${{ env.ROOT }}/out/SE-Android-v100.0.192-release.apk
            ${{ env.ROOT }}/out/SE-Android-v100.0.192-source.zip
          if-no-files-found: error
          retention-days: 30
