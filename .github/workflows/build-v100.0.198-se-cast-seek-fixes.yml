name: SEAndroid V100.0.198 SE CAST Seek Fix Release Build

on:
  push:
    branches:
      - v100.0.198-se-cast-seek-fixes
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: seandroid-v198-se-cast-seek-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout V198 seek and CAST menu fix
        uses: actions/checkout@v4

      - name: Download successful V197 source artifact
        uses: actions/download-artifact@v4
        with:
          name: SEAndroid-v100.0.197-RELEASE-FINAL
          path: /tmp/v197-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 40161648402

      - name: Apply V198 patch with checksum validation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/src
          SRCZIP=$(find /tmp/v197-artifact -type f -name 'SE-Android-v100.0.197-source.zip' -print -quit)
          test -n "$SRCZIP" || { echo "V197 source artifact not found"; find /tmp/v197-artifact -maxdepth 3 -type f; exit 1; }
          unzip -q "$SRCZIP" -d /tmp/src
          ROOT=$(find /tmp/src -type f -name settings.gradle -print -quit | xargs -r dirname)
          test -n "$ROOT" || { echo "Unable to find Android source root"; exit 1; }
          cat "$GITHUB_WORKSPACE/.github/integrations/v198/patches/"*.b64 | tr -d '\r\n' > /tmp/v198.patch.xz.b64
          EXPECTED=f05cca54ad9b8619510c8de9455ba95af4ef48ce9960bcbbccd9f4effb7f678e
          ACTUAL=$(sha256sum /tmp/v198.patch.xz.b64 | awk '{print $1}')
          test "$ACTUAL" = "$EXPECTED" || { echo "V198 patch payload checksum mismatch"; exit 1; }
          base64 --decode /tmp/v198.patch.xz.b64 | xz -dc > /tmp/v198.patch
          (cd "$ROOT" && patch -p1 --batch --forward < /tmp/v198.patch)
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Validate V198 menus, phone remote controls, range support and version
        working-directory: ${{ env.ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'versionCode 1000198' app/build.gradle
          grep -Fq 'versionName "100.0.198"' app/build.gradle
          grep -Fq 'rootProject.name = "SEAndroid_v100.0.198"' settings.gradle
          PLAYER=app/src/main/java/com/orbital/iptv/ui/player/PlayerActivity.kt
          SERVER=app/src/main/java/com/orbital/iptv/utils/SeDownloadMediaServer.kt
          MANAGER=app/src/main/java/com/orbital/iptv/utils/SeTdmDlnaManager.kt
          grep -Fq 'seekActiveSeCastTo(target)' "$PLAYER"
          grep -Fq 'SeTdmDlnaManager.seek(device, target)' "$PLAYER"
          grep -Fq 'GetPositionInfo' "$MANAGER"
          grep -Fq 'GetTransportInfo' "$MANAGER"
          grep -Fq 'REL_TIME' "$MANAGER"
          grep -Fq 'ABS_TIME' "$MANAGER"
          grep -Fq 'serveFullUpstreamRange' "$SERVER"
          grep -Fq 'serveSequentialDirectFromFullGet' "$SERVER"
          grep -Fq 'DLNA.ORG_OP=' "$SERVER"
          grep -Fq '"Accept-Ranges" to if (session.supportsRanges) "bytes" else "none"' "$SERVER"
          test -s SE_CAST_SEEK_AND_MENU_V100_0_198_AUDIT.md
          python3 - <<'PYTEST'
          from pathlib import Path
          import re
          player = Path('app/src/main/java/com/orbital/iptv/ui/player/PlayerActivity.kt').read_text()
          start = player.index('private fun showCastChooser()')
          end = player.index('private fun showOthersCastChooser', start)
          main = player[start:end]
          match = re.search(r'val castChoices = arrayOf\((.*?)\n        \)', main, re.S)
          assert match, 'Primary CAST choices not found'
          labels = re.findall(r'"([^"]+)"', match.group(1))
          expected = ['TV', 'Web Video Caster', 'SE CAST', 'CAST 1', 'CAST 2', 'OTHERS']
          assert labels == expected, (labels, expected)
          assert '3 -> showOriginalDlnaChooser(mediaUri, OriginalDlnaEngine.PLAYONDLNA)' in main
          assert '4 -> showOriginalDlnaChooser(mediaUri, OriginalDlnaEngine.FONGMI)' in main
          assert 'PLAYONDLNA("CAST 1")' in player
          assert 'FONGMI("CAST 2")' in player
          start = player.index('private fun showOthersCastChooser')
          end = player.index('private fun showOpenIptvCastChooser', start)
          others = player[start:end]
          assert '"CAST IPTV"' in others
          assert '"SE CAST (IPTV Relay)"' not in others
          assert 'dialog.getButton(AlertDialog.BUTTON_NEGATIVE)?.setOnClickListener' in others
          assert 'dialog.dismiss()\n                        showCastChooser()' in others
          assert 'seekActiveSeCastTo(target)' in player
          print('V198 menu mapping, BACK route, phone-side remote seek and media-range assertions passed.')
          PYTEST

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare protected Release Keystore
        shell: bash
        env:
          SE_RELEASE_KEYSTORE_BASE64: ${{ secrets.SE_RELEASE_KEYSTORE_BASE64 }}
          SE_RELEASE_STORE_PASSWORD: ${{ secrets.SE_RELEASE_STORE_PASSWORD }}
          SE_RELEASE_KEY_ALIAS: ${{ secrets.SE_RELEASE_KEY_ALIAS }}
          SE_RELEASE_KEY_PASSWORD: ${{ secrets.SE_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SE_RELEASE_KEYSTORE_BASE64" || { echo "Missing Actions secret: SE_RELEASE_KEYSTORE_BASE64"; exit 1; }
          test -n "$SE_RELEASE_STORE_PASSWORD" || { echo "Missing Actions secret: SE_RELEASE_STORE_PASSWORD"; exit 1; }
          test -n "$SE_RELEASE_KEY_ALIAS" || { echo "Missing Actions secret: SE_RELEASE_KEY_ALIAS"; exit 1; }
          test -n "$SE_RELEASE_KEY_PASSWORD" || { echo "Missing Actions secret: SE_RELEASE_KEY_PASSWORD"; exit 1; }
          KEYFILE="$RUNNER_TEMP/se-iptv-release.jks"
          printf '%s' "$SE_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYFILE"
          chmod 600 "$KEYFILE"
          keytool -list -keystore "$KEYFILE" -storepass "$SE_RELEASE_STORE_PASSWORD" -alias "$SE_RELEASE_KEY_ALIAS" >/dev/null
          echo "SE_RELEASE_KEYSTORE_PATH=$KEYFILE" >> "$GITHUB_ENV"
          echo "Protected release keystore loaded and alias verified."

      - name: Build signed Release APK
        working-directory: ${{ env.ROOT }}
        shell: bash
        env:
          SE_RELEASE_STORE_PASSWORD: ${{ secrets.SE_RELEASE_STORE_PASSWORD }}
          SE_RELEASE_KEY_ALIAS: ${{ secrets.SE_RELEASE_KEY_ALIAS }}
          SE_RELEASE_KEY_PASSWORD: ${{ secrets.SE_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SE_RELEASE_KEYSTORE_PATH"
          chmod +x gradlew
          ./gradlew clean assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature and release certificate fingerprint
        working-directory: ${{ env.ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          SDK=$(printenv ANDROID_HOME || printenv ANDROID_SDK_ROOT || echo /usr/local/lib/android/sdk)
          APKSIGNER=$(find "$SDK/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)
          test -x "$APKSIGNER"
          mkdir -p out
          "$APKSIGNER" verify --verbose --print-certs "$APK" > out/apksigner-verify.txt
          ACTUAL=$(grep -Eio 'certificate SHA-256 digest:[[:space:]]*[0-9a-f:]+' out/apksigner-verify.txt | sed -E 's/.*digest:[[:space:]]*//' | tr -d ':' | tr '[:upper:]' '[:lower:]' | head -n 1 || true)
          EXPECTED=$(tr -d '[:space:]' < RELEASE_SIGNING_CERT_SHA256.txt)
          test -n "$ACTUAL"
          test "$ACTUAL" = "$EXPECTED" || { echo "Release certificate fingerprint mismatch"; exit 1; }
          unzip -t "$APK" >/dev/null
          echo "APK signature and expected release certificate fingerprint verified."

      - name: Package V198 APK and source ZIP
        working-directory: ${{ env.ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          mkdir -p out source-export
          cp "$APK" out/SE-Android-v100.0.198-release.apk
          rsync -a ./ source-export/ \
            --exclude='.git' --exclude='.gradle' --exclude='.kotlin' --exclude='.idea' \
            --exclude='app/build' --exclude='out' --exclude='source-export' \
            --exclude='build_payload' --exclude='.github' \
            --exclude='*.jks' --exclude='*.keystore' --exclude='*.p12' --exclude='*.pfx' \
            --exclude='SE_RELEASE_KEYSTORE_BASE64.txt' --exclude='release-signing.properties'
          (cd source-export && zip -qr ../out/SE-Android-v100.0.198-source.zip .)
          unzip -t out/SE-Android-v100.0.198-source.zip >/dev/null
          sha256sum out/SE-Android-v100.0.198-release.apk out/SE-Android-v100.0.198-source.zip
          ls -lh out/*

      - name: Clean signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/se-iptv-release.jks"

      - name: Upload V198 APK and source deliverables
        uses: actions/upload-artifact@v4
        with:
          name: SEAndroid-v100.0.198-RELEASE-FINAL
          path: |
            ${{ env.ROOT }}/out/SE-Android-v100.0.198-release.apk
            ${{ env.ROOT }}/out/SE-Android-v100.0.198-source.zip
          if-no-files-found: error
          retention-days: 30
