name: SEAndroid V100.0.200 All CAST Seek Fix Release Build

on:
  push:
    branches:
      - v100.0.200-all-cast-seek-fix
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: seandroid-v200-all-cast-seek-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout V200 seek fix
        uses: actions/checkout@v4

      - name: Download successful V199 source artifact
        uses: actions/download-artifact@v4
        with:
          name: SEAndroid-v100.0.199-RELEASE-FINAL
          path: /tmp/v199-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 40250591928

      - name: Apply V200 cross-route seek patch with checksum validation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/src
          SRCZIP=$(find /tmp/v199-artifact -type f -name 'SE-Android-v100.0.199-source.zip' -print -quit)
          test -n "$SRCZIP" || { echo "V199 source artifact not found"; find /tmp/v199-artifact -maxdepth 3 -type f; exit 1; }
          unzip -q "$SRCZIP" -d /tmp/src
          ROOT=$(find /tmp/src -type f -name settings.gradle -print -quit | xargs -r dirname)
          test -n "$ROOT" || { echo "Unable to find Android source root"; exit 1; }
          cat "$GITHUB_WORKSPACE/.github/integrations/v200/patches/"*.b64 | tr -d '\r\n' > /tmp/v200.patch.xz.b64
          EXPECTED=df86b1e2a330161a8054d3007ffd2004132db2790e145814fff2aaeeabc4889d
          ACTUAL=$(sha256sum /tmp/v200.patch.xz.b64 | awk '{print $1}')
          test "$ACTUAL" = "$EXPECTED" || { echo "V200 patch payload checksum mismatch"; exit 1; }
          base64 --decode /tmp/v200.patch.xz.b64 | xz -dc > /tmp/v200.patch
          (cd "$ROOT" && patch -p1 --batch --forward < /tmp/v200.patch)
          # The CastLab primary DIDL builder also needs SE CAST's duration/size attributes.
          python3 - "$ROOT/app/src/main/java/com/orbital/iptv/utils/originaldlna/CastLabDlnaEngine.kt" <<'PYFIX'
          import sys
          from pathlib import Path
          p = Path(sys.argv[1])
          source = p.read_text()
          old = '<res protocolInfo="$protocolInfo">$safeUrl</res></item></DIDL-Lite>"""'
          new = '<res protocolInfo="$protocolInfo"${com.orbital.iptv.utils.SeCastSeekMetadata.resourceAttributes(url)}>$safeUrl</res></item></DIDL-Lite>"""'
          assert source.count(old) == 1, f"Expected one CastLab primary DIDL resource, found {source.count(old)}"
          p.write_text(source.replace(old, new))
          PYFIX
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Validate V200 seek metadata, phone remote commands, Web Video Caster preservation, and version
        working-directory: ${{ env.ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'versionCode 1000200' app/build.gradle
          grep -Fq 'versionName "100.0.200"' app/build.gradle
          grep -Fq 'rootProject.name = "SEAndroid_v100.0.200"' settings.gradle
          test -s SE_CAST_ALL_ROUTES_SEEK_V100_0_200_AUDIT.md
          grep -Fq 'SeCastSeekMetadata.protocolInfo' app/src/main/java/com/orbital/iptv/utils/UniversalCastManager.kt
          grep -Fq 'SeCastSeekMetadata.resourceAttributes(url)' app/src/main/java/com/orbital/iptv/utils/UniversalCastManager.kt
          grep -Fq 'SeCastSeekMetadata.protocolInfo' app/src/main/java/com/orbital/iptv/utils/TdmCompatibleDlnaManager.kt
          grep -Fq 'SeCastSeekMetadata.resourceAttributes(url)' app/src/main/java/com/orbital/iptv/utils/TdmCompatibleDlnaManager.kt
          grep -Fq 'SeCastSeekMetadata.protocolInfo' app/src/main/java/com/orbital/iptv/utils/originaldlna/CastLabDlnaEngine.kt
          grep -Fq 'SeCastSeekMetadata.resourceAttributes(url)' app/src/main/java/com/orbital/iptv/utils/originaldlna/CastLabDlnaEngine.kt
          grep -Fq 'SeCastSeekMetadata.protocolInfo' app/src/main/java/com/orbital/iptv/utils/originaldlna/playondlna/PlayOnDlnaEngine.kt
          grep -Fq 'SeCastSeekMetadata.resourceAttributes(url)' app/src/main/java/com/orbital/iptv/utils/originaldlna/playondlna/PlayOnDlnaEngine.kt
          grep -Fq 'SeCastSeekMetadata.protocolInfo' app/src/main/java/com/orbital/iptv/utils/originaldlna/fongmi/FongMiDlnaEngine.kt
          grep -Fq 'SeCastSeekMetadata.resourceAttributes(mediaUrl)' app/src/main/java/com/orbital/iptv/utils/originaldlna/fongmi/FongMiDlnaEngine.kt
          for FILE in app/src/main/java/com/orbital/iptv/utils/originaldlna/VegaDlnaEngine.kt app/src/main/java/com/orbital/iptv/utils/originaldlna/NekoVideoDlnaEngine.kt app/src/main/java/com/orbital/iptv/utils/originaldlna/YaaccDlnaEngine.kt; do
            grep -Fq 'SeCastSeekMetadata.protocolInfo' "$FILE"
            grep -Fq 'SeCastSeekMetadata.resourceAttributes(mediaUrl)' "$FILE"
          done
          grep -Fq 'SeCastSeekMetadata.resourceAttributes(url, durationMs, sizeBytes)' app/src/main/java/com/orbital/iptv/utils/SeTdmDlnaManager.kt
          grep -Fq 'resolveControlDevice' app/src/main/java/com/orbital/iptv/ui/player/PlayerActivity.kt
          grep -Fq 'prepareCastMediaWithSeekSupport' app/src/main/java/com/orbital/iptv/ui/player/PlayerActivity.kt
          grep -Fq 'launchWebVideoCaster(mediaUri)' app/src/main/java/com/orbital/iptv/ui/player/PlayerActivity.kt
          python3 - <<'PYTEST'
          from pathlib import Path
          import re
          player = Path('app/src/main/java/com/orbital/iptv/ui/player/PlayerActivity.kt').read_text()
          start = player.index('private fun showCastChooser()')
          end = player.index('private fun showOthersCastChooser', start)
          match = re.search(r'val castChoices = arrayOf\((.*?)\n        \)', player[start:end], re.S)
          assert match, 'Primary CAST choices not found'
          labels = re.findall(r'"([^"]+)"', match.group(1))
          assert labels == ['TV', 'Web Video Caster', 'SE CAST', 'CAST 1', 'CAST 2', 'OTHERS'], labels
          assert 'launchWebVideoCaster(mediaUri)' in player
          assert 'streamGoogleCastTransferCallback()' in player
          assert 'activeCastRemote' in player
          assert 'seekActiveSeCastTo(target)' in player
          print('V200 cross-route seek metadata, canonical remote wiring, primary menu mapping, and WVC route preservation validated.')
          PYTEST

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare protected Release Keystore
        shell: bash
        env:
          SE_RELEASE_KEYSTORE_BASE64: ${{ secrets.SE_RELEASE_KEYSTORE_BASE64 }}
          SE_RELEASE_STORE_PASSWORD: ${{ secrets.SE_RELEASE_STORE_PASSWORD }}
          SE_RELEASE_KEY_ALIAS: ${{ secrets.SE_RELEASE_KEY_ALIAS }}
          SE_RELEASE_KEY_PASSWORD: ${{ secrets.SE_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SE_RELEASE_KEYSTORE_BASE64" || { echo "Missing Actions secret: SE_RELEASE_KEYSTORE_BASE64"; exit 1; }
          test -n "$SE_RELEASE_STORE_PASSWORD" || { echo "Missing Actions secret: SE_RELEASE_STORE_PASSWORD"; exit 1; }
          test -n "$SE_RELEASE_KEY_ALIAS" || { echo "Missing Actions secret: SE_RELEASE_KEY_ALIAS"; exit 1; }
          test -n "$SE_RELEASE_KEY_PASSWORD" || { echo "Missing Actions secret: SE_RELEASE_KEY_PASSWORD"; exit 1; }
          KEYFILE="$RUNNER_TEMP/se-iptv-release.jks"
          printf '%s' "$SE_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYFILE"
          chmod 600 "$KEYFILE"
          keytool -list -keystore "$KEYFILE" -storepass "$SE_RELEASE_STORE_PASSWORD" -alias "$SE_RELEASE_KEY_ALIAS" >/dev/null
          echo "SE_RELEASE_KEYSTORE_PATH=$KEYFILE" >> "$GITHUB_ENV"
          echo "Protected release keystore loaded and alias verified."

      - name: Build signed Release APK
        working-directory: ${{ env.ROOT }}
        shell: bash
        env:
          SE_RELEASE_STORE_PASSWORD: ${{ secrets.SE_RELEASE_STORE_PASSWORD }}
          SE_RELEASE_KEY_ALIAS: ${{ secrets.SE_RELEASE_KEY_ALIAS }}
          SE_RELEASE_KEY_PASSWORD: ${{ secrets.SE_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SE_RELEASE_KEYSTORE_PATH"
          chmod +x gradlew
          ./gradlew clean assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature and release certificate fingerprint
        working-directory: ${{ env.ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          SDK=$(printenv ANDROID_HOME || printenv ANDROID_SDK_ROOT || echo /usr/local/lib/android/sdk)
          APKSIGNER=$(find "$SDK/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)
          test -x "$APKSIGNER"
          mkdir -p out
          "$APKSIGNER" verify --verbose --print-certs "$APK" > out/apksigner-verify.txt
          ACTUAL=$(grep -Eio 'certificate SHA-256 digest:[[:space:]]*[0-9a-f:]+' out/apksigner-verify.txt | sed -E 's/.*digest:[[:space:]]*//' | tr -d ':' | tr '[:upper:]' '[:lower:]' | head -n 1 || true)
          EXPECTED=$(tr -d '[:space:]' < RELEASE_SIGNING_CERT_SHA256.txt)
          test -n "$ACTUAL"
          test "$ACTUAL" = "$EXPECTED" || { echo "Release certificate fingerprint mismatch"; exit 1; }
          unzip -t "$APK" >/dev/null
          echo "APK signature and expected release certificate fingerprint verified."

      - name: Package V200 APK and source ZIP
        working-directory: ${{ env.ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          mkdir -p out source-export
          cp "$APK" out/SE-Android-v100.0.200-release.apk
          rsync -a ./ source-export/ \
            --exclude='.git' --exclude='.gradle' --exclude='.kotlin' --exclude='.idea' \
            --exclude='app/build' --exclude='out' --exclude='source-export' \
            --exclude='build_payload' --exclude='.github' \
            --exclude='*.jks' --exclude='*.keystore' --exclude='*.p12' --exclude='*.pfx' \
            --exclude='SE_RELEASE_KEYSTORE_BASE64.txt' --exclude='release-signing.properties'
          (cd source-export && zip -qr ../out/SE-Android-v100.0.200-source.zip .)
          unzip -t out/SE-Android-v100.0.200-source.zip >/dev/null
          sha256sum out/SE-Android-v100.0.200-release.apk out/SE-Android-v100.0.200-source.zip
          ls -lh out/*

      - name: Clean signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/se-iptv-release.jks"

      - name: Upload V200 APK and source deliverables
        uses: actions/upload-artifact@v4
        with:
          name: SEAndroid-v100.0.200-RELEASE-FINAL
          path: |
            ${{ env.ROOT }}/out/SE-Android-v100.0.200-release.apk
            ${{ env.ROOT }}/out/SE-Android-v100.0.200-source.zip
          if-no-files-found: error
          retention-days: 30
