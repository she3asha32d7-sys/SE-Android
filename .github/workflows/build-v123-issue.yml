name: SEAndroid V100.0.123 Build (Issue Trigger)

on:
  issues:
    types: [opened]

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  build:
    if: startsWith(github.event.issue.title, '[SE123-BUILD]')
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout V123 source/build payload
        uses: actions/checkout@v4
        with:
          ref: v100.0.123

      - name: Download successful V112 source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/base /tmp/source
          curl -fL --retry 10 --retry-delay 2 --retry-all-errors \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/11060581322/zip" \
            -o /tmp/v112-artifact.zip
          unzip -q /tmp/v112-artifact.zip -d /tmp/base
          SRCZIP=$(find /tmp/base -type f -name 'SE-Android-v100.0.112-source.zip' -print -quit)
          test -n "${SRCZIP}"
          unzip -q "${SRCZIP}" -d /tmp/source
          ROOT=$(find /tmp/source -type f -name settings.gradle -print -quit | xargs -r dirname)
          test -n "${ROOT}"
          echo "ROOT=${ROOT}" >> "${GITHUB_ENV}"

      - name: Reconstruct and validate exact V122 source
        run: |
          set -euo pipefail
          mkdir -p /tmp/v112_to_v122_parts
          for p in partaa partab partac partad partae; do
            curl -fL --retry 8 --retry-delay 2 --retry-all-errors \
              "https://raw.githubusercontent.com/she3asha32d7-sys/SE-Android/6cb452e0abe4c9595c3833ac241fa5456ab17b8a/build_payload/v112_to_v122_parts/${p}.b64" \
              -o "/tmp/v112_to_v122_parts/${p}.b64"
          done
          cat \
            /tmp/v112_to_v122_parts/partaa.b64 \
            /tmp/v112_to_v122_parts/partab.b64 \
            /tmp/v112_to_v122_parts/partac.b64 \
            /tmp/v112_to_v122_parts/partad.b64 \
            /tmp/v112_to_v122_parts/partae.b64 \
            | tr -d '\r\n' > /tmp/v112_to_v122.patch.xz.b64
          test "$(wc -c < /tmp/v112_to_v122.patch.xz.b64)" -eq 23880
          echo "a00ec9b1b48aff18018cf92252f60ba1cf141bf20d4c8ca0b46291ba6ce993de  /tmp/v112_to_v122.patch.xz.b64" | sha256sum -c -
          base64 -d /tmp/v112_to_v122.patch.xz.b64 > /tmp/v112_to_v122.patch.xz
          xz -t /tmp/v112_to_v122.patch.xz
          echo "b60a0db9c99e47daa10838e85390e070c727c5bd9345d6eabfc1484e39995454  /tmp/v112_to_v122.patch.xz" | sha256sum -c -
          xz -dc /tmp/v112_to_v122.patch.xz > /tmp/v112_to_v122.patch
          cd "${ROOT}"
          patch -p1 --dry-run --forward < /tmp/v112_to_v122.patch
          patch -p1 --forward < /tmp/v112_to_v122.patch
          grep -q 'versionCode 1000122' app/build.gradle
          grep -q 'versionName "100.0.122"' app/build.gradle
          test -s settings.gradle

      - name: Restore V122 required TV banner resource
        run: |
          set -euo pipefail
          mkdir -p "${ROOT}/app/src/main/res/drawable"
          cat > "${ROOT}/app/src/main/res/drawable/tv_banner.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="320dp"
              android:height="180dp"
              android:viewportWidth="320"
              android:viewportHeight="180">
              <path
                  android:fillColor="#1A1C1E"
                  android:pathData="M0,0h320v180h-320z"/>
              <path
                  android:fillColor="#6750A4"
                  android:pathData="M40,30h240v120h-240z"/>
              <path
                  android:fillColor="#E8DEF8"
                  android:pathData="M130,65 l70,25 l-70,25 z"/>
          </vector>
          EOF

      - name: Restore required adaptive icon foreground resources
        run: |
          set -euo pipefail
          mkdir -p "${ROOT}/app/src/main/res/mipmap-anydpi-v26"
          cat > "${ROOT}/app/src/main/res/mipmap-anydpi-v26/ic_launcher_foreground.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#FFFFFFFF"
                  android:pathData="M40,30 L82,54 L40,78 Z"/>
          </vector>
          EOF
          cp "${ROOT}/app/src/main/res/mipmap-anydpi-v26/ic_launcher_foreground.xml" "${ROOT}/app/src/main/res/mipmap-anydpi-v26/ic_launcher_monochrome.xml"

      - name: Bump V122 source to V123
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          root = Path(os.environ["ROOT"])

          gradle = root / "app/build.gradle"
          s = gradle.read_text(encoding="utf-8")
          s = re.sub(r'(?m)^(\s*versionCode\s+)\d+', r'\g<1>1000123', s)
          s = re.sub(r'(?m)^(\s*versionName\s+)"[^"]+"', r'\g<1>"100.0.123"', s)
          gradle.write_text(s, encoding="utf-8")

          settings = root / "settings.gradle"
          t = settings.read_text(encoding="utf-8")
          t = t.replace("100.0.122", "100.0.123").replace("1000122", "1000123").replace("V100.0.122", "V100.0.123")
          if "rootProject.name" in t:
              t = re.sub(r'(?m)^\s*rootProject\.name\s*=\s*["\'][^"\']+["\']\s*$',
                         'rootProject.name = "SEAndroid_v100.0.123"', t)
          else:
              t += '\nrootProject.name = "SEAndroid_v100.0.123"\n'
          settings.write_text(t, encoding="utf-8")

          for rel in ("SE_BUILD_MANIFEST.txt","app/src/main/res/layout/activity_settings.xml"):
              p = root / rel
              if p.exists():
                  t = p.read_text(encoding="utf-8")
                  t = t.replace("100.0.122","100.0.123").replace("1000122","1000123").replace("V100.0.122","V100.0.123")
                  p.write_text(t, encoding="utf-8")
          PY
          grep -nE 'versionCode|versionName' "${ROOT}/app/build.gradle"
          grep -nE 'rootProject.name|100\.0\.123' "${ROOT}/settings.gradle" || true
          grep -q 'versionCode 1000123' "${ROOT}/app/build.gradle"
          grep -q 'versionName "100.0.123"' "${ROOT}/app/build.gradle"
          grep -q '100.0.123' "${ROOT}/settings.gradle"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build V123 debug APK
        working-directory: ${{ env.ROOT }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Verify and package APK + source
        working-directory: ${{ env.ROOT }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "${APK}"
          unzip -t "${APK}" >/dev/null
          rm -rf out source-package
          mkdir -p out source-package
          cp "${APK}" out/SE-Android-v100.0.123-debug.apk
          rsync -a ./ source-package/ \
            --exclude='.git' --exclude='.gradle' --exclude='.idea' \
            --exclude='app/build' --exclude='out' --exclude='source-package' \
            --exclude='build_payload' --exclude='.github'
          (cd source-package && zip -qr ../out/SE-Android-v100.0.123-source.zip .)
          unzip -t out/SE-Android-v100.0.123-source.zip >/dev/null
          ls -lh out/*

      - name: Upload APK and source artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SEAndroid-v100.0.123
          path: |
            ${{ env.ROOT }}/out/SE-Android-v100.0.123-debug.apk
            ${{ env.ROOT }}/out/SE-Android-v100.0.123-source.zip
          if-no-files-found: error
          retention-days: 30

      - name: Close build trigger issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue close "${{ github.event.issue.number }}" --repo "${GITHUB_REPOSITORY}" --comment "SE V100.0.123 build workflow finished."
