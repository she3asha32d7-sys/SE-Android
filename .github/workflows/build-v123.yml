name: SEAndroid v100.0.123 Build

on:
  push:
    branches:
      - v100.0.123
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout V123 build branch
        uses: actions/checkout@v4

      - name: Restore known-good V100.0.94 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/base
          curl -fL --retry 10 --retry-delay 2 --retry-all-errors             -H "Authorization: Bearer ${GH_TOKEN}"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/11035033340/zip"             -o /tmp/v94-artifact.zip
          unzip -q /tmp/v94-artifact.zip -d /tmp/base
          SRCZIP=$(find /tmp/base -type f -name 'SE-Android-v100.0.94-source.zip' -print -quit)
          test -n "${SRCZIP}"
          rm -rf /tmp/source
          mkdir -p /tmp/source
          unzip -q "${SRCZIP}" -d /tmp/source
          ROOT=$(find /tmp/source -maxdepth 6 -type f -name settings.gradle -print -quit | xargs -r dirname)
          test -n "${ROOT}"
          echo "ROOT=${ROOT}" >> "${GITHUB_ENV}"

      - name: Reconstruct exact V100.0.122 source
        run: |
          set -euo pipefail
          mkdir -p /tmp/v94v111

          # V94 -> V111 patch is stored on the V112 branch.
          for p in part01 part02 part02b part03 part04; do
            curl -fsSL \
              "https://raw.githubusercontent.com/she3asha32d7-sys/SE-Android/v100.0.112/build_payload/v94_to_v111.${p}.b64" \
              -o "/tmp/v94v111/${p}.b64"
          done

          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          parts = [Path("/tmp/v94v111") / f"{p}.b64"
                   for p in ("part01", "part02", "part02b", "part03", "part04")]
          raw = "".join(p.read_text(encoding="utf-8") for p in parts)
          raw = "".join(raw.split())
          raw += "=" * (-len(raw) % 4)
          Path("/tmp/v94_to_v111.patch.xz").write_bytes(
              base64.b64decode(raw, validate=False)
          )
          PY

          xz -t /tmp/v94_to_v111.patch.xz
          xz -dc /tmp/v94_to_v111.patch.xz > /tmp/v94_to_v111.patch
          cd "${ROOT}"
          patch -p0 --forward < /tmp/v94_to_v111.patch

          # V111 -> V112
          python3 - <<'PY'
          from pathlib import Path
          import os

          root = Path(os.environ["ROOT"])
          for rel in ("app/build.gradle", "settings.gradle", "SE_BUILD_MANIFEST.txt"):
              p = root / rel
              if p.exists():
                  s = p.read_text(encoding="utf-8")
                  s = s.replace("100.0.111", "100.0.112")
                  s = s.replace("1000111", "1000112")
                  p.write_text(s, encoding="utf-8")
          PY

          grep -q 'versionCode 1000112' "${ROOT}/app/build.gradle"
          grep -q 'versionName "100.0.112"' "${ROOT}/app/build.gradle"

          # V112 -> V122 patch stored on this V122 build branch.
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          files = sorted((Path(os.environ["GITHUB_WORKSPACE"]) / "build_payload/v112_to_v122").glob("*.b64"))
          if not files:
              raise SystemExit("No V112->V122 patch chunks found")
          raw = "".join(p.read_text(encoding="utf-8") for p in files)
          raw = "".join(raw.split())
          raw += "=" * (-len(raw) % 4)
          Path("/tmp/v112_to_v122.patch.xz").write_bytes(
              base64.b64decode(raw, validate=False)
          )
          PY

          xz -t /tmp/v112_to_v122.patch.xz
          xz -dc /tmp/v112_to_v122.patch.xz > /tmp/v112_to_v122.patch
          cd "${ROOT}"
          patch -p0 --forward < /tmp/v112_to_v122.patch

      - name: Verify V100.0.122 source before bump
        run: |
          set -euo pipefail
          grep -q 'versionCode 1000122' "${ROOT}/app/build.gradle"
          grep -q 'versionName "100.0.122"' "${ROOT}/app/build.gradle"
          test -f "${ROOT}/settings.gradle"

      - name: Bump source from V100.0.122 to V100.0.123
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os

          root = Path(os.environ["ROOT"])
          replacements = {
              "100.0.122": "100.0.123",
              "1000122": "1000123",
              "V100.0.122": "V100.0.123",
          }
          files = [
              root / "app/build.gradle",
              root / "settings.gradle",
              root / "SE_BUILD_MANIFEST.txt",
              root / "app/src/main/res/layout/activity_settings.xml",
          ]
          for p in files:
              if not p.exists():
                  continue
              s = p.read_text(encoding="utf-8")
              for old, new in replacements.items():
                  s = s.replace(old, new)
              p.write_text(s, encoding="utf-8")
          PY
          grep -q 'versionCode 1000123' "${ROOT}/app/build.gradle"
          grep -q 'versionName "100.0.123"' "${ROOT}/app/build.gradle"
          grep -q 'SEAndroid_v100.0.123' "${ROOT}/settings.gradle"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Assemble debug APK
        working-directory: ${{ env.ROOT }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        working-directory: ${{ env.ROOT }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "${APK}"
          unzip -t "${APK}" >/dev/null

      - name: Package APK and source
        working-directory: ${{ env.ROOT }}
        run: |
          set -euo pipefail
          rm -rf out source-package
          mkdir -p out source-package
          cp app/build/outputs/apk/debug/app-debug.apk out/SE-Android-v100.0.123-debug.apk
          rsync -a ./ source-package/             --exclude='.git'             --exclude='.gradle'             --exclude='.idea'             --exclude='app/build'             --exclude='out'             --exclude='source-package'             --exclude='build_payload'             --exclude='.github'
          (cd source-package && zip -qr ../out/SE-Android-v100.0.123-source.zip .)
          unzip -t out/SE-Android-v100.0.123-source.zip >/dev/null
          test -s out/SE-Android-v100.0.123-source.zip

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SEAndroid-v100.0.123-apk
          path: ${{ env.ROOT }}/out/SE-Android-v100.0.123-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: SEAndroid-v100.0.123-source
          path: ${{ env.ROOT }}/out/SE-Android-v100.0.123-source.zip
          if-no-files-found: error
          retention-days: 30
