name: SEAndroid v100.0.131 LG DLNA Cast Final Build

on:
  push:
    branches:
      - v100.0.131-final
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout build assets
        uses: actions/checkout@v4

      - name: Download successful V130 source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/base /tmp/source
          curl -fL --retry 10 --retry-delay 2 --retry-all-errors \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/11205242879/zip" \
            -o /tmp/v130-artifact.zip
          unzip -q /tmp/v130-artifact.zip -d /tmp/base
          SRCZIP=$(find /tmp/base -type f -name 'SE-Android-v100.0.130-source.zip' -print -quit)
          test -n "${SRCZIP}"
          unzip -q "${SRCZIP}" -d /tmp/source
          ROOT=$(find /tmp/source -type f -name settings.gradle -print -quit | xargs -r dirname)
          test -n "${ROOT}"
          echo "ROOT=${ROOT}" >> "${GITHUB_ENV}"

      - name: Apply verified V130 to V131 Cast patch
        working-directory: ${{ env.ROOT }}
        run: |
          set -euo pipefail
          cp "${GITHUB_WORKSPACE}/build_payload/v130_to_v131_verified.patch.xz.b64" /tmp/v130_to_v131.patch.xz.b64
          test "$(wc -c < /tmp/v130_to_v131.patch.xz.b64)" -eq 9080
          echo "95d4e0939a136136422d1677e67f0821c2273f7650d37ef2a5956326fd1ab5fb  /tmp/v130_to_v131.patch.xz.b64" | sha256sum -c -
          base64 -d /tmp/v130_to_v131.patch.xz.b64 > /tmp/v130_to_v131.patch.xz
          xz -t /tmp/v130_to_v131.patch.xz
          xz -dc /tmp/v130_to_v131.patch.xz > /tmp/v130_to_v131.diff
          patch -p1 --forward < /tmp/v130_to_v131.diff

      - name: Verify V131 source
        working-directory: ${{ env.ROOT }}
        run: |
          set -euo pipefail
          grep -q 'versionCode 1000131' app/build.gradle
          grep -q 'versionName "100.0.131"' app/build.gradle
          grep -q 'import com.orbital.iptv.utils.LgDlnaCastManager' app/src/main/java/com/orbital/iptv/ui/player/PlayerActivity.kt
          grep -q 'showCastChooser' app/src/main/java/com/orbital/iptv/ui/player/PlayerActivity.kt
          grep -q 'LgDlnaCastManager.discover' app/src/main/java/com/orbital/iptv/ui/player/PlayerActivity.kt
          grep -q '239.255.255.250' app/src/main/java/com/orbital/iptv/utils/LgDlnaCastManager.kt
          grep -q 'SetAVTransportURI' app/src/main/java/com/orbital/iptv/utils/LgDlnaCastManager.kt
          grep -q 'CHANGE_WIFI_MULTICAST_STATE' app/src/main/AndroidManifest.xml
          grep -q 'android:src="@drawable/ic_cast"' app/src/main/res/layout/layout_genc_player_overlay.xml

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build V131 debug APK
        working-directory: ${{ env.ROOT }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Verify built APK
        working-directory: ${{ env.ROOT }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "${APK}"
          unzip -t "${APK}" >/dev/null
          ls -lh "${APK}"

      - name: Package matching APK and source
        working-directory: ${{ env.ROOT }}
        run: |
          set -euo pipefail
          rm -rf out source-package
          mkdir -p out source-package
          cp app/build/outputs/apk/debug/app-debug.apk out/SE-Android-v100.0.131-debug.apk
          rsync -a ./ source-package/ \
            --exclude='.git' \
            --exclude='.gradle' \
            --exclude='.idea' \
            --exclude='app/build' \
            --exclude='out' \
            --exclude='source-package'
          (cd source-package && zip -qr ../out/SE-Android-v100.0.131-source.zip .)
          unzip -t out/SE-Android-v100.0.131-source.zip >/dev/null
          test -s out/SE-Android-v100.0.131-debug.apk
          test -s out/SE-Android-v100.0.131-source.zip
          ls -lh out/*

      - name: Upload APK and source artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SEAndroid-v100.0.131
          path: |
            ${{ env.ROOT }}/out/SE-Android-v100.0.131-debug.apk
            ${{ env.ROOT }}/out/SE-Android-v100.0.131-source.zip
          if-no-files-found: error
          retention-days: 30
