name: SEAndroid V100.0.133 Build

on:
  push:
    branches:
      - v100.0.133-build-final3
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout build files
        uses: actions/checkout@v4

      - name: Reconstruct V132 source from verified V130/V131 chain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/base /tmp/src
          curl -fL --retry 10 --retry-delay 2 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/11205242879/zip" \
            -o /tmp/v130-artifact.zip
          unzip -q /tmp/v130-artifact.zip -d /tmp/base
          SRCZIP=$(find /tmp/base -type f -name 'SE-Android-v100.0.130-source.zip' -print -quit)
          test -n "$SRCZIP"
          unzip -q "$SRCZIP" -d /tmp/src
          ROOT=$(find /tmp/src -type f -name settings.gradle -print -quit | xargs -r dirname)
          test -n "$ROOT"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          cp build_payload/v130_to_v131_verified.patch.xz.b64 /tmp/v130_to_v131.b64
          test "$(wc -c < /tmp/v130_to_v131.b64)" -eq 9080
          echo "95d4e0939a136136422d1677e67f0821c2273f7650d37ef2a5956326fd1ab5fb  /tmp/v130_to_v131.b64" | sha256sum -c -
          base64 -d /tmp/v130_to_v131.b64 > /tmp/v130_to_v131.xz
          xz -t /tmp/v130_to_v131.xz
          xz -dc /tmp/v130_to_v131.xz > /tmp/v130_to_v131.diff
          cd "$ROOT"
          patch -p1 --forward < /tmp/v130_to_v131.diff
          cd "$GITHUB_WORKSPACE"
          cp build_payload/v131_to_v132_full.b64 /tmp/v131_to_v132.b64
          test "$(wc -c < /tmp/v131_to_v132.b64)" -eq 15356
          echo "deb8f333b951a06dc3d5726f00f0f1d1ea75d3f7b5738046390dfea5b1739973  /tmp/v131_to_v132.b64" | sha256sum -c -
          base64 -d /tmp/v131_to_v132.b64 > /tmp/v131_to_v132.xz
          xz -t /tmp/v131_to_v132.xz
          xz -dc /tmp/v131_to_v132.xz > /tmp/v131_to_v132.diff
          cd "$ROOT"
          patch -p1 --forward < /tmp/v131_to_v132.diff

      - name: Promote source to V100.0.133 and repair V132 string literal
        working-directory: ${{ env.ROOT }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/orbital/iptv/ui/player/PlayerActivity.kt')
          s = p.read_text(encoding='utf-8')
          bad = 'NO DLNA/LG webOS TV FOUND.\n\nGoogle Cast/Chromecast devices can still be selected from the system Cast dialog.'
          fixed = 'NO DLNA/LG webOS TV FOUND.\\n\\nGoogle Cast/Chromecast devices can still be selected from the system Cast dialog.'
          s = s.replace(bad, fixed)
          p.write_text(s, encoding='utf-8')
          p = Path('app/build.gradle')
          s = p.read_text(encoding='utf-8').replace('versionCode 1000132','versionCode 1000133').replace('versionName "100.0.132"','versionName "100.0.133"')
          p.write_text(s, encoding='utf-8')
          p = Path('settings.gradle')
          s = p.read_text(encoding='utf-8').replace('SEAndroid_v100.0.132','SEAndroid_v100.0.133')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify source before Gradle
        working-directory: ${{ env.ROOT }}
        run: |
          set -euo pipefail
          grep -q 'versionCode 1000133' app/build.gradle
          grep -q 'versionName "100.0.133"' app/build.gradle
          grep -q 'SEAndroid_v100.0.133' settings.gradle
          grep -q 'object UniversalCastManager' app/src/main/java/com/orbital/iptv/utils/UniversalCastManager.kt
          grep -q 'ssap://media.viewer/open' app/src/main/java/com/orbital/iptv/utils/UniversalCastManager.kt
          grep -q 'SetAVTransportURI' app/src/main/java/com/orbital/iptv/utils/UniversalCastManager.kt
          grep -q '239.255.255.250' app/src/main/java/com/orbital/iptv/utils/UniversalCastManager.kt
          grep -q 'SEARCHING FOR TVs' app/src/main/java/com/orbital/iptv/ui/player/PlayerActivity.kt
          ! grep -n 'NO DLNA/LG webOS TV FOUND\.$' app/src/main/java/com/orbital/iptv/ui/player/PlayerActivity.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        working-directory: ${{ env.ROOT }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Verify and package
        working-directory: ${{ env.ROOT }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          rm -rf out source-package
          mkdir -p out source-package
          cp "$APK" out/SE-Android-v100.0.133-debug.apk
          rsync -a ./ source-package/ --exclude='.git' --exclude='.gradle' --exclude='.idea' --exclude='app/build' --exclude='out' --exclude='source-package'
          (cd source-package && zip -qr ../out/SE-Android-v100.0.133-source.zip .)
          unzip -t out/SE-Android-v100.0.133-source.zip >/dev/null
          sha256sum out/SE-Android-v100.0.133-debug.apk out/SE-Android-v100.0.133-source.zip
          ls -lh out/*

      - name: Upload V133 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SEAndroid-v100.0.133
          path: |
            ${{ env.ROOT }}/out/SE-Android-v100.0.133-debug.apk
            ${{ env.ROOT }}/out/SE-Android-v100.0.133-source.zip
          if-no-files-found: error
          retention-days: 30
