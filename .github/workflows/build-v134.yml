name: SEAndroid V100.0.134 Build

on:
  push:
    branches:
      - v100.0.134-build
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout build files
        uses: actions/checkout@v4

      - name: Reconstruct V133 source and apply V134 fix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/base /tmp/src
          curl -fL --retry 10 --retry-delay 2 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/11208517796/zip" \
            -o /tmp/v133-artifact.zip
          unzip -q /tmp/v133-artifact.zip -d /tmp/base
          SRCZIP=$(find /tmp/base -type f -name 'SE-Android-v100.0.133-source.zip' -print -quit)
          test -n "$SRCZIP"
          unzip -q "$SRCZIP" -d /tmp/src
          ROOT=$(find /tmp/src -type f -name settings.gradle -print -quit | xargs -r dirname)
          test -n "$ROOT"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          cp build_payload/v133_to_v134.patch.xz.b64 /tmp/v133_to_v134.b64
          test "$(wc -c < /tmp/v133_to_v134.b64)" -eq 6496
          echo "9db5a8aa49a05f4cc032e3a2186cde0cb540471a75b7461396802226cda2f26d  /tmp/v133_to_v134.b64" | sha256sum -c -
          base64 -d /tmp/v133_to_v134.b64 > /tmp/v133_to_v134.xz
          xz -t /tmp/v133_to_v134.xz
          xz -dc /tmp/v133_to_v134.xz > /tmp/v133_to_v134.diff
          cd "$ROOT"
          patch -p1 --forward < /tmp/v133_to_v134.diff

      - name: Verify V134 source
        working-directory: ${{ env.ROOT }}
        run: |
          set -euo pipefail
          grep -q 'versionCode 1000134' app/build.gradle
          grep -q 'versionName "100.0.134"' app/build.gradle
          grep -q 'SEAndroid_v100.0.134' settings.gradle
          grep -q 'object UniversalCastManager' app/src/main/java/com/orbital/iptv/utils/UniversalCastManager.kt
          grep -q 'ssap://system/getSystemInfo' app/src/main/java/com/orbital/iptv/utils/UniversalCastManager.kt
          grep -q 'pairingType\":\"PROMPT' app/src/main/java/com/orbital/iptv/utils/UniversalCastManager.kt
          grep -q 'ws://${host}:3000' app/src/main/java/com/orbital/iptv/utils/UniversalCastManager.kt
          grep -q 'wss://${host}:3001' app/src/main/java/com/orbital/iptv/utils/UniversalCastManager.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        working-directory: ${{ env.ROOT }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Verify and package
        working-directory: ${{ env.ROOT }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          rm -rf out source-package
          mkdir -p out source-package
          cp "$APK" out/SE-Android-v100.0.134-debug.apk
          rsync -a ./ source-package/ --exclude='.git' --exclude='.gradle' --exclude='.idea' --exclude='app/build' --exclude='out' --exclude='source-package'
          (cd source-package && zip -qr ../out/SE-Android-v100.0.134-source.zip .)
          unzip -t out/SE-Android-v100.0.134-source.zip >/dev/null
          sha256sum out/SE-Android-v100.0.134-debug.apk out/SE-Android-v100.0.134-source.zip
          ls -lh out/*

      - name: Upload V134 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SEAndroid-v100.0.134
          path: |
            ${{ env.ROOT }}/out/SE-Android-v100.0.134-debug.apk
            ${{ env.ROOT }}/out/SE-Android-v100.0.134-source.zip
          if-no-files-found: error
          retention-days: 30
