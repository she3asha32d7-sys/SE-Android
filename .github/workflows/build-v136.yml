name: SEAndroid V100.0.136 Build
on:
  push:
    branches:
      - v100.0.136-build
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout build files
        uses: actions/checkout@v4
      - name: Reconstruct V135 source and prepare V136 build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/base /tmp/src
          curl -fL --retry 10 --retry-delay 2 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/11208549828/zip" \
            -o /tmp/v134-artifact.zip
          unzip -q /tmp/v134-artifact.zip -d /tmp/base
          SRCZIP=$(find /tmp/base -type f -name 'SE-Android-v100.0.134-source.zip' -print -quit)
          test -n "$SRCZIP"
          unzip -q "$SRCZIP" -d /tmp/src
          ROOT=$(find /tmp/src -type f -name settings.gradle -print -quit | xargs -r dirname)
          test -n "$ROOT"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

          ROOT="$ROOT" python3 build_payload/apply_v135_and_bump_to_v136.py
      - name: Verify V136 source and V135 cast fix
        working-directory: ${{ env.ROOT }}
        run: |
          set -euo pipefail
          grep -q 'versionCode 1000136' app/build.gradle
          grep -q 'versionName "100.0.136"' app/build.gradle
          grep -q 'SEAndroid_v100.0.136' settings.gradle
          grep -q 'object UniversalCastManager' app/src/main/java/com/orbital/iptv/utils/UniversalCastManager.kt
          grep -q 'AtomicBoolean' app/src/main/java/com/orbital/iptv/utils/UniversalCastManager.kt
          grep -q 'ssap://system/getSystemInfo' app/src/main/java/com/orbital/iptv/utils/UniversalCastManager.kt
          grep -q '.put("pairingType", "PROMPT")' app/src/main/java/com/orbital/iptv/utils/UniversalCastManager.kt
          grep -q 'type.equals("registered", true)' app/src/main/java/com/orbital/iptv/utils/UniversalCastManager.kt
          grep -q 'The TV prompt is only an authorization notification' app/src/main/java/com/orbital/iptv/utils/UniversalCastManager.kt
          ! grep -q 'ssap://pairing/setPin' app/src/main/java/com/orbital/iptv/utils/UniversalCastManager.kt
          ! grep -q 'PAIRING_PIN_REQUIRED' app/src/main/java/com/orbital/iptv/utils/UniversalCastManager.kt
          ! grep -q 'PIN FROM TV' app/src/main/java/com/orbital/iptv/ui/player/PlayerActivity.kt
          grep -q 'ssap://media.viewer/open' app/src/main/java/com/orbital/iptv/utils/UniversalCastManager.kt
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build debug APK
        working-directory: ${{ env.ROOT }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon --stacktrace
      - name: Verify and package
        working-directory: ${{ env.ROOT }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          rm -rf out source-package
          mkdir -p out source-package
          cp "$APK" out/SE-Android-v100.0.136-debug.apk
          rsync -a ./ source-package/ --exclude='.git' --exclude='.gradle' --exclude='.idea' --exclude='app/build' --exclude='out' --exclude='source-package'
          (cd source-package && zip -qr ../out/SE-Android-v100.0.136-source.zip .)
          unzip -t out/SE-Android-v100.0.136-source.zip >/dev/null
          sha256sum out/SE-Android-v100.0.136-debug.apk out/SE-Android-v100.0.136-source.zip
          ls -lh out/*
      - name: Upload V136 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SEAndroid-v100.0.136
          path: |
            ${{ env.ROOT }}/out/SE-Android-v100.0.136-debug.apk
            ${{ env.ROOT }}/out/SE-Android-v100.0.136-source.zip
          if-no-files-found: error
          retention-days: 30

# V136 build trigger
