name: SEAndroid V100.0.150 Web Video Caster Build
on:
  push:
    branches:
      - v100.0.150-wvc
  workflow_dispatch:
permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout build files
        uses: actions/checkout@v4

      - name: Download successful V137 source artifact
        uses: actions/download-artifact@v4
        with:
          name: SEAndroid-v100.0.137
          path: /tmp/base
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36990679861

      - name: Reconstruct V138 source
        run: |
          set -euo pipefail
          mkdir -p /tmp/src
          SRCZIP=$(find /tmp/base -type f -name 'SE-Android-v100.0.137-source.zip' -print -quit)
          test -n "$SRCZIP"
          unzip -q "$SRCZIP" -d /tmp/src
          ROOT=$(find /tmp/src -type f -name settings.gradle -print -quit | xargs -r dirname)
          test -n "$ROOT"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

          cp build_payload/v137_to_v138.patch.xz.b64 /tmp/v137_to_v138.b64
          test "$(wc -c < /tmp/v137_to_v138.b64)" -eq 11564
          echo "24ce5855957f498e8d788dc675b05fab716c4d75c40cf04fc654a8249446dde5  /tmp/v137_to_v138.b64" | sha256sum -c -
          base64 -d /tmp/v137_to_v138.b64 > /tmp/v137_to_v138.xz
          xz -t /tmp/v137_to_v138.xz
          xz -dc /tmp/v137_to_v138.xz > /tmp/v137_to_v138.diff
          cd "$ROOT"
          patch -p1 --forward --batch < /tmp/v137_to_v138.diff
          sed -i 's/^                MediaChannelConnection(sock, appClient, fid, mediaResponses)$/                return MediaChannelConnection(sock, appClient, fid, mediaResponses)/' "$ROOT/app/src/main/java/com/orbital/iptv/utils/UniversalCastManager.kt"

      - name: Apply V139 DLNA change
        run: |
          set -euo pipefail
          cp build_payload/apply_v139_dlna.py "$ROOT/apply_v139_dlna.py"
          python3 "$ROOT/apply_v139_dlna.py"

      - name: Apply V150 Web Video Caster change
        run: |
          set -euo pipefail
          cp build_payload/apply_v150_wvc.py "$ROOT/apply_v150_wvc.py"
          python3 "$ROOT/apply_v150_wvc.py"

      - name: Verify V150 source and keep TV and Google Cast
        working-directory: ${{ env.ROOT }}
        run: |
          set -euo pipefail
          grep -q 'versionCode 1000150' app/build.gradle
          grep -q 'versionName "100.0.150"' app/build.gradle
          grep -q 'SEAndroid_v100.0.150' settings.gradle
          grep -q 'activeDlnaDevice' app/src/main/java/com/orbital/iptv/utils/UniversalCastManager.kt
          grep -q 'GencMediaPlayer.swapLiveFormat' app/src/main/java/com/orbital/iptv/utils/UniversalCastManager.kt
          grep -q 'Thread.sleep(900L)' app/src/main/java/com/orbital/iptv/utils/UniversalCastManager.kt
          grep -q 'ssap://webapp/connectToApp' app/src/main/java/com/orbital/iptv/utils/UniversalCastManager.kt
          grep -q 'connectsdk.mediaCommand' app/src/main/java/com/orbital/iptv/utils/UniversalCastManager.kt
          grep -q 'CastPlayer' app/src/main/java/com/orbital/iptv/ui/player/PlayerActivity.kt
          grep -q 'MediaRouteButton' app/src/main/java/com/orbital/iptv/ui/player/PlayerActivity.kt
          test -s CAST_DLNA_LG_V100_0_139_AUDIT.md
          grep -q 'setItems(arrayOf("TV", "Web Video Caster", "Google Cast"))' app/src/main/java/com/orbital/iptv/ui/player/PlayerActivity.kt
          grep -q 'com.instantbits.cast.webvideo' app/src/main/java/com/orbital/iptv/ui/player/PlayerActivity.kt
          grep -q 'binding.btnCastBottomRoute.setOnClickListener { showCastChooser() }' app/src/main/java/com/orbital/iptv/ui/player/PlayerActivity.kt
          grep -q 'MediaRouteButtonFactory.setUpMediaRouteButton(this, binding.btnCast)' app/src/main/java/com/orbital/iptv/ui/player/PlayerActivity.kt
          grep -q 'UniversalCastManager.cast' app/src/main/java/com/orbital/iptv/ui/player/PlayerActivity.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        working-directory: ${{ env.ROOT }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Verify and package
        working-directory: ${{ env.ROOT }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          rm -rf out source-package
          mkdir -p out source-package
          cp "$APK" out/SE-Android-v100.0.150-debug.apk
          rsync -a ./ source-package/ --exclude='.git' --exclude='.gradle' --exclude='.idea' --exclude='app/build' --exclude='out' --exclude='source-package' --exclude='apply_v139_dlna.py' --exclude='apply_v150_wvc.py'
          (cd source-package && zip -qr ../out/SE-Android-v100.0.150-source.zip .)
          unzip -t out/SE-Android-v100.0.150-source.zip >/dev/null
          sha256sum out/SE-Android-v100.0.150-debug.apk out/SE-Android-v100.0.150-source.zip
          ls -lh out/*

      - name: Upload V139 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SEAndroid-v100.0.150-WVC
          path: |
            ${{ env.ROOT }}/out/SE-Android-v100.0.150-debug.apk
            ${{ env.ROOT }}/out/SE-Android-v100.0.150-source.zip
          if-no-files-found: error
          retention-days: 30
