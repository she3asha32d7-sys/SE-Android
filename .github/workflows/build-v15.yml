name: SEAndroid v100.0.15 Build

on:
  push:
    branches: [v100.0.15]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout v100.0.15
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download successful v100.0.14 source artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl -fL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/actions/artifacts/10828642687/zip" -o base-artifact.zip
          rm -rf base-artifact source
          mkdir -p base-artifact source
          unzip -q base-artifact.zip -d base-artifact
          SRCZIP="$(find base-artifact -type f -name 'SEAndroid_v100.0.14.zip' -print -quit)"
          test -n "${SRCZIP}"
          unzip -q "${SRCZIP}" -d source
          ROOT="$(find source -maxdepth 4 -type f -name gradlew -print -quit | xargs -r dirname)"
          test -n "${ROOT}"
          if [ "${ROOT}" != "${GITHUB_WORKSPACE}/source" ]; then
            shopt -s dotglob
            mkdir -p "${GITHUB_WORKSPACE}/source-fixed"
            cp -a "${ROOT}/." "${GITHUB_WORKSPACE}/source-fixed/"
            rm -rf "${GITHUB_WORKSPACE}/source"
            mv "${GITHUB_WORKSPACE}/source-fixed" "${GITHUB_WORKSPACE}/source"
          fi

      - name: Apply v100.0.15 player fix
        run: |
          set -euo pipefail
          base64 -d build_payload/v15_text_git.patch.gz.b64 | gzip -d > /tmp/v15.patch
          patch --dry-run -p1 -d source < /tmp/v15.patch
          patch -p1 -d source < /tmp/v15.patch
          echo "Version after patch:"
          grep -n -E 'versionCode|versionName' source/app/build.gradle

      - name: Verify v100.0.15 changes
        working-directory: source
        run: |
          set -euo pipefail
          grep -Fq 'versionCode 1000015' app/build.gradle
          grep -Fq 'versionName "100.0.15"' app/build.gradle
          grep -Fq 'SEAndroid_v100.0.15' settings.gradle
          grep -Fq 'android:visibility="gone"' app/src/main/res/layout/activity_player.xml
          grep -Fq 'android:text="SE"' app/src/main/res/layout/activity_settings.xml
          grep -Fq 'b.tvBuiltinPlayerValue.text = "SE"' app/src/main/java/com/orbital/iptv/ui/settings/SettingsActivity.kt
          if grep -RIn 'Genç IPTV Player' app/src/main/java app/src/main/res/layout >/tmp/old-genc-labels.txt; then
            cat /tmp/old-genc-labels.txt
            exit 1
          fi
          echo "v100.0.15 source verification passed."

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build APK
        working-directory: source
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build-v100.0.15.log

      - name: Package APK and source
        run: |
          set -euo pipefail
          rm -rf output source-for-zip
          mkdir -p output source-for-zip
          test -s source/app/build/outputs/apk/debug/app-debug.apk
          cp source/app/build/outputs/apk/debug/app-debug.apk output/SEAndroid_v100.0.15.apk
          cp -a source/. source-for-zip/
          rm -rf source-for-zip/.gradle source-for-zip/.git source-for-zip/.idea source-for-zip/app/build source-for-zip/.kotlin source-for-zip/.github
          (cd source-for-zip && zip -qr "${GITHUB_WORKSPACE}/output/SEAndroid_v100.0.15.zip" .)
          ls -lh output

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SEAndroid_v100.0.15-apk
          path: output/SEAndroid_v100.0.15.apk
          retention-days: 30

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: SEAndroid_v100.0.15-source
          path: output/SEAndroid_v100.0.15.zip
          retention-days: 30

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="SEAndroid_v100.0.15"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release delete "${TAG}" --yes --cleanup-tag
          fi
          gh release create "${TAG}" output/SEAndroid_v100.0.15.apk output/SEAndroid_v100.0.15.zip \
            --title "SEAndroid v100.0.15" \
            --notes "SE IPTV PLAYER — removes the legacy player HUD from the active playback path and keeps the SE player interface as the only visible player UI; Media Player setting label changed to SE." \
            --target "${GITHUB_SHA}"
