name: SEAndroid V100.0.158 FINAL Build

on:
  push:
    branches:
      - v100.0.158-github-build
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout V158 source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Normalize V158 version
        shell: bash
        run: |
          set -euo pipefail
          test -f gradlew
          test -f app/build.gradle
          sed -i -E 's/(versionCode[[:space:]]+)[0-9]+/\11000158/' app/build.gradle
          sed -i -E 's/(versionName[[:space:]]+)"[^"]+"/\1"100.0.158"/' app/build.gradle
          if grep -q 'rootProject.name' settings.gradle 2>/dev/null; then
            sed -i -E 's/(rootProject\.name[[:space:]]*=[[:space:]]*)"[^"]+"/\1"SEAndroid_v100.0.158"/' settings.gradle
          fi
          echo '--- V158 version markers ---'
          grep -nE 'versionCode|versionName' app/build.gradle | head -20
          grep -n 'rootProject.name' settings.gradle || true

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          APKANALYZER="$(find "$ANDROID_HOME" -type f -name apkanalyzer -perm -111 2>/dev/null | head -n 1 || true)"
          if [ -n "$APKANALYZER" ]; then
            test "$("$APKANALYZER" manifest version-name "$APK")" = "100.0.158"
            test "$("$APKANALYZER" manifest version-code "$APK")" = "1000158"
            echo "applicationId=$("$APKANALYZER" manifest application-id "$APK")"
          else
            AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -perm -111 2>/dev/null | sort -V | tail -n 1 || true)"
            test -n "$AAPT"
            "$AAPT" dump badging "$APK" | grep -q "versionName='100.0.158'"
            "$AAPT" dump badging "$APK" | grep -q "versionCode='1000158'"
            "$AAPT" dump badging "$APK" | grep -m1 '^package:'
          fi
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Package APK and source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out source-package
          mkdir -p out source-package
          cp app/build/outputs/apk/debug/app-debug.apk out/SE-Android-v100.0.158-debug.apk
          rsync -a ./ source-package/ \
            --exclude='.git' \
            --exclude='.gradle' \
            --exclude='.idea' \
            --exclude='app/build' \
            --exclude='out' \
            --exclude='source-package' \
            --exclude='.github'
          (cd source-package && zip -qr ../out/SE-Android-v100.0.158-source.zip .)
          unzip -t out/SE-Android-v100.0.158-source.zip >/dev/null
          sha256sum out/SE-Android-v100.0.158-debug.apk out/SE-Android-v100.0.158-source.zip
          ls -lh out/*

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SEAndroid-v100.0.158-FINAL
          path: |
            out/SE-Android-v100.0.158-debug.apk
            out/SE-Android-v100.0.158-source.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v100.0.158-apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "SE Android V100.0.158" \
            --notes "Verified V100.0.158 debug APK and matching source code."
          gh release upload "$TAG" \
            out/SE-Android-v100.0.158-debug.apk \
            out/SE-Android-v100.0.158-source.zip
