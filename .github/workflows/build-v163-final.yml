name: SEAndroid V100.0.163 GitHub Build

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout V163 build recipe
        uses: actions/checkout@v4

      - name: Download verified V158 source artifact
        uses: actions/download-artifact@v4
        with:
          name: SEAndroid-v100.0.158-FINAL
          path: /tmp/base
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37544161929

      - name: Reconstruct exact V163 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/src
          mkdir -p /tmp/src

          SRCZIP=$(find /tmp/base -type f -name 'SE-Android-v100.0.158-source.zip' -print -quit)
          test -n "$SRCZIP"
          unzip -q "$SRCZIP" -d /tmp/src

          ROOT=$(find /tmp/src -type f -name settings.gradle -print -quit | xargs -r dirname)
          test -n "$ROOT"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

          cat build_payload/v158_to_v163.patch.gz.b64.00 \
              build_payload/v158_to_v163.patch.gz.b64.01 \
              build_payload/v158_to_v163.patch.gz.b64.02 \
              build_payload/v158_to_v163.patch.gz.b64.03 \
              build_payload/v158_to_v163.patch.gz.b64.04 > /tmp/v158_to_v163.patch.gz.b64

          base64 -d /tmp/v158_to_v163.patch.gz.b64 > /tmp/v158_to_v163.patch.gz
          gzip -t /tmp/v158_to_v163.patch.gz
          gzip -dc /tmp/v158_to_v163.patch.gz > /tmp/v158_to_v163.patch

          cd "$ROOT"
          patch -p1 --forward --batch < /tmp/v158_to_v163.patch

      - name: Verify V163 source changes
        working-directory: ${{ env.ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          test -f gradlew
          test -f app/build.gradle
          grep -q 'versionCode 1000163' app/build.gradle
          grep -q 'versionName "100.0.163"' app/build.gradle

          grep -q 'hideGencOverlay()' app/src/main/java/com/orbital/iptv/ui/player/PlayerActivity.kt
          grep -q 'speedPlayingSelectedSpeed = 1.0f' app/src/main/java/com/orbital/iptv/ui/player/PlayerActivity.kt

          grep -q 'buildPlayerRecordingFilename' app/src/main/java/com/orbital/iptv/recording/RecordingRepository.kt
          grep -q 'appendNumberWithoutSeparator = isOnDemandVideo' app/src/main/java/com/orbital/iptv/recording/RecordingService.kt
          grep -q 'fun makeFileName(title: String, url: String)' app/src/main/java/com/orbital/iptv/utils/DownloadStore.kt
          grep -q 'SE IPTV PLAYER' app/src/main/java/com/orbital/iptv/utils/PublicMediaStorage.kt
          grep -q 'DOWNLOADS' app/src/main/java/com/orbital/iptv/utils/PublicMediaStorage.kt
          grep -q 'RECORDS' app/src/main/java/com/orbital/iptv/utils/PublicMediaStorage.kt

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build V163 APK
        working-directory: ${{ env.ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        working-directory: ${{ env.ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          APKANALYZER="$(find "$ANDROID_HOME" -type f -name apkanalyzer -perm -111 2>/dev/null | head -n 1 || true)"
          if [ -n "$APKANALYZER" ]; then
            test "$("$APKANALYZER" manifest version-name "$APK")" = "100.0.163"
            test "$("$APKANALYZER" manifest version-code "$APK")" = "1000163"
            echo "applicationId=$("$APKANALYZER" manifest application-id "$APK")"
          else
            AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -perm -111 2>/dev/null | sort -V | tail -n 1 || true)"
            test -n "$AAPT"
            "$AAPT" dump badging "$APK" | grep -q "versionName='100.0.163'"
            "$AAPT" dump badging "$APK" | grep -q "versionCode='1000163'"
          fi
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Package APK and exact source
        working-directory: ${{ env.ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out source-export
          mkdir -p out source-export
          cp app/build/outputs/apk/debug/app-debug.apk out/SE-Android-v100.0.163-debug.apk

          rsync -a ./ source-export/ \
            --exclude='.git' \
            --exclude='.gradle' \
            --exclude='.kotlin' \
            --exclude='.idea' \
            --exclude='app/build' \
            --exclude='out' \
            --exclude='source-export' \
            --exclude='build_payload' \
            --exclude='.github'

          (cd source-export && zip -qr ../out/SE-Android-v100.0.163-source.zip .)
          unzip -t out/SE-Android-v100.0.163-source.zip >/dev/null
          sha256sum out/SE-Android-v100.0.163-debug.apk out/SE-Android-v100.0.163-source.zip
          ls -lh out/

      - name: Upload final V163 files
        uses: actions/upload-artifact@v4
        with:
          name: SEAndroid-v100.0.163-FINAL
          path: |
            ${{ env.ROOT }}/out/SE-Android-v100.0.163-debug.apk
            ${{ env.ROOT }}/out/SE-Android-v100.0.163-source.zip
          if-no-files-found: error
          retention-days: 30
