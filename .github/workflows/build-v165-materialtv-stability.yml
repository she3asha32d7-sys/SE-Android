name: SEAndroid V100.0.165 MaterialTV Player Stability Build

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout V165 build recipe and MaterialTV v3.2 engine sources
        uses: actions/checkout@v4

      - name: Download verified V163 source artifact
        uses: actions/download-artifact@v4
        with:
          name: SEAndroid-v100.0.163-FINAL
          path: /tmp/base
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38023857774

      - name: Reconstruct V164 source and import the MaterialTV v3.2 player engines
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/src
          mkdir -p /tmp/src
          SRCZIP=$(find /tmp/base -type f -name 'SE-Android-v100.0.163-source.zip' -print -quit)
          test -n "$SRCZIP"
          unzip -q "$SRCZIP" -d /tmp/src
          ROOT=$(find /tmp/src -type f -name settings.gradle -print -quit | xargs -r dirname)
          test -n "$ROOT"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

          base64 -d build_payload/v163_to_v164.patch.gz.b64.00 > /tmp/v163_to_v164.patch.gz
          gzip -t /tmp/v163_to_v164.patch.gz
          gzip -dc /tmp/v163_to_v164.patch.gz > /tmp/v163_to_v164.patch
          cd "$ROOT"
          patch -p1 --forward --batch < /tmp/v163_to_v164.patch

          ENGINE_SRC="$GITHUB_WORKSPACE/build_payload/materialtv-engine-src"
          ENGINE_DST="$ROOT/app/src/main/java/com/orbital/iptv/playerengine"
          test -s "$ENGINE_SRC/PlayerEngine.kt"
          test -s "$ENGINE_SRC/ExoPlayerEngine.kt"
          test -s "$ENGINE_SRC/LibVlcEngine.kt"
          test -s "$ENGINE_SRC/LibMpvEngine.kt"
          test -s "$ENGINE_SRC/StringUtils.kt"
          mkdir -p "$ENGINE_DST"
          cp "$ENGINE_SRC/"*.kt "$ENGINE_DST/"

      - name: Apply V164 player runtime fixes and bump source to V165
        working-directory: ${{ env.ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          base64 -d "$GITHUB_WORKSPACE/build_payload/v164_to_v165.patch.gz.b64.00" > /tmp/v164_to_v165.patch.gz
          gzip -t /tmp/v164_to_v165.patch.gz
          gzip -dc /tmp/v164_to_v165.patch.gz > /tmp/v164_to_v165.patch
          patch -p1 --forward --batch < /tmp/v164_to_v165.patch

      - name: Verify V165 version, runtime fixes and ARM64-only packaging
        working-directory: ${{ env.ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          test -f gradlew
          grep -q 'versionCode 1000165' app/build.gradle
          grep -q 'versionName "100.0.165"' app/build.gradle
          grep -q 'abiFilters "arm64-v8a"' app/build.gradle
          ! grep -q 'splits[[:space:]]*{' app/build.gradle
          grep -q 'private var surfaceAttached: Boolean = false' app/src/main/java/com/orbital/iptv/playerengine/LibMpvEngine.kt
          grep -q 'attachSurfaceSafely(holder.surface)' app/src/main/java/com/orbital/iptv/playerengine/LibMpvEngine.kt
          grep -q 'engine.reattach()' app/src/main/java/com/orbital/iptv/ui/player/MaterialTvPlayerActivity.kt
          grep -q 'engine.onResume()' app/src/main/java/com/orbital/iptv/ui/player/MaterialTvPlayerActivity.kt
          grep -q 'recoverAfterEngineError(type, created, error)' app/src/main/java/com/orbital/iptv/ui/player/MaterialTvPlayerActivity.kt
          grep -q 'VLC/3.0.20 LibVLC/3.0.20' app/src/main/java/com/orbital/iptv/playerengine/LibVlcEngine.kt
          ! grep -q 'Accept-Encoding.*br' app/src/main/java/com/orbital/iptv/playerengine/ExoPlayerEngine.kt
          grep -q 'SE IPTV PLAYER' app/src/main/java/com/orbital/iptv/utils/PublicMediaStorage.kt

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build V165 ARM64 debug APK
        working-directory: ${{ env.ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Verify APK metadata and native player libraries
        working-directory: ${{ env.ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libmpv.so'
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libvlc.so'
          if unzip -l "$APK" | grep -qE 'lib/(armeabi-v7a|x86|x86_64)/'; then
            echo "Unexpected non-ARM64 native libraries were packaged" >&2
            exit 1
          fi
          APKANALYZER="$(find "$ANDROID_HOME" -type f -name apkanalyzer -perm -111 2>/dev/null | head -n 1 || true)"
          if [ -n "$APKANALYZER" ]; then
            test "$("$APKANALYZER" manifest version-name "$APK")" = "100.0.165"
            test "$("$APKANALYZER" manifest version-code "$APK")" = "1000165"
            echo "applicationId=$("$APKANALYZER" manifest application-id "$APK")"
          else
            AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -perm -111 2>/dev/null | sort -V | tail -n 1 || true)"
            test -n "$AAPT"
            "$AAPT" dump badging "$APK" | grep -q "versionName='100.0.165'"
            "$AAPT" dump badging "$APK" | grep -q "versionCode='1000165'"
          fi
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Package V165 ARM64 APK and matching source code
        working-directory: ${{ env.ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out source-export
          mkdir -p out source-export
          cp app/build/outputs/apk/debug/app-debug.apk out/SE-Android-v100.0.165-arm64-v8a-debug.apk
          rsync -a ./ source-export/ \
            --exclude='.git' \
            --exclude='.gradle' \
            --exclude='.kotlin' \
            --exclude='.idea' \
            --exclude='app/build' \
            --exclude='out' \
            --exclude='source-export' \
            --exclude='build_payload' \
            --exclude='.github'
          (cd source-export && zip -qr ../out/SE-Android-v100.0.165-source.zip .)
          unzip -t out/SE-Android-v100.0.165-source.zip >/dev/null
          sha256sum out/SE-Android-v100.0.165-arm64-v8a-debug.apk out/SE-Android-v100.0.165-source.zip
          ls -lh out/

      - name: Upload final V165 files
        uses: actions/upload-artifact@v4
        with:
          name: SEAndroid-v100.0.165-FINAL
          path: |
            ${{ env.ROOT }}/out/SE-Android-v100.0.165-arm64-v8a-debug.apk
            ${{ env.ROOT }}/out/SE-Android-v100.0.165-source.zip
          if-no-files-found: error
          retention-days: 30
