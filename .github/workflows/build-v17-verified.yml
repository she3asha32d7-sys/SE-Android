name: Build SEAndroid v100.0.17 Verified

on:
  workflow_dispatch:
  push:
    branches:
      - v100.0.17

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore v100.0.15 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -L -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/she3asha32d7-sys/SE-Android/actions/artifacts/10832659728/zip" -o /tmp/base-artifact.zip
          mkdir -p /tmp/base-artifact
          unzip -q /tmp/base-artifact.zip -d /tmp/base-artifact
          find /tmp/base-artifact -name '*.zip' -print -quit | xargs -I{} unzip -q "{}" -d .
          test -f app/build.gradle
          echo "v100.0.15 source restored"

      - name: Apply source fixes
        run: python3 scripts/apply_v17.py

      - name: Verify source
        run: |
          grep -q 'SE PLAYER' app/src/main/java/com/orbital/iptv/ui/settings/SettingsActivity.kt
          grep -q 'Version: V100.0.17' app/src/main/res/layout/activity_settings.xml
          grep -q '192dp' app/src/main/res/layout/activity_login.xml
          grep -q 'android:inset="0dp"' app/src/main/res/drawable/se_launcher_scaled.xml
          grep -q 'DELETE' app/src/main/java/com/orbital/iptv/ui/users/ListUsersActivity.kt
          grep -q 'Name: ' app/src/main/java/com/orbital/iptv/ui/users/ListUsersActivity.kt
          echo "SOURCE VERIFICATION PASSED"

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Package
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/SEAndroid_v100.0.17.apk
          zip -qr out/SEAndroid_v100.0.17-source.zip . -x '.git/*' '.gradle/*' 'app/build/*' 'out/*'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SEAndroid_v100.0.17-apk
          path: out/SEAndroid_v100.0.17.apk
          retention-days: 30

      - name: Upload Source
        uses: actions/upload-artifact@v4
        with:
          name: SEAndroid_v100.0.17-source
          path: out/SEAndroid_v100.0.17-source.zip
          retention-days: 30
