name: Build SEAndroid v100.0.18

on:
  push:
    branches:
      - v100.0.18
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore v100.0.17 source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10834906043/zip" -o /tmp/v17-artifact.zip
          rm -rf /tmp/v17-artifact
          mkdir -p /tmp/v17-artifact
          unzip -q /tmp/v17-artifact.zip -d /tmp/v17-artifact
          SRCZIP="$(find /tmp/v17-artifact -type f -name 'SEAndroid_v100.0.17-source.zip' -print -quit)"
          test -n "${SRCZIP}"
          unzip -q "${SRCZIP}" -d .
          test -f app/build.gradle
          test -f gradlew

      - name: Apply v100.0.18
        run: python3 scripts/apply_v18.py

      - name: Verify
        run: |
          set -e
          grep -q 'versionCode 1000018' app/build.gradle
          grep -q 'versionName "100.0.18"' app/build.gradle
          grep -q 'SE PLAYER' app/src/main/java/com/orbital/iptv/ui/settings/SettingsActivity.kt
          grep -q 'about_table' app/src/main/res/layout/activity_settings.xml
          grep -q 'V100.0.18' app/src/main/res/layout/activity_settings.xml
          grep -q '384dp' app/src/main/res/layout/activity_login.xml
          grep -q 'android:scaleWidth="200%"' app/src/main/res/drawable/se_launcher_scaled.xml
          grep -q 'val parsed: List<ServerProfile>?' app/src/main/java/com/orbital/iptv/utils/PrefsManager.kt
          echo "SOURCE VERIFICATION PASSED"

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Package
        run: |
          set -e
          mkdir -p out source-for-zip
          cp app/build/outputs/apk/debug/app-debug.apk out/SEAndroid_v100.0.18.apk
          cp -a . source-for-zip/
          rm -rf source-for-zip/.git source-for-zip/.gradle source-for-zip/.idea source-for-zip/app/build source-for-zip/out source-for-zip/source-for-zip
          (cd source-for-zip && zip -qr "$GITHUB_WORKSPACE/out/SEAndroid_v100.0.18-source.zip" .)
          ls -lh out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SEAndroid_v100.0.18-apk
          path: out/SEAndroid_v100.0.18.apk
          retention-days: 30

      - name: Upload Source
        uses: actions/upload-artifact@v4
        with:
          name: SEAndroid_v100.0.18-source
          path: out/SEAndroid_v100.0.18-source.zip
          retention-days: 30
