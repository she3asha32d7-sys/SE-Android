name: Build SEAndroid v2.0.1 FINAL
run-name: Build SEAndroid v2.0.1 FINAL

on:
  push:
    paths:
      - final-build-trigger.txt

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e
          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager -perm -111 | head -n 1 || true)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Restore Run 26 base source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e
          rm -rf /tmp/base /tmp/artifact
          mkdir -p /tmp/base /tmp/artifact
          gh api -H "Accept: application/vnd.github+json" "/repos/${{ github.repository }}/actions/artifacts/10645184991/zip" > /tmp/artifact/base-artifact.zip
          unzip -q /tmp/artifact/base-artifact.zip -d /tmp/artifact/unpacked
          NESTED="$(find /tmp/artifact/unpacked -type f -name '*.zip' -print -quit)"
          test -n "$NESTED"
          unzip -q "$NESTED" -d /tmp/base
          PROJECT_ROOT="$(find /tmp/base -maxdepth 5 -type f -name gradlew -print -quit | xargs -r dirname)"
          test -n "$PROJECT_ROOT"
          mv "$PROJECT_ROOT" ./SE-Android-v10.1.0
          test -f ./SE-Android-v10.1.0/gradlew

      - name: Apply complete FINAL patch
        shell: bash
        run: |
          set -e
          test -f patch_parts/00.b64
          base64 -d patch_parts/00.b64 > /tmp/final.patch.gz
          gzip -cd /tmp/final.patch.gz > /tmp/final.patch

          cd SE-Android-v10.1.0
          if patch --dry-run -p1 < /tmp/final.patch >/tmp/patch-p1.log 2>&1; then
            echo "Applying with -p1"
            patch -p1 < /tmp/final.patch
          elif patch --dry-run -p0 < /tmp/final.patch >/tmp/patch-p0.log 2>&1; then
            echo "Applying with -p0"
            patch -p0 < /tmp/final.patch
          else
            echo "Patch did not apply with either -p1 or -p0"
            cat /tmp/patch-p1.log
            cat /tmp/patch-p0.log
            exit 1
          fi

      - name: Cast Kotlin compatibility
        working-directory: SE-Android-v10.1.0
        shell: bash
        run: |
          set -e
          while IFS= read -r -d '' f; do
            sed -i 's/22\.1\.0/22.0.0/g' "$f"
          done < <(grep -RIlz --exclude-dir=.gradle --exclude-dir=build 'play-services-cast-framework' . || true)
          cat > cast-compat.init.gradle <<'EOF'
allprojects {
  configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
      if (details.requested.group == "com.google.android.gms" &&
          (details.requested.name == "play-services-cast-framework" ||
           details.requested.name == "play-services-cast") &&
          details.requested.version == "22.1.0") {
        details.useVersion("22.0.0")
      }
    }
  }
  plugins.withId("org.jetbrains.kotlin.android") {
    tasks.configureEach { task ->
      if (task.hasProperty("kotlinOptions")) {
        task.kotlinOptions.freeCompilerArgs += "-Xskip-metadata-version-check"
      }
    }
  }
}
EOF

      - name: Build Release APK
        working-directory: SE-Android-v10.1.0
        shell: bash
        run: |
          set -e
          chmod +x gradlew
          ./gradlew -I cast-compat.init.gradle clean assembleRelease --stacktrace --no-daemon

      - name: Sign final APK
        shell: bash
        run: |
          set -e
          APK="$(find SE-Android-v10.1.0/app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          mkdir -p signing output
          keytool -genkeypair -keystore signing/se-release.keystore -storepass changeit -keypass changeit -alias se-release -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=SEAndroid v2.0.1, OU=SE, O=SE, L=Unknown, ST=Unknown, C=EG" -noprompt
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -perm -111 | sort -V | tail -n 1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign -perm -111 | sort -V | tail -n 1)"
          "$ZIPALIGN" -f -p 4 "$APK" output/SEAndroid_v2.0.1-aligned.apk
          "$APKSIGNER" sign --ks signing/se-release.keystore --ks-pass pass:changeit --key-pass pass:changeit --ks-key-alias se-release --out output/SEAndroid_v2.0.1.apk output/SEAndroid_v2.0.1-aligned.apk
          rm -f output/SEAndroid_v2.0.1-aligned.apk
          "$APKSIGNER" verify --verbose output/SEAndroid_v2.0.1.apk

      - name: Package exact patched source
        shell: bash
        run: |
          set -e
          rm -rf /tmp/final-source
          mkdir -p /tmp/final-source
          zip -qr /tmp/final-source/SEAndroid_v2.0.1-source.zip SE-Android-v10.1.0 \
            -x 'SE-Android-v10.1.0/.gradle/*' \
               'SE-Android-v10.1.0/**/build/*' \
               'SE-Android-v10.1.0/.idea/*' \
               'SE-Android-v10.1.0/signing/*'
          cp /tmp/final-source/SEAndroid_v2.0.1-source.zip output/SEAndroid_v2.0.1-source.zip

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SEAndroid_v2.0.1-APK
          path: output/SEAndroid_v2.0.1.apk
          retention-days: 30

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: SEAndroid_v2.0.1-SOURCE
          path: output/SEAndroid_v2.0.1-source.zip
          retention-days: 30
