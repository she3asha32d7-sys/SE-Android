name: Build SEAndroid v2.0.1 Final Mobile

on:
  push:
    branches: [main]
    paths:
      - 'patch_parts/00.b64'
      - 'SEAndroid_v100.0.1.zip'
      - '.github/workflows/build-v2-mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work
          mkdir -p work/input work/output
          unzip -q SEAndroid_v100.0.1.zip -d work/input
          ROOT="$(find work/input -type f -name gradlew -print -quit | xargs -r dirname)"
          test -n "$ROOT"
          cp -a "$ROOT"/. work/
          chmod +x work/gradlew
          test -f work/settings.gradle || test -f work/settings.gradle.kts
          test -f work/app/build.gradle || test -f work/app/build.gradle.kts

      - name: Apply final modification patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d patch_parts/00.b64 > /tmp/final.patch.gz
          gzip -cd /tmp/final.patch.gz > /tmp/final.patch
          cd work
          if patch --dry-run -p1 < /tmp/final.patch >/tmp/p1.log 2>&1; then
            patch -p1 < /tmp/final.patch
          elif patch --dry-run -p0 < /tmp/final.patch >/tmp/p0.log 2>&1; then
            patch -p0 < /tmp/final.patch
          else
            echo "Patch failed with both -p1 and -p0"
            cat /tmp/p1.log || true
            cat /tmp/p0.log || true
            exit 1
          fi

      - name: Remove obsolete Box Office and player controls
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIn --exclude-dir=.gradle --exclude-dir=build -E 'Box Office|btn_hud_scores|btn_hud_news|Goal Flash|GoalFlashOverlay|btn_scores|btn_news|btn_goal_flash' app/src/main; then
            echo "ERROR: obsolete UI markers remain after final patch"
            exit 1
          fi

      - name: Create Gradle compatibility init
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          cat > cast-compat.init.gradle <<'EOF'
allprojects {
  configurations.configureEach {
    resolutionStrategy.eachDependency { d ->
      if (d.requested.group == "com.google.android.gms" &&
          (d.requested.name == "play-services-cast-framework" ||
           d.requested.name == "play-services-cast") ) {
        d.useVersion("22.0.0")
      }
      if (d.requested.group == "org.jetbrains.kotlin" &&
          d.requested.name.startsWith("kotlin-stdlib")) {
        d.useVersion("1.9.25")
      }
    }
  }
  plugins.withId("org.jetbrains.kotlin.android") {
    tasks.configureEach { t ->
      if (t.hasProperty("kotlinOptions")) {
        t.kotlinOptions.freeCompilerArgs += "-Xskip-metadata-version-check"
      }
    }
  }
}
EOF

      - name: Build release APK
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew -I cast-compat.init.gradle clean assembleRelease --stacktrace --no-daemon
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g

      - name: Sign APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find work/app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          keytool -genkeypair -v \
            -keystore work/se-final.keystore \
            -storepass changeit -keypass changeit \
            -alias sefinal -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=SE IPTV PLAYER, O=SE, C=EG" -noprompt
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign -perm -111 | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -perm -111 | sort -V | tail -n 1)"
          "$ZIPALIGN" -f -p 4 "$APK" work/output/SEAndroid_v2.0.1-aligned.apk
          "$APKSIGNER" sign \
            --ks work/se-final.keystore \
            --ks-pass pass:changeit --key-pass pass:changeit \
            --ks-key-alias sefinal \
            --out work/output/SEAndroid_v2.0.1.apk \
            work/output/SEAndroid_v2.0.1-aligned.apk
          rm -f work/output/SEAndroid_v2.0.1-aligned.apk
          "$APKSIGNER" verify --verbose work/output/SEAndroid_v2.0.1.apk
          sha256sum work/output/SEAndroid_v2.0.1.apk > work/output/SEAndroid_v2.0.1.apk.sha256

      - name: Package patched source
        shell: bash
        run: |
          set -euo pipefail
          rm -f work/se-final.keystore
          (
            cd work
            zip -q -r ../work/output/SEAndroid_v2.0.1-source.zip . \
              -x '.gradle/*' 'app/build/*' '.idea/*'
          )
          sha256sum work/output/SEAndroid_v2.0.1-source.zip > work/output/SEAndroid_v2.0.1-source.zip.sha256

      - name: Upload final artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SEAndroid_v2.0.1-FINAL
          path: work/output/*
          retention-days: 30
