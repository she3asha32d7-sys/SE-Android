name: SEAndroid v2.0.1 Mobile Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'SEAndroid_v2.0.1-FINAL.zip'
      - 'SEAndroid_v2.0.1-FINAL-2.zip'
      - 'SEAndroid_v2.0.1-SOURCE.zip'
      - 'SEAndroid_v2.0.1-source.zip'
      - '.github/workflows/build-v2-mobile.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build SEAndroid v2.0.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager -perm -111 | head -n 1 || true)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Locate uploaded source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP=""
          for candidate in \
            "SEAndroid_v2.0.1-FINAL.zip" \
            "SEAndroid_v2.0.1-FINAL-2.zip" \
            "SEAndroid_v2.0.1-SOURCE.zip" \
            "SEAndroid_v2.0.1-source.zip"; do
            if [ -f "$candidate" ]; then
              ZIP="$candidate"
              break
            fi
          done
          if [ -z "$ZIP" ]; then
            echo "ERROR: Upload one of: SEAndroid_v2.0.1-FINAL.zip / SEAndroid_v2.0.1-FINAL-2.zip / SEAndroid_v2.0.1-SOURCE.zip / SEAndroid_v2.0.1-source.zip"
            exit 1
          fi
          echo "SOURCE_ZIP=$ZIP" >> "$GITHUB_ENV"
          ls -lh "$ZIP"

      - name: Extract source project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _src project
          mkdir -p _src
          unzip -q "$SOURCE_ZIP" -d _src

          ROOT="$(find _src -type f -name gradlew -print -quit | xargs -r dirname)"
          if [ -z "$ROOT" ]; then
            echo "ERROR: gradlew not found in uploaded source ZIP"
            find _src -maxdepth 6 -type f | head -n 200
            exit 1
          fi

          if [ ! -f "$ROOT/settings.gradle" ] && [ ! -f "$ROOT/settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle/settings.gradle.kts not found"
            exit 1
          fi

          mv "$ROOT" project
          chmod +x project/gradlew

          # Compatibility cleanup for Media3 PlayerView XML attributes that are not
          # part of the installed Media3 UI schema.
          find project/app/src/main/res -type f -name '*.xml' -print0 | \
            xargs -0 sed -i 's/ android:useController="false"//' || true

          echo "=== PROJECT ROOT ==="
          pwd
          find project -maxdepth 2 -type f | sort | head -n 200

      - name: Apply source compile fixes
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path(".")

          # Keep the mini PlayerView in the generated ViewBinding; remove only
          # the unsupported attribute, not the entire XML element.
          p = root / "app/src/main/res/layout/activity_home.xml"
          s = p.read_text(encoding="utf-8")
          s = s.replace(' android:useController="false"', '')
          p.write_text(s, encoding="utf-8")

          p = root / "app/src/main/java/com/orbital/iptv/ui/home/HomeActivity.kt"
          s = p.read_text(encoding="utf-8")
          s = s.replace('binding.root.findViewById<View>(R.id.tv_sidebar_time)?.let { (it as TextView).setTextColor(p.accent) }\n', '')
          s = s.replace('android.widget.HorizontalScrollView.LayoutParams(-1, (64*d).toInt())',
                        'ViewGroup.LayoutParams(-1, (64*d).toInt())')
          p.write_text(s, encoding="utf-8")

          p = root / "app/src/main/java/com/orbital/iptv/ui/player/PlayerActivity.kt"
          s = p.read_text(encoding="utf-8")
          if 'override fun onPause(){ super.onPause(); saveWatchHistory() }' in s:
              s = s.replace('''        if (isLive) {
            RecordingState.unregisterStopLiveTv()
        }
    }
''', '''        if (isLive) {
            RecordingState.unregisterStopLiveTv()
        }
        saveWatchHistory()
    }
''', 1)
              s = s.replace('    override fun onPause(){ super.onPause(); saveWatchHistory() }\n', '')
          p.write_text(s, encoding="utf-8")

          p = root / "app/src/main/java/com/orbital/iptv/ui/series/SeriesActivity.kt"
          s = p.read_text(encoding="utf-8")
          if 'import com.orbital.iptv.R' not in s:
              s = s.replace('import com.orbital.iptv.databinding.ActivitySeriesBinding\n',
                            'import com.orbital.iptv.databinding.ActivitySeriesBinding\nimport com.orbital.iptv.R\n')
          s = s.replace('import com.orbital.iptv.utils.WatchHistoryManager.Section\n',
                        'import com.orbital.iptv.utils.MainSidebarController.Section\n')
          p.write_text(s, encoding="utf-8")

          p = root / "app/src/main/java/com/orbital/iptv/ui/series/SeriesDetailActivity.kt"
          s = p.read_text(encoding="utf-8")
          if 'import com.orbital.iptv.utils.PrefsManager' not in s:
              s = s.replace('import com.orbital.iptv.utils.PlayerLauncher\n',
                            'import com.orbital.iptv.utils.PlayerLauncher\nimport com.orbital.iptv.utils.PrefsManager\n')
          p.write_text(s, encoding="utf-8")

          p = root / "app/src/main/java/com/orbital/iptv/ui/vod/VodActivity.kt"
          s = p.read_text(encoding="utf-8")
          if 'import com.orbital.iptv.R' not in s:
              s = s.replace('import com.orbital.iptv.databinding.ActivityVodBinding\n',
                            'import com.orbital.iptv.databinding.ActivityVodBinding\nimport com.orbital.iptv.R\n')
          s = s.replace('import com.orbital.iptv.ui.settings.SettingsActivity.Section\n',
                        'import com.orbital.iptv.utils.MainSidebarController.Section\n')
          s = s.replace('com.orbital.iptv.com.orbital.iptv.R.id.tv_header_datetime', 'R.id.tv_header_datetime')
          p.write_text(s, encoding="utf-8")

          p = root / "app/src/main/java/com/orbital/iptv/ui/users/ListUsersActivity.kt"
          s = p.read_text(encoding="utf-8")
          s = s.replace('''card.addView(host, LinearLayout.LayoutParams
            .apply { topMargin=(3*density).toInt() })
        card.addView(username, LinearLayout.LayoutParams
            .apply { topMargin=(3*density).toInt() })
        card.addView(password, LinearLayout.LayoutParams
            .apply { topMargin=(3*density).toInt() })
''', '''card.addView(host, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT).also { it.topMargin=(3*density).toInt() })
        card.addView(username, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT).also { it.topMargin=(3*density).toInt() })
        card.addView(password, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT).also { it.topMargin=(3*density).toInt() })
''')
          p.write_text(s, encoding="utf-8")

          p = root / "app/src/main/java/com/orbital/iptv/utils/WatchHistoryManager.kt"
          p.write_text(r'''package com.orbital.iptv.utils

import android.content.Context
import com.google.gson.Gson
import com.google.gson.reflect.TypeToken

data class WatchHistoryItem(
    val id: String,
    val type: String,
    val title: String,
    val artUrl: String = "",
    val streamUrl: String = "",
    val streamId: Int = -1,
    val positionMs: Long = 0L,
    val durationMs: Long = 0L,
    val updatedAt: Long = System.currentTimeMillis()
)

object WatchHistoryManager {
    private const val PREFS = "se_watch_history"
    private const val KEY = "items"
    private const val MAX = 15
    private val gson = Gson()
    private val listType = object : TypeToken<List<WatchHistoryItem>>() {}.type

    private fun prefs(c: Context) = c.getSharedPreferences(PREFS, Context.MODE_PRIVATE)

    private fun load(c: Context): List<WatchHistoryItem> {
        val raw = prefs(c).getString(KEY, null) ?: return emptyList()
        return try {
            gson.fromJson<List<WatchHistoryItem>>(raw, listType) ?: emptyList()
        } catch (_: Exception) {
            emptyList()
        }
    }

    fun get(c: Context, type: String): List<WatchHistoryItem> {
        return load(c)
            .filter { it.type == type }
            .sortedByDescending { it.updatedAt }
            .take(MAX)
    }

    fun record(c: Context, item: WatchHistoryItem) {
        val list = load(c).filterNot { it.id == item.id }.toMutableList()
        list.add(0, item.copy(updatedAt = System.currentTimeMillis()))
        prefs(c).edit().putString(KEY, gson.toJson(list.take(100), listType)).apply()
    }

    fun update(c: Context, id: String, pos: Long, dur: Long) {
        val list = load(c).toMutableList()
        val index = list.indexOfFirst { it.id == id }
        if (index >= 0) {
            list[index] = list[index].copy(
                positionMs = pos,
                durationMs = dur,
                updatedAt = System.currentTimeMillis()
            )
            prefs(c).edit().putString(KEY, gson.toJson(list, listType)).apply()
        }
    }

    fun remove(c: Context, id: String) {
        val list = load(c).filterNot { it.id == id }
        prefs(c).edit().putString(KEY, gson.toJson(list, listType)).apply()
    }

    fun clear(c: Context) {
        prefs(c).edit().clear().apply()
    }
}
''', encoding="utf-8")
          PY

      - name: Static source sanity check
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          test -f app/src/main/AndroidManifest.xml
          test -f app/build.gradle || test -f app/build.gradle.kts

          echo "=== Application ID ==="
          grep -RIn --include='*.gradle' --include='*.gradle.kts' 'applicationId' app || true

          echo "=== Version declarations ==="
          grep -RIn --include='*.gradle' --include='*.gradle.kts' --include='*.xml' \
            -E 'versionName|versionCode' app | head -n 50 || true

          echo "=== Key SE UI/source markers ==="
          grep -RIn --exclude-dir=.gradle --exclude-dir=build \
            -E 'SE IPTV PLAYER|Favorites|Downloads|Recordings|Open With|ADD USER|Disconnect Provider|Clear watch history|Clear Favorite|Reset app' \
            app/src/main | head -n 200 || true

      - name: Kotlin and Cast compatibility
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail

          # The uploaded source uses Kotlin 1.9.x. Some Cast dependencies can
          # otherwise pull Kotlin 2.1 metadata, which the compiler cannot read.
          while IFS= read -r -d '' f; do
            sed -i 's/22\\.1\\.0/22.0.0/g' "$f"
          done < <(grep -RIlz --exclude-dir=.gradle --exclude-dir=build \
            'play-services-cast-framework' . || true)

          cat > cast-compat.init.gradle <<'EOF'
          allprojects {
            configurations.configureEach {
              resolutionStrategy.eachDependency { details ->
                if (details.requested.group == "com.google.android.gms" &&
                    (details.requested.name == "play-services-cast-framework" ||
                     details.requested.name == "play-services-cast")) {
                  details.useVersion("22.0.0")
                }
                if (details.requested.group == "org.jetbrains.kotlin" &&
                    details.requested.name.startsWith("kotlin-stdlib")) {
                  details.useVersion("1.9.25")
                }
              }
            }
          }
          EOF

      - name: Gradle build
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew -I cast-compat.init.gradle clean assembleRelease --stacktrace --no-daemon

      - name: Verify APK
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          echo "APK=$APK"
          ls -lh "$APK"

      - name: Package source snapshot
        shell: bash
        run: |
          set -euo pipefail
          zip -qr SEAndroid_v2.0.1-source-built.zip project \
            -x 'project/.gradle/*' \
               'project/**/build/*' \
               'project/.idea/*' \
               'project/signing/*'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SEAndroid_v2.0.1-APK
          path: project/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: SEAndroid_v2.0.1-SOURCE
          path: SEAndroid_v2.0.1-source-built.zip
          retention-days: 30
