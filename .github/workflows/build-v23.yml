name: Build SEAndroid v100.0.23

on:
  push:
    branches:
      - v100.0.23
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore missing base files from v100.0.17
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10834906043/zip" -o /tmp/v17.zip
          mkdir -p /tmp/v17
          unzip -q /tmp/v17.zip -d /tmp/v17
          SRC="$(find /tmp/v17 -type f -name 'SEAndroid_v100.0.17-source.zip' | head -1)"
          test -n "${SRC}"
          mkdir -p /tmp/base
          unzip -q "${SRC}" -d /tmp/base
          rsync -a --ignore-existing /tmp/base/ ./
          test -f gradlew
          chmod +x gradlew

      - name: Apply SE Player download control
        run: python3 scripts/apply_player_download.py

      - name: Prepare v100.0.23
        run: |
          set -e
          perl -0pi -e 's/versionCode\s+\d+/versionCode 1000023/' app/build.gradle
          perl -0pi -e 's/versionName\s+"[^"]+"/versionName "100.0.23"/' app/build.gradle
          cat > settings.gradle <<'EOF'
rootProject.name = "SEAndroid_v100.0.23"
include ':app'
EOF
          sed -E -i 's/V100\.0\.[0-9]+/V100.0.23/g' app/src/main/res/layout/activity_settings.xml 2>/dev/null || true
          rm -f app/src/main/res/drawable/se_logo_full.png
          rm -f app/src/main/res/drawable/se_launcher.png
          rm -f app/src/main/res/drawable/se_launcher_foreground.xml
          mkdir -p app/src/main/res/drawable
          cp build_payload/app_logo.webp app/src/main/res/drawable/app_logo.webp
          cp build_payload/xtream_logo.webp app/src/main/res/drawable/xtream_logo.webp
          grep -q 'versionCode 1000023' app/build.gradle
          grep -q 'versionName "100.0.23"' app/build.gradle
          grep -q 'SEAndroid_v100.0.23' settings.gradle

      - name: Verify v22 features
        run: |
          set -e
          grep -q 'PopupWindow' app/src/main/java/com/orbital/iptv/utils/SEKeyboardController.kt
          grep -q 'android.widget.ScrollView' app/src/main/java/com/orbital/iptv/ui/home/HomeActivity.kt
          grep -q 'R.layout.item_vod_movie' app/src/main/java/com/orbital/iptv/ui/home/HomeActivity.kt
          grep -q 'R.layout.item_series_show' app/src/main/java/com/orbital/iptv/ui/home/HomeActivity.kt
          grep -q 'heartView.setOnClickListener' app/src/main/java/com/orbital/iptv/ui/vod/VodActivity.kt
          grep -q 'heartView.setOnClickListener' app/src/main/java/com/orbital/iptv/ui/series/SeriesActivity.kt
          grep -q 'heartView.setOnClickListener' app/src/main/java/com/orbital/iptv/ui/home/HomeActivity.kt

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Package outputs
        run: |
          set -e
          mkdir -p out source-export
          cp app/build/outputs/apk/debug/app-debug.apk out/SEAndroid_v100.0.23.apk
          rsync -a --exclude='.git' --exclude='.gradle' --exclude='.idea' --exclude='app/build' --exclude='out' --exclude='source-export' --exclude='build_payload' ./ source-export/
          (cd source-export && zip -qr ../out/SEAndroid_v100.0.23-source.zip .)

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SEAndroid_v100.0.23-apk
          path: out/SEAndroid_v100.0.23.apk
          retention-days: 30

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: SEAndroid_v100.0.23-source
          path: out/SEAndroid_v100.0.23-source.zip
          retention-days: 30
