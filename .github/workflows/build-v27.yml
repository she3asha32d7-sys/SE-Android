name: SEAndroid v100.0.27 Build

on:
  push:
    branches:
      - v100.0.27
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Set V100.0.27
        run: |
          set -e
          perl -0pi -e 's/versionCode\s+\d+/versionCode 1000027/' app/build.gradle
          perl -0pi -e 's/versionName\s+"[^"]+"/versionName "100.0.27"/' app/build.gradle
          printf '%s\n' 'rootProject.name = "SEAndroid_v100.0.27"' "include ':app'" > settings.gradle
          grep -q 'versionCode 1000027' app/build.gradle
          grep -q 'versionName "100.0.27"' app/build.gradle
      - name: Assemble Debug APK
        run: ./gradlew clean assembleDebug --no-daemon --stacktrace
      - name: Package
        run: |
          set -e
          mkdir -p out source
          cp app/build/outputs/apk/debug/app-debug.apk out/SEAndroid_v100.0.27.apk
          rsync -a --exclude='.git' --exclude='.gradle' --exclude='.idea' --exclude='app/build' --exclude='out' --exclude='source' ./ source/
          (cd source && zip -qr ../out/SEAndroid_v100.0.27-source.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: SEAndroid_v100.0.27-apk
          path: out/SEAndroid_v100.0.27.apk
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: SEAndroid_v100.0.27-source
          path: out/SEAndroid_v100.0.27-source.zip
          retention-days: 30
