name: SEAndroid v100.0.28 Build

on:
  push:
    branches:
      - v100.0.28
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Restore verified V100.0.25 source
        run: |
          set -e
          mkdir -p /tmp/base
          curl -fL "https://sdmntprnortheu.oaiusercontent.com/files/00000000-f7b0-81f4-8ac9-de265bb4bbd5/raw?se=2026-09-26T15%3A07%3A21Z&sp=r&sv=2026-02-06&sr=b&scid=4b161e13-9b65-59b2-96d8-73db7ba4e764&skoid=e5f84a89-964a-4fd3-92c2-c2cb3a12ea16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-26T05%3A57%3A45Z&ske=2026-09-27T05%3A57%3A45Z&sks=b&skv=2026-02-06&sig=uD9knRuvYo8o8lQb0L75kWyry0obGNtn44gp1towHHQ%3D" -o /tmp/v25.zip
          unzip -q /tmp/v25.zip -d /tmp/v25outer
          SRC=$(find /tmp/v25outer -type f -name 'SEAndroid_v100.0.25-source.zip' | head -1)
          test -n "$SRC"
          unzip -q "$SRC" -d /tmp/base
          rsync -a /tmp/base/ ./
          chmod +x gradlew
          test -f gradlew
          test -f app/src/main/java/com/orbital/iptv/ui/player/PlayerActivity.kt

      - name: Apply V100.0.26 changes
        run: python3 scripts/apply_v26.py

      - name: Apply V100.0.28 multi-engine integration
        run: python3 scripts/apply_multiengine_v28.py

      - name: Validate multi-engine source
        run: |
          set -e
          grep -q 'compileSdk 36' app/build.gradle
          grep -q 'com.android.tools.build:gradle:8.10.0' build.gradle
          grep -q 'gradle-8.11.1-bin.zip' gradle/wrapper/gradle-wrapper.properties
          grep -q 'org.videolan.android:libvlc-all:3.5.1' app/build.gradle
          grep -q 'dev.jdtech.mpv:libmpv:1.0.0' app/build.gradle
          test -f app/src/main/java/com/orbital/iptv/ui/player/PlaybackEngine.kt
          test -f app/src/main/java/com/orbital/iptv/ui/player/VlcPlaybackEngine.kt
          test -f app/src/main/java/com/orbital/iptv/ui/player/MpvPlaybackEngine.kt
          test -f app/src/main/java/com/orbital/iptv/ui/player/EnginePlayerActivity.kt
          grep -q 'PlayerType.VLC' app/src/main/java/com/orbital/iptv/ui/player/EnginePlayerActivity.kt
          grep -q 'PlayerType.MPV' app/src/main/java/com/orbital/iptv/ui/player/EnginePlayerActivity.kt
          test ! -e app/src/main/java/com/orbital/iptv/utils/SEKeyboardController.kt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble Debug APK
        run: ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Package
        run: |
          set -e
          mkdir -p out source
          cp app/build/outputs/apk/debug/app-debug.apk out/SEAndroid_v100.0.28.apk
          rsync -a \
            --exclude='.git' \
            --exclude='.gradle' \
            --exclude='.idea' \
            --exclude='app/build' \
            --exclude='out' \
            --exclude='source' \
            --exclude='.github' \
            --exclude='scripts' \
            ./ source/
          (cd source && zip -qr ../out/SEAndroid_v100.0.28-source.zip .)

      - uses: actions/upload-artifact@v4
        with:
          name: SEAndroid_v100.0.28-apk
          path: out/SEAndroid_v100.0.28.apk
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: SEAndroid_v100.0.28-source
          path: out/SEAndroid_v100.0.28-source.zip
          retention-days: 30
