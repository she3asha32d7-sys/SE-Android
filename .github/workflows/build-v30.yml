name: SEAndroid v100.0.30 Build

on:
  push:
    branches:
      - v100.0.30
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Restore verified V100.0.25 source
        run: |
          set -e
          mkdir -p /tmp/base /tmp/v25outer
          curl -fL "https://sdmntprnortheu.oaiusercontent.com/files/00000000-f1bc-81f4-b831-f4d609f6be4a/raw?se=2026-09-26T15%3A37%3A53Z&sp=r&sv=2026-02-06&sr=b&scid=c3289b5b-744f-5499-9490-0731a5569b0e&skoid=e5f84a89-964a-4fd3-92c2-c2cb3a12ea16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-26T08%3A03%3A51Z&ske=2026-09-27T08%3A03%3A51Z&sks=b&skv=2026-02-06&sig=xEzT2ybygsX%2BdW50v/FTsSsm9Y6cEnDG2Nmr3vFOs68%3D" -o /tmp/v25.zip
          unzip -q /tmp/v25.zip -d /tmp/v25outer
          SRC=$(find /tmp/v25outer -type f -name 'SEAndroid_v100.0.25-source.zip' | head -1)
          test -n "$SRC"
          unzip -q "$SRC" -d /tmp/base
          rsync -a /tmp/base/ ./
          chmod +x gradlew
          test -f gradlew
          test -f app/src/main/java/com/orbital/iptv/ui/player/PlayerActivity.kt

      - name: Apply V100.0.26 changes
        run: python3 scripts/apply_v26.py

      - name: Apply base multi-engine integration V100.0.28
        run: python3 scripts/apply_multiengine_v28.py

      - name: Apply V100.0.29 VLC baseline
        run: python3 scripts/fix_vlc_v29.py

      - name: Apply V100.0.30 VLC fix
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/src/main/java/com/orbital/iptv/ui/player/VlcPlaybackEngine.kt")
          target = r'''package com.orbital.iptv.ui.player

import android.content.Context
import android.net.Uri
import android.os.Handler
import android.os.Looper
import android.util.Log
import android.view.ViewGroup
import android.widget.FrameLayout
import org.videolan.libvlc.LibVLC
import org.videolan.libvlc.Media
import org.videolan.libvlc.MediaPlayer
import org.videolan.libvlc.util.VLCVideoLayout
import java.io.File

/**
 * LibVLC playback adapter based on MaterialTV's lifecycle pattern, with an extra
 * hardware->software decoder retry for IPTV devices where HW output fails.
 */
class VlcPlaybackEngine(private val context: Context) : PlaybackEngine {

    private var libVlc: LibVLC? = null
    private var mediaPlayer: MediaPlayer? = null
    private var videoLayout: VLCVideoLayout? = null
    private var currentContainer: ViewGroup? = null
    private var buffering = false
    private var pendingStartPosition = -1L
    private var currentUrl: String? = null
    private var currentStartPosition = 0L
    private var softwareDecoder = true
    private var released = false

    private var stateCallback: ((Boolean, Boolean) -> Unit)? = null
    private var endedCallback: (() -> Unit)? = null
    private var errorCallback: ((Throwable) -> Unit)? = null

    private val handler = Handler(Looper.getMainLooper())

    override fun initialize() {
        released = false
        val args = arrayListOf(
            "--network-caching=1000",
            "--file-caching=300",
            "--http-reconnect",
            "--rtsp-tcp",
            "--no-stats",
            "--no-osd",
            "--no-video-title-show",
            "--drop-late-frames",
            "--skip-frames"
        )
        try {
            libVlc = LibVLC(context.applicationContext, args)
            mediaPlayer = MediaPlayer(libVlc).apply {
                videoScale = MediaPlayer.ScaleType.SURFACE_BEST_FIT
                setEventListener { event ->
                    when (event.type) {
                        MediaPlayer.Event.Opening -> {
                            buffering = true
                            log("Opening")
                            stateCallback?.invoke(false, true)
                        }
                        MediaPlayer.Event.Buffering -> {
                            buffering = event.buffering < 100f
                            log("Buffering " + event.buffering + "%")
                            stateCallback?.invoke(isPlayingSafe(), buffering)
                        }
                        MediaPlayer.Event.Playing -> {
                            buffering = false
                            log("Playing")
                            applyPendingSeek()
                            stateCallback?.invoke(true, false)
                        }
                        MediaPlayer.Event.Paused -> {
                            buffering = false
                            log("Paused")
                            stateCallback?.invoke(false, false)
                        }
                        MediaPlayer.Event.Stopped -> {
                            buffering = false
                            log("Stopped")
                            stateCallback?.invoke(false, false)
                        }
                        MediaPlayer.Event.EndReached -> {
                            buffering = false
                            log("EndReached")
                            endedCallback?.invoke()
                            stateCallback?.invoke(false, false)
                        }
                        MediaPlayer.Event.EncounteredError -> {
                            buffering = false
                            log("EncounteredError; softwareDecoder=" + softwareDecoder)
                            errorCallback?.invoke(Exception("VLC playback error"))
                            stateCallback?.invoke(false, false)
                        }
                        else -> Unit
                    }
                }
            }
        } catch (t: Throwable) {
            log("initialize failed: " + t)
            errorCallback?.invoke(t)
            throw t
        }
    }

    override fun attach(container: ViewGroup) {
        currentContainer = container
        if (videoLayout != null && videoLayout?.parent === container) {
            videoLayout?.requestLayout()
            return
        }
        detachViews()
        val layout = VLCVideoLayout(context).apply {
            layoutParams = FrameLayout.LayoutParams(
                FrameLayout.LayoutParams.MATCH_PARENT,
                FrameLayout.LayoutParams.MATCH_PARENT
            )
        }
        container.addView(layout)
        videoLayout = layout
        try {
            mediaPlayer?.attachViews(layout, null, false, false)
            log("attachViews success")
        } catch (t: Throwable) {
            log("attachViews failed: " + t)
            errorCallback?.invoke(t)
        }
    }

    private fun detachViews() {
        try { mediaPlayer?.detachViews() } catch (t: Throwable) { log("detachViews: " + t.message) }
        videoLayout?.let { (it.parent as? ViewGroup)?.removeView(it) }
        videoLayout = null
    }

    override fun prepare(url: String, startPositionMs: Long) {
        currentUrl = url
        currentStartPosition = startPositionMs.coerceAtLeast(0L)
        pendingStartPosition = currentStartPosition.takeIf { it > 0L } ?: -1L
        // V30 starts VLC in software-decoding mode. This avoids the V29
        // hardware->software retry loop that repeatedly disturbed the video surface.
        softwareDecoder = true
        loadMedia(url, currentStartPosition, useHardware = false)
    }

    private fun loadMedia(url: String, startPositionMs: Long, useHardware: Boolean) {
        val vlc = libVlc ?: return
        try {
            mediaPlayer?.stop()
        } catch (_: Throwable) {}

        val isNetwork = url.startsWith("http://", true) || url.startsWith("https://", true)
        val media = when {
            isNetwork -> Media(vlc, Uri.parse(url))
            url.startsWith("content://", true) -> Media(vlc, Uri.parse(url))
            url.startsWith("file://", true) -> Media(vlc, Uri.parse(url))
            else -> Media(vlc, Uri.fromFile(File(url)))
        }.apply {
            if (startPositionMs > 0L) {
                addOption(":start-time=" + (startPositionMs / 1000L))
            }
            if (useHardware) {
                setHWDecoderEnabled(true, false)
            } else {
                setHWDecoderEnabled(false, false)
                addOption(":avcodec-hw=none")
                addOption(":no-mediacodec-dr")
                addOption(":no-omxil-dr")
            }

            if (isNetwork) {
                addOption(":network-caching=1000")
                addOption(":http-reconnect=true")
                addOption(":http-user-agent=Mozilla/5.0 (Linux; Android) AppleWebKit/537.36 Chrome/121 Safari/537.36")
            } else {
                addOption(":file-caching=300")
            }
        }

        try {
            mediaPlayer?.media = media
            log("media assigned, hardware=" + useHardware + ", url=" + sanitize(url))
        } catch (t: Throwable) {
            log("media assignment failed: " + t)
            errorCallback?.invoke(t)
        } finally {
            media.release()
        }

        // Do not call play() from prepare(). EnginePlayerActivity calls play() after
        // prepare(), and V29 was effectively issuing two play() calls. Keeping media
        // preparation and playback as separate operations also prevents a race with
        // the VLC video-output lifecycle.
        stateCallback?.invoke(false, true)
        log("media prepared, waiting for explicit play(); software=" + !useHardware)
    }

    private fun applyPendingSeek() {
        val target = pendingStartPosition
        if (target < 0L) return
        pendingStartPosition = -1L
        handler.post {
            try {
                mediaPlayer?.time = target
                val len = mediaPlayer?.length ?: 0L
                if (len > 0L) {
                    mediaPlayer?.position = (target.toDouble() / len.toDouble()).coerceIn(0.0, 1.0).toFloat()
                }
            } catch (t: Throwable) {
                log("pending seek failed: " + t.message)
            }
        }
    }

    private fun isPlayingSafe(): Boolean = try {
        mediaPlayer?.isPlaying == true
    } catch (_: Throwable) {
        false
    }

    private fun log(message: String) {
        Log.d("SE_VLC", message)
    }

    private fun sanitize(url: String): String {
        return try {
            url.substringBefore('|').take(160)
        } catch (_: Throwable) {
            "<url>"
        }
    }

    override fun play() {
        if (released) return
        try {
            mediaPlayer?.play()
            stateCallback?.invoke(false, true)
            log("play() dispatched")
        } catch (t: Throwable) {
            log("play() failed: " + t)
            errorCallback?.invoke(t)
        }
    }
    override fun pause() { try { mediaPlayer?.pause() } catch (t: Throwable) { errorCallback?.invoke(t) } }
    override fun stop() { try { mediaPlayer?.stop() } catch (_: Throwable) {} }
    override fun seekTo(positionMs: Long) { pendingStartPosition = -1L; try { mediaPlayer?.time = positionMs.coerceAtLeast(0L) } catch (_: Throwable) {} }
    override fun seekBack(stepMs: Long) { seekTo((getCurrentPosition() - stepMs).coerceAtLeast(0L)) }
    override fun seekForward(stepMs: Long) {
        val duration = getDuration()
        val target = getCurrentPosition() + stepMs
        seekTo(if (duration > 0L) target.coerceAtMost(duration) else target)
    }
    override fun isPlaying(): Boolean = isPlayingSafe()
    override fun isBuffering(): Boolean = buffering
    override fun getDuration(): Long = try { mediaPlayer?.length ?: 0L } catch (_: Throwable) { 0L }
    override fun getCurrentPosition(): Long = try { mediaPlayer?.time ?: 0L } catch (_: Throwable) { 0L }
    override fun setVolume(volume: Float) { try { mediaPlayer?.volume = (volume * 100f).toInt().coerceIn(0, 100) } catch (_: Throwable) {} }
    override fun setPlaybackSpeed(speed: Float) { try { mediaPlayer?.rate = speed.coerceIn(0.25f, 4f) } catch (_: Throwable) {} }
    override fun getPlaybackSpeed(): Float = try { mediaPlayer?.rate ?: 1f } catch (_: Throwable) { 1f }
    override fun setOnStateChanged(callback: (Boolean, Boolean) -> Unit) { stateCallback = callback }
    override fun setOnEnded(callback: () -> Unit) { endedCallback = callback }
    override fun setOnError(callback: (Throwable) -> Unit) { errorCallback = callback }

    fun reattach() {
        val container = currentContainer ?: return
        attach(container)
    }

    override fun release() {
        released = true
        handler.removeCallbacksAndMessages(null)
        try { mediaPlayer?.stop() } catch (_: Throwable) {}
        try { mediaPlayer?.setEventListener(null) } catch (_: Throwable) {}
        try { mediaPlayer?.detachViews() } catch (_: Throwable) {}
        try { mediaPlayer?.release() } catch (_: Throwable) {}
        try { libVlc?.release() } catch (_: Throwable) {}
        mediaPlayer = null
        libVlc = null
        detachViews()
        currentContainer = null
        currentUrl = null
        pendingStartPosition = -1L
    }
}
'''
          p.write_text(target)

          g = Path("app/build.gradle")
          s = g.read_text()
          s = re.sub(r'versionCode\s+\d+', 'versionCode 1000030', s, count=1)
          s = re.sub(r'versionName\s+"[^"]+"', 'versionName "100.0.30"', s, count=1)
          g.write_text(s)
          PY

      - name: Validate V100.0.30
        run: |
          set -e
          grep -q 'versionCode 1000030' app/build.gradle
          grep -q 'versionName "100.0.30"' app/build.gradle
          grep -q 'softwareDecoder = true' app/src/main/java/com/orbital/iptv/ui/player/VlcPlaybackEngine.kt
          grep -q 'setHWDecoderEnabled(false, false)' app/src/main/java/com/orbital/iptv/ui/player/VlcPlaybackEngine.kt
          grep -q ':avcodec-hw=none' app/src/main/java/com/orbital/iptv/ui/player/VlcPlaybackEngine.kt
          grep -q ':no-mediacodec-dr' app/src/main/java/com/orbital/iptv/ui/player/VlcPlaybackEngine.kt
          grep -q ':no-omxil-dr' app/src/main/java/com/orbital/iptv/ui/player/VlcPlaybackEngine.kt
          ! grep -q 'Retrying VLC with software decoder' app/src/main/java/com/orbital/iptv/ui/player/VlcPlaybackEngine.kt
          ! grep -q 'softwareRetryUsed' app/src/main/java/com/orbital/iptv/ui/player/VlcPlaybackEngine.kt
          grep -q 'Do not call play() from prepare()' app/src/main/java/com/orbital/iptv/ui/player/VlcPlaybackEngine.kt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble Debug APK
        run: ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Package outputs
        run: |
          set -e
          mkdir -p out source
          cp app/build/outputs/apk/debug/app-debug.apk out/SEAndroid_v100.0.30.apk
          rsync -a \
            --exclude='.git' \
            --exclude='.gradle' \
            --exclude='.idea' \
            --exclude='app/build' \
            --exclude='out' \
            --exclude='source' \
            --exclude='.github' \
            --exclude='scripts' \
            ./ source/
          (cd source && zip -qr ../out/SEAndroid_v100.0.30-source.zip .)

      - uses: actions/upload-artifact@v4
        with:
          name: SEAndroid_v100.0.30-apk
          path: out/SEAndroid_v100.0.30.apk
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: SEAndroid_v100.0.30-source
          path: out/SEAndroid_v100.0.30-source.zip
          retention-days: 30
