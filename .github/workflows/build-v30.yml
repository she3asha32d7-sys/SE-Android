name: SEAndroid v100.0.30 Build

on:
  push:
    branches:
      - v100.0.30
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Restore verified V100.0.29 source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p /tmp/v29outer /tmp/base
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10909446836/zip" -o /tmp/v29.zip
          unzip -q /tmp/v29.zip -d /tmp/v29outer
          SRC=$(find /tmp/v29outer -type f -name 'SEAndroid_v100.0.29-source.zip' | head -1)
          test -n "${SRC}"
          unzip -q "${SRC}" -d /tmp/base
          rsync -a /tmp/base/ ./
          chmod +x gradlew
          test -f gradlew
          test -f app/src/main/java/com/orbital/iptv/ui/player/PlayerActivity.kt

      - name: Apply V100.0.30 VLC fix
        run: python3 scripts/apply_v30.py

      - name: Validate V100.0.30
        run: |
          set -e
          grep -q 'versionCode 1000030' app/build.gradle
          grep -q 'versionName "100.0.30"' app/build.gradle
          grep -q 'private var softwareDecoder = true' app/src/main/java/com/orbital/iptv/ui/player/VlcPlaybackEngine.kt
          grep -q 'setHWDecoderEnabled(false, false)' app/src/main/java/com/orbital/iptv/ui/player/VlcPlaybackEngine.kt
          grep -q ':avcodec-hw=none' app/src/main/java/com/orbital/iptv/ui/player/VlcPlaybackEngine.kt
          grep -q ':no-mediacodec-dr' app/src/main/java/com/orbital/iptv/ui/player/VlcPlaybackEngine.kt
          grep -q ':no-omxil-dr' app/src/main/java/com/orbital/iptv/ui/player/VlcPlaybackEngine.kt
          ! grep -q 'Retrying VLC with software decoder' app/src/main/java/com/orbital/iptv/ui/player/VlcPlaybackEngine.kt
          ! grep -q 'softwareRetryUsed' app/src/main/java/com/orbital/iptv/ui/player/VlcPlaybackEngine.kt
          grep -q 'Do not call play() from prepare()' app/src/main/java/com/orbital/iptv/ui/player/VlcPlaybackEngine.kt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble Debug APK
        run: ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Package outputs
        run: |
          set -e
          mkdir -p out source
          cp app/build/outputs/apk/debug/app-debug.apk out/SEAndroid_v100.0.30.apk
          rsync -a --exclude='.git' --exclude='.gradle' --exclude='.idea' --exclude='app/build' --exclude='out' --exclude='source' --exclude='.github' --exclude='scripts' ./ source/
          (cd source && zip -qr ../out/SEAndroid_v100.0.30-source.zip .)

      - uses: actions/upload-artifact@v4
        with:
          name: SEAndroid_v100.0.30-apk
          path: out/SEAndroid_v100.0.30.apk
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: SEAndroid_v100.0.30-source
          path: out/SEAndroid_v100.0.30-source.zip
          retention-days: 30
