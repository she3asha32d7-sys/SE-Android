name: SEAndroid v100.0.51 PR Build
on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Restore base source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p /tmp/v17 /tmp/base
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10834906043/zip"             -o /tmp/v17.zip
          unzip -q /tmp/v17.zip -d /tmp/v17
          SRC=$(find /tmp/v17 -type f -name 'SEAndroid_v100.0.17-source.zip' | head -1)
          test -n "$SRC"
          unzip -q "$SRC" -d /tmp/base
          rsync -a /tmp/base/ ./
          chmod +x gradlew

      - name: Restore exact v51 build tree
        run: |
          set -e
          : > /tmp/v51_overlay.tar.xz
          for f in build_payload/v51_overlay_part*.b64; do
            base64 -d "$f" >> /tmp/v51_overlay.tar.xz
          done
          printf '%s  %s\n' '4233346198cade37720e35112f4304567477c9bfafdcf55b4cd85d9834edbce7' '/tmp/v51_overlay.tar.xz' | sha256sum -c -
          tar -xJf /tmp/v51_overlay.tar.xz -C .
          rm -f app/src/main/res/drawable/se_launcher.png                 app/src/main/res/drawable/se_launcher_foreground.xml                 app/src/main/res/drawable/se_logo_full.png

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk >/dev/null

      - name: Package
        run: |
          set -e
          mkdir -p out source
          cp app/build/outputs/apk/debug/app-debug.apk out/SE-Android-V100.0.51-debug.apk
          rsync -a --exclude='.git' --exclude='.gradle' --exclude='.idea' --exclude='app/build' --exclude='build_payload' --exclude='out' --exclude='source' ./ source/
          (cd source && zip -qr ../out/SE-Android-V100.0.51-source-reconstructed.zip .)

      - uses: actions/upload-artifact@v4
        with:
          name: SE-Android-v100.0.51-debug-apk
          path: out/SE-Android-V100.0.51-debug.apk
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: SE-Android-v100.0.51-source-reconstructed
          path: out/SE-Android-V100.0.51-source-reconstructed.zip
          retention-days: 30
