name: SEAndroid v100.0.59 Build

on:
  push:
    branches:
      - v100.0.59
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Restore V100.0.17 base source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/v17 /tmp/base
          curl -fsSL             -H "Authorization: Bearer ${GH_TOKEN}"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10834906043/zip"             -o /tmp/v17-artifact.zip
          unzip -q /tmp/v17-artifact.zip -d /tmp/v17
          SRC=$(find /tmp/v17 -type f -name 'SEAndroid_v100.0.17-source.zip' | head -1)
          test -n "${SRC}"
          unzip -q "${SRC}" -d /tmp/base
          rsync -a /tmp/base/ ./
          chmod +x gradlew

      - name: Apply V59 carrier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL             -H "Authorization: Bearer ${GH_TOKEN}"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/830056c3497a731433bb81da0c171d379b629f4a"             | jq -r .content | base64 -d | tr -d '\n' | base64 -d > /tmp/v59-carrier.gz
          gzip -dc /tmp/v59-carrier.gz | tar -xf - -C .
          test -s DELETE.txt
          while IFS= read -r p; do
            [ -z "${p}" ] || rm -f -- "${p}"
          done < DELETE.txt
          rm -f DELETE.txt

      - name: Apply V59 completion fix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL             -H "Authorization: Bearer ${GH_TOKEN}"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/e7b8320dab7fb316441c3cb1eaba12f903842804"             | jq -r .content | base64 -d | tr -d '\n' | base64 -d > /tmp/v59-fix.xz
          tar -xJf /tmp/v59-fix.xz --strip-components=1 -C .
          test -s DELETE.txt
          while IFS= read -r p; do
            [ -z "${p}" ] || rm -f -- "${p}"
          done < DELETE.txt
          rm -f DELETE.txt

      - name: Normalize Android XML for compile
        run: |
          set -euo pipefail
          sed -i '/android:showSoftInputOnFocus="true"/d'             app/src/main/res/layout/activity_login.xml             app/src/main/res/layout/activity_emby_login.xml             app/src/main/res/layout/activity_plex_login.xml

      - name: Apply V59 Kotlin compile fixes
        run: |
          set -euo pipefail
          sed -i 's/private fun ensureFocusedFieldVisible(scrollView: View,/private fun ensureFocusedFieldVisible(scrollView: android.widget.ScrollView,/' app/src/main/java/com/orbital/iptv/ui/login/LoginActivity.kt
          sed -i '/private companion object RecorderRequests {/,/^[[:space:]]*}[[:space:]]*$/d' app/src/main/java/com/orbital/iptv/ui/player/PlayerActivity.kt
          sed -i '/private const val MAX_AUDIO_SINK_ERRORS = 8/a\        private const val REQUEST_RECORD_AUDIO = 7402\n        private const val REQUEST_MEDIA_PROJECTION = 7403' app/src/main/java/com/orbital/iptv/ui/player/PlayerActivity.kt
          sed -i '/import kotlinx.coroutines.CancellationException/a\import kotlinx.coroutines.currentCoroutineContext\nimport kotlinx.coroutines.ensureActive' app/src/main/java/com/orbital/iptv/utils/DownloadWorker.kt
          sed -i 's/^[[:space:]]*ensureActive()/                        currentCoroutineContext().ensureActive()/' app/src/main/java/com/orbital/iptv/utils/DownloadWorker.kt
          grep -n 'REQUEST_RECORD_AUDIO\|REQUEST_MEDIA_PROJECTION' app/src/main/java/com/orbital/iptv/ui/player/PlayerActivity.kt
          grep -n 'currentCoroutineContext' app/src/main/java/com/orbital/iptv/utils/DownloadWorker.kt
          grep -n 'ensureFocusedFieldVisible(scrollView' app/src/main/java/com/orbital/iptv/ui/login/LoginActivity.kt | tail -1

      - name: Restore executable Gradle wrapper
        run: chmod +x gradlew

      - name: Verify reconstructed V59 source
        run: |
          set -euo pipefail
          grep -Eq 'versionName[[:space:]]*["'\''"]100\.0\.59["'\''"]' app/build.gradle
          test -f app/src/main/java/com/orbital/iptv/recording/PlayerScreenRecorder.kt
          test -f app/src/main/java/com/orbital/iptv/utils/InlineSearchController.kt
          test -f app/src/main/java/com/orbital/iptv/ui/search/SearchAdapter.kt
          test ! -f app/src/main/java/com/orbital/iptv/utils/SEKeyboardController.kt
          COUNT=$(find . -type f \
            -not -path './.git/*' \
            -not -path './.gradle/*' \
            -not -path './app/build/*' \
            -not -path './build_payload/*' \
            -not -path './out/*' \
            -not -path './source/*' \
            -not -path './.github/workflows/build-v59.yml' | wc -l)
          echo "Reconstructed source file count: ${COUNT}"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk >/dev/null

      - name: Package delivery
        run: |
          set -euo pipefail
          mkdir -p out source
          cp app/build/outputs/apk/debug/app-debug.apk out/SE-Android-V100.0.59-debug.apk
          rsync -a             --exclude='.git'             --exclude='.gradle'             --exclude='.idea'             --exclude='app/build'             --exclude='build_payload'             --exclude='out'             --exclude='source'             --exclude='.github/workflows/build-v59.yml'             ./ source/
          (cd source && zip -qr ../out/SE-Android-V100.0.59-source-reconstructed.zip .)

      - uses: actions/upload-artifact@v4
        with:
          name: SE-Android-v100.0.59-debug-apk
          path: out/SE-Android-V100.0.59-debug.apk
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: SE-Android-v100.0.59-source-reconstructed
          path: out/SE-Android-V100.0.59-source-reconstructed.zip
          retention-days: 30
