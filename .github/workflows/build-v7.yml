name: SEAndroid v100.0.7 Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout clean repository
        uses: actions/checkout@v4

      - name: Download the verified v100.0.6 source artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          curl -fL -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/actions/artifacts/10722640126/zip" -o base-artifact.zip
          unzip -q base-artifact.zip -d base-artifact
          SRCZIP=$(find base-artifact -type f -name 'SEAndroid_v100.0.6.zip' | head -1)
          test -n "$SRCZIP"
          unzip -q "$SRCZIP" -d source

      - name: Prepare v100.0.6 source for the full v7 patch
        working-directory: source
        run: python3 ../prepare_v7.py

      - name: Apply the core v7 patch
        working-directory: source
        run: python3 ../patch_v7.py

      - name: Apply Favorites base changes
        working-directory: source
        run: |
          python3 ../finish_v7.py

      - name: Validate finalizer syntax
        working-directory: source
        run: python3 -m py_compile ../finalize_v7.py

      - name: Apply final v7 repairs
        id: finalize
        continue-on-error: true
        working-directory: source
        run: |
          python3 ../finalize_v7.py 2>&1 | tee ../../finalizer.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Upload finalizer log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SEAndroid_v100.0.7-finalizer-log
          path: finalizer.log
          if-no-files-found: ignore

      - name: Stop after finalizer failure
        if: steps.finalize.outcome != 'success'
        run: exit 1

      - name: Verify v7 source
        working-directory: source/SEAndroid_v100.0.6
        run: |
          grep -q 'SEAndroid_v100.0.7' settings.gradle
          grep -q 'versionCode 1000007' app/build.gradle
          grep -q 'versionName "100.0.7"' app/build.gradle
          grep -q 'NestedScrollView' app/src/main/res/layout/activity_movie_detail.xml
          grep -q 'NestedScrollView' app/src/main/res/layout/activity_series_detail.xml
          grep -q 'GridLayoutManager(this@VodActivity, 2)' app/src/main/java/com/orbital/iptv/ui/vod/VodActivity.kt
          grep -q 'GridLayoutManager(this@SeriesActivity, 2)' app/src/main/java/com/orbital/iptv/ui/series/SeriesActivity.kt
          grep -q 'CATEGORY' app/src/main/java/com/orbital/iptv/data/model/FavouriteItem.kt
          grep -q 'rv_categories' app/src/main/res/layout/activity_favourites.xml
          grep -q 'toggleCategory' app/src/main/java/com/orbital/iptv/utils/FavouritesManager.kt

      - name: Rename source root to v7
        run: mv source/SEAndroid_v100.0.6 source/SEAndroid_v100.0.7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build APK
        id: build_apk
        continue-on-error: true
        working-directory: source/SEAndroid_v100.0.7
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../../build.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SEAndroid_v100.0.7-build-log
          path: build.log
          if-no-files-found: ignore

      - name: Stop after failed build
        if: steps.build_apk.outcome != 'success'
        run: exit 1

      - name: Package final APK and source
        run: |
          cp source/SEAndroid_v100.0.7/app/build/outputs/apk/debug/app-debug.apk SEAndroid_v100.0.7.apk
          cd source/SEAndroid_v100.0.7
          zip -qr ../../SEAndroid_v100.0.7.zip . -x '*/build/*' '*/.gradle/*'
          cd ../..
          test -s SEAndroid_v100.0.7.apk
          test -s SEAndroid_v100.0.7.zip

      - name: Upload APK and source
        uses: actions/upload-artifact@v4
        with:
          name: SEAndroid_v100.0.7
          path: |
            SEAndroid_v100.0.7.apk
            SEAndroid_v100.0.7.zip
          if-no-files-found: error
