name: SEAndroid v100.0.7 Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout clean repository
        uses: actions/checkout@v4

      - name: Download the verified v100.0.6 source artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          curl -fL -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/actions/artifacts/10722640126/zip" -o base-artifact.zip
          unzip -q base-artifact.zip -d base-artifact
          SRCZIP=$(find base-artifact -type f -name 'SEAndroid_v100.0.6.zip' | head -1)
          test -n "$SRCZIP"
          unzip -q "$SRCZIP" -d source

      - name: Apply all 10 requested changes
        working-directory: source
        run: |
          python3 ../patch_v7.py
          mv SEAndroid_v100.0.6 SEAndroid_v100.0.7
          test -f SEAndroid_v100.0.7/settings.gradle
          grep -q 'SEAndroid_v100.0.7' SEAndroid_v100.0.7/settings.gradle
          grep -q 'versionCode 1000007' SEAndroid_v100.0.7/app/build.gradle
          grep -q 'versionName "100.0.7"' SEAndroid_v100.0.7/app/build.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build APK
        working-directory: source/SEAndroid_v100.0.7
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Package final APK and source
        run: |
          cp source/SEAndroid_v100.0.7/app/build/outputs/apk/debug/app-debug.apk SEAndroid_v100.0.7.apk
          cd source/SEAndroid_v100.0.7
          zip -qr ../../SEAndroid_v100.0.7.zip . -x '*/build/*' '*/.gradle/*'
          cd ../..
          test -s SEAndroid_v100.0.7.apk
          test -s SEAndroid_v100.0.7.zip

      - name: Upload APK and source
        uses: actions/upload-artifact@v4
        with:
          name: SEAndroid_v100.0.7
          path: |
            SEAndroid_v100.0.7.apk
            SEAndroid_v100.0.7.zip
          if-no-files-found: error
