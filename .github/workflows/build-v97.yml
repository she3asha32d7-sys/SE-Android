name: SEAndroid v100.0.97 Build

on:
  push:
    branches:
      - v100.0.97
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Restore source V100.0.91
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/base /tmp/outsource
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10988041981/zip" -o /tmp/v91-artifact.zip
          unzip -q /tmp/v91-artifact.zip -d /tmp/base
          SRC=$(find /tmp/base -type f -name 'SE-Android-v100.0.91-source.zip' -print -quit)
          test -n "${SRC}"
          unzip -q "${SRC}" -d /tmp/outsource
          ROOT=$(find /tmp/outsource -type f -name settings.gradle -print -quit | xargs -r dirname)
          test -n "${ROOT}"
          echo "ROOT=${ROOT}" >> "${GITHUB_ENV}"

      - name: Apply V100.0.94 baseline
        run: python3 build_payload/apply_v94.py

      - name: Apply V100.0.95 Search baseline
        run: python3 build_payload/apply_v95.py

      - name: Apply V100.0.96 detail sizing fix
        run: python3 build_payload/apply_v96.py

      - name: Apply V100.0.97 Home scrollbar fix
        run: |
          set -euo pipefail
          python3 build_payload/apply_v97.py
          python3 -m py_compile build_payload/apply_v97.py
          grep -q 'isVerticalScrollBarEnabled = false' "${ROOT}/app/src/main/java/com/orbital/iptv/ui/home/HomeActivity.kt"
          grep -q 'android:scrollbars="none"' "${ROOT}/app/src/main/res/layout/activity_home.xml"
          grep -q 'versionName "100.0.97"' "${ROOT}/app/build.gradle"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: ${{ env.ROOT }}
        run: ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        working-directory: ${{ env.ROOT }}
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk >/dev/null

      - name: Package outputs
        working-directory: ${{ env.ROOT }}
        run: |
          set -euo pipefail
          mkdir -p out source
          cp app/build/outputs/apk/debug/app-debug.apk out/SE-Android-V100.0.97-debug.apk
          rsync -a --exclude='.git' --exclude='.gradle' --exclude='.idea' --exclude='app/build' --exclude='out' --exclude='source' --exclude='build_payload' --exclude='.github/workflows/build-v94.yml' --exclude='.github/workflows/build-v95.yml' --exclude='.github/workflows/build-v96.yml' --exclude='.github/workflows/build-v97.yml' ./ source/
          (cd source && zip -qr ../out/SE-Android-v100.0.97-source.zip .)

      - uses: actions/upload-artifact@v4
        with:
          name: SEAndroid-v100.0.97-debug-apk
          path: ${{ env.ROOT }}/out/SE-Android-V100.0.97-debug.apk
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: SEAndroid-v100.0.97-source
          path: ${{ env.ROOT }}/out/SE-Android-v100.0.97-source.zip
          retention-days: 30
