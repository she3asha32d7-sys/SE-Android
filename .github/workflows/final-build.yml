name: SEAndroid_v100.0.7 Build
run-name: SEAndroid_v100.0.7 Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager -perm -111 | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Download last known good SEAndroid source
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p old_artifact work/input package signing
          curl -fsSL             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GITHUB_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10722640126/zip"             -o old_artifact.zip
          unzip -q old_artifact.zip -d old_artifact
          test -s old_artifact/SEAndroid_v100.0.6.zip
          unzip -q old_artifact/SEAndroid_v100.0.6.zip -d work/input
          ROOT="$(find work/input -type f -name gradlew -print -quit | xargs -r dirname)"
          test -n "$ROOT"
          cp -a "$ROOT"/. work/
          chmod +x work/gradlew
          test -f work/settings.gradle || test -f work/settings.gradle.kts

      - name: Apply v100.0.7 version and search-source fixes
        shell: bash
        run: |
          set -euo pipefail
          cp fix_v7.py work/fix_v7.py
          (cd work && python3 fix_v7.py)

      - name: Verify release identity and known-good feature base
        shell: bash
        run: |
          set -euo pipefail
          test -f work/settings.gradle
          test -f work/app/build.gradle
          test -f work/app/src/main/java/com/orbital/iptv/ui/search/GlobalSearchActivity.kt
          python3 - <<'PY'
          from pathlib import Path
          root=Path("work")
          checks={
            "two-column Movies": ("app/src/main/java/com/orbital/iptv/ui/vod/VodActivity.kt","GridLayoutManager("),
            "two-column Series": ("app/src/main/java/com/orbital/iptv/ui/series/SeriesActivity.kt","GridLayoutManager("),
            "movie detail scroll": ("app/src/main/res/layout/activity_movie_detail.xml","NestedScrollView"),
            "series detail scroll": ("app/src/main/res/layout/activity_series_detail.xml","NestedScrollView"),
            "movie year": ("app/src/main/res/layout/activity_movie_detail.xml","tv_year_badge"),
            "live favorites": ("app/src/main/res/layout/item_live_channel.xml","btn_fav"),
            "category favorites": ("app/src/main/java/com/orbital/iptv/utils/FavouritesManager.kt","toggleCategory"),
            "favorites sections": ("app/src/main/java/com/orbital/iptv/ui/favourites/FavouritesActivity.kt","rvCategories"),
            "main sidebar": ("app/src/main/res/layout/layout_main_sidebar.xml","nav_favourites"),
            "search source handling": ("app/src/main/java/com/orbital/iptv/ui/search/GlobalSearchActivity.kt","SearchSource.IptvSeries"),
          }
          for name,(rel,needle) in checks.items():
              data=(root/rel).read_text(encoding="utf-8")
              if needle not in data:
                  raise SystemExit("missing known-good feature: "+name)
          print("Known-good v6 feature base verified; v7 identity/search changes will be built.")
          PY

      - name: Build release APK
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew clean assembleRelease --stacktrace --no-daemon
          test -f app/build/outputs/apk/release/app-release.apk

      - name: Sign and verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="work/app/build/outputs/apk/release/app-release.apk"
          keytool -genkeypair -keystore signing/se-release.keystore -storepass changeit -keypass changeit -alias se-release -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=SE IPTV PLAYER, OU=SE, O=SE, L=Unknown, ST=Unknown, C=EG" -noprompt
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -perm -111 | sort -V | tail -n 1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign -perm -111 | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -perm -111 | sort -V | tail -n 1)"
          test -n "$APKSIGNER" && test -n "$ZIPALIGN" && test -n "$AAPT"
          "$ZIPALIGN" -f -p 4 "$APK" package/SEAndroid_v100.0.7-aligned.apk
          "$APKSIGNER" sign --ks signing/se-release.keystore --ks-pass pass:changeit --key-pass pass:changeit --ks-key-alias se-release --out package/SEAndroid_v100.0.7.apk package/SEAndroid_v100.0.7-aligned.apk
          rm -f package/SEAndroid_v100.0.7-aligned.apk
          "$APKSIGNER" verify --verbose package/SEAndroid_v100.0.7.apk
          "$AAPT" dump badging package/SEAndroid_v100.0.7.apk | grep -q 'versionName='\"100.0.7\"

      - name: Package source ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work/.gradle work/.kotlin work/build work/app/build work/input work/fix_v7.py
          rm -f signing/se-release.keystore
          (cd work && zip -qr ../package/SEAndroid_v100.0.7.zip . -x ".git/*")
          unzip -t package/SEAndroid_v100.0.7.zip >/dev/null

      - name: Final verification
        shell: bash
        run: |
          set -euo pipefail
          test -s package/SEAndroid_v100.0.7.apk
          test -s package/SEAndroid_v100.0.7.zip
          unzip -p package/SEAndroid_v100.0.7.zip app/build.gradle | grep -q 'versionName "100.0.7"'
          unzip -p package/SEAndroid_v100.0.7.zip settings.gradle | grep -q 'SEAndroid_v100.0.7'
          unzip -p package/SEAndroid_v100.0.7.zip app/src/main/java/com/orbital/iptv/ui/search/GlobalSearchActivity.kt | grep -Fq '$username @ '
          ls -lh package/SEAndroid_v100.0.7.apk package/SEAndroid_v100.0.7.zip

      - name: Upload APK and source
        uses: actions/upload-artifact@v4
        with:
          name: SEAndroid_v100.0.7
          path: |
            package/SEAndroid_v100.0.7.apk
            package/SEAndroid_v100.0.7.zip
          retention-days: 30
