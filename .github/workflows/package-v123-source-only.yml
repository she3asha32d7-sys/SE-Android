name: Package SE Android V123 Source Only

on:
  push:
    branches:
      - work-v124-source-only
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout payload branch
        uses: actions/checkout@v4

      - name: Reconstruct source 122 from V112 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/base /tmp/source /tmp/parts
          curl -fL --retry 10 --retry-delay 2 --retry-all-errors \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/11060581322/zip" \
            -o /tmp/v112-artifact.zip
          unzip -q /tmp/v112-artifact.zip -d /tmp/base
          SRCZIP=$(find /tmp/base -type f -name 'SE-Android-v100.0.112-source.zip' -print -quit)
          test -n "${SRCZIP}"
          unzip -q "${SRCZIP}" -d /tmp/source
          ROOT=$(find /tmp/source -type f -name settings.gradle -print -quit | xargs -r dirname)
          test -n "${ROOT}"
          echo "ROOT=${ROOT}" >> "${GITHUB_ENV}"

          for p in partaa partab partac partad partae; do
            curl -fL --retry 8 --retry-delay 2 --retry-all-errors \
              "https://raw.githubusercontent.com/she3asha32d7-sys/SE-Android/6cb452e0abe4c9595c3833ac241fa5456ab17b8a/build_payload/v112_to_v122_parts/${p}.b64" \
              -o "/tmp/parts/${p}.b64"
          done
          cat /tmp/parts/partaa.b64 /tmp/parts/partab.b64 /tmp/parts/partac.b64 /tmp/parts/partad.b64 /tmp/parts/partae.b64 \
            | tr -d '\r\n' > /tmp/v112_to_v122.patch.xz.b64
          echo "a00ec9b1b48aff18018cf92252f60ba1cf141bf20d4c8ca0b46291ba6ce993de  /tmp/v112_to_v122.patch.xz.b64" | sha256sum -c -
          base64 -d /tmp/v112_to_v122.patch.xz.b64 > /tmp/v112_to_v122.patch.xz
          echo "b60a0db9c99e47daa10838e85390e070c727c5bd9345d6eabfc1484e39995454  /tmp/v112_to_v122.patch.xz" | sha256sum -c -
          xz -dc /tmp/v112_to_v122.patch.xz > /tmp/v112_to_v122.patch
          cd "${ROOT}"
          patch -p1 --forward < /tmp/v112_to_v122.patch

      - name: Bump reconstructed source to V123
        env:
          ROOT: ${{ env.ROOT }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          root = Path(os.environ["ROOT"])

          gradle = root / "app/build.gradle"
          s = gradle.read_text(encoding="utf-8")
          s = re.sub(r'(?m)^(\s*versionCode\s+)\d+', r'\\g<1>1000123', s)
          s = re.sub(r'(?m)^(\s*versionName\s+)"[^"]+"', r'\\g<1>"100.0.123"', s)
          gradle.write_text(s, encoding="utf-8")

          settings = root / "settings.gradle"
          if settings.exists():
              t = settings.read_text(encoding="utf-8")
              t = t.replace("100.0.122", "100.0.123").replace("1000122", "1000123").replace("V100.0.122", "V100.0.123")
              if "rootProject.name" in t:
                  t = re.sub(r'(?m)^\s*rootProject\.name\s*=\s*["\'][^"\']+["\']', 'rootProject.name = "SEAndroid_v100.0.123"', t)
              else:
                  t += '\nrootProject.name = "SEAndroid_v100.0.123"\n'
              settings.write_text(t, encoding="utf-8")

          for rel in ("SE_BUILD_MANIFEST.txt", "app/src/main/res/layout/activity_settings.xml"):
              p = root / rel
              if p.exists():
                  t = p.read_text(encoding="utf-8").replace("100.0.122", "100.0.123").replace("1000122", "1000123").replace("V100.0.122", "V100.0.123")
                  p.write_text(t, encoding="utf-8")
          PY

      - name: Package exact V123 source
        env:
          ROOT: ${{ env.ROOT }}
        run: |
          set -euo pipefail
          rm -rf out source-package
          mkdir -p out source-package
          rsync -a "${ROOT}/" source-package/ \
            --exclude='.git' --exclude='.gradle' --exclude='.idea' \
            --exclude='app/build' --exclude='out' --exclude='source-package' \
            --exclude='build_payload' --exclude='.github'
          (cd source-package && zip -qr ../out/SE-Android-v100.0.123-source.zip .)
          unzip -t out/SE-Android-v100.0.123-source.zip >/dev/null
          test -s out/SE-Android-v100.0.123-source.zip

      - name: Upload V123 source
        uses: actions/upload-artifact@v4
        with:
          name: SEAndroid-v100.0.123-source-only
          path: out/SE-Android-v100.0.123-source.zip
          if-no-files-found: error
          retention-days: 7
